# =============================================================================
# PS4 SPI Flash Dump, Verify & Write - MX25L25635F (32MB)
# =============================================================================
#
# PURPOSE: Safely read, verify, write and smart-patch the contents of a
#          Macronix MX25L25635F SPI NOR flash (256Mbit / 32MB) using SD card.
#
# OPERATIONS:
#   1. Read JEDEC ID   - Quick connectivity test
#   2. Dump Flash      - Read entire flash to file (configurable via File Name input)
#   3. Verify Dump     - Re-read and compare byte-by-byte against file
#   4. Sanity Check    - Analyze dump file for blank/erased patterns
#   5. Write to Flash  - Write file to flash (full overwrite, must match capacity)
#   6. Smart Write     - Compare file vs flash, only erase+write changed sectors
#
# SAFETY:
#   - For READ-ONLY operations: tie WP# to GND
#   - For WRITE operations: tie WP# to VCC (3.3V)
#   - Smart Write minimizes modifications (sector-level diff)
#   - All write operations include post-write verification
#
# WIRING (Flash SOP16 to ESP32-S3):
#   Flash Pin 15 (SIO0/MOSI) -> ESP32-S3 GPIO11 (SPI MOSI)
#   Flash Pin 8  (SIO1/MISO) -> ESP32-S3 GPIO13 (SPI MISO)
#   Flash Pin 16 (SCLK)      -> ESP32-S3 GPIO12 (SPI CLK)
#   Flash Pin 7  (CS#)       -> ESP32-S3 GPIO10 (CS)
#   Flash Pin 2  (VCC)       -> 3.3V
#   Flash Pin 10 (GND)       -> GND
#   Flash Pin 9  (WP#)       -> GND (read-only) or VCC (read-write)
#   Flash Pin 3  (RESET#)    -> 3.3V (or leave floating, has internal pullup)
#   Flash Pin 1  (SIO3/HOLD) -> 3.3V (disable HOLD function)
#
# SD CARD (SD-MMC 1-bit mode):
#   SD CLK  -> GPIO39
#   SD CMD  -> GPIO38
#   SD DAT0 -> GPIO40
#
# I2C OLED Display (SSD1306 128x64):
#   SDA -> GPIO8
#   SCL -> GPIO9
#
# ADJUST PINS TO YOUR ACTUAL WIRING BEFORE COMPILING!
# =============================================================================

esphome:
  name: ps4-flash-dumper
  friendly_name: PS4 Flash Dumper
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

# Enable logging at DEBUG level to see all flash detection messages
logger:
  level: DEBUG

# WiFi not strictly needed for dump - but useful for monitoring logs remotely
# Comment out if you want to run fully offline
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

# --- I2C Bus (for OLED display) ---
i2c:
  sda: GPIO8
  scl: GPIO9

# --- SPI Bus for the external flash chip ---
spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13

# --- SD Card (SD-MMC 1-bit mode, no SPI bus needed) ---
sd_storage:
  id: sd_card
  type: sd_mmc
  clk_pin: GPIO39
  cmd_pin: GPIO38
  data0_pin: GPIO40
  mode_1bit: true
  path: /sdcard

# --- External SPI Flash (MX25L25635F) ---
# mode: raw = pure binary access, NO filesystem/littlefs
# Capacity will be auto-detected from JEDEC ID (0xC22019 = 32MB)
# 4-byte addressing is auto-enabled when capacity > 16MB
external_components:
  - source:
      type: local
      path: ../esphome/components
    components:
      - binary_storage
      - storage

binary_storage:
  - type: SPI_FLASH
    id: ps4_flash
    model: "MX25L25635F"
    mode: raw
    cs_pin: GPIO10

# --- OLED Display (128x64) ---
# NOTE: Font with id "my_font" must be defined elsewhere in your config
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    id: i2c_screen
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      // --- Top bar: Flash info with JEDEC ID ---
      auto *flash = id(ps4_flash);
      uint32_t cap = flash->get_capacity();
      uint8_t mfg = flash->get_manufacturer_id();
      uint16_t dev = flash->get_device_id();

      // Flash info line: model + JEDEC + capacity
      if (cap > 0) {
        it.printf(0, 0, id(my_font), "%02X:%04X %s %.0fMB",
                  mfg, dev, flash->get_device_name(), cap / (1024.0f * 1024.0f));
      } else {
        it.print(0, 0, id(my_font), "No flash detected");
      }

      // Divider line
      it.line(0, 12, 127, 12);

      // --- Operation name ---
      if (id(op_status).has_state()) {
        it.print(0, 15, id(my_font), id(op_status).state.c_str());
      } else {
        it.print(0, 15, id(my_font), "Idle");
      }

      // --- Progress bar (visual) ---
      float pct = 0.0f;
      if (id(op_progress).has_state()) {
        pct = id(op_progress).state;
      }

      // Bar outline: x=0, y=30, w=128, h=10
      it.rectangle(0, 30, 128, 10);
      // Bar fill
      int fill_w = (int)(pct / 100.0f * 126.0f);
      if (fill_w > 0) {
        it.filled_rectangle(1, 31, fill_w, 8);
      }

      // Percentage text right of bar
      it.printf(0, 42, id(my_font), "%.1f%%", pct);

      // --- Operation detail line ---
      if (id(op_detail).has_state()) {
        it.print(0, 56, id(my_font), id(op_detail).state.c_str());
      }

# --- Generalized operation progress sensor ---
sensor:
  - platform: template
    name: "Operation Progress"
    id: op_progress
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: mdi:progress-download

# --- Generalized operation status text sensors ---
text_sensor:
  - platform: template
    name: "Operation Status"
    id: op_status
    icon: mdi:information-outline
  - platform: template
    name: "Operation Detail"
    id: op_detail
    icon: mdi:text-box-outline

# --- File name input (changeable from HA or API) ---
text:
  - platform: template
    name: "File Name"
    id: file_name
    icon: mdi:file
    optimistic: true
    initial_value: "/sdcard/ps4_dump.bin"
    min_length: 1
    max_length: 64
    mode: text

# --- Buttons to trigger operations ---
button:
  # =====================================================================
  # BUTTON 1: Read JEDEC ID (quick connectivity test)
  # =====================================================================
  - platform: template
    name: "Read JEDEC ID"
    id: btn_jedec
    icon: mdi:chip
    on_press:
      then:
        - lambda: |-
            auto *flash = id(ps4_flash);

            id(op_status).publish_state("Reading JEDEC ID...");
            id(op_progress).publish_state(0.0f);
            id(op_detail).publish_state("");

            if (flash->is_failed()) {
              ESP_LOGE("jedec", "Flash component failed during setup - check wiring!");
              id(op_status).publish_state("FAILED: Check wiring");
              return;
            }

            uint32_t jedec = flash->read_jedec_id();
            uint32_t capacity = flash->get_capacity();

            ESP_LOGI("jedec", "========================================");
            ESP_LOGI("jedec", "  JEDEC ID: 0x%06X", jedec);
            ESP_LOGI("jedec", "  Manufacturer: 0x%02X", (jedec >> 16) & 0xFF);
            ESP_LOGI("jedec", "  Device ID: 0x%04X", jedec & 0xFFFF);
            ESP_LOGI("jedec", "  Capacity: %u bytes (%.1f MB)", capacity, capacity / (1024.0f * 1024.0f));

            id(op_progress).publish_state(100.0f);

            if (jedec == 0xC22019) {
              ESP_LOGI("jedec", "  >>> MX25L25635F detected! <<<");
              id(op_status).publish_state("MX25L25635F detected!");
              char det[48];
              snprintf(det, sizeof(det), "JEDEC:0x%06X %uMB", jedec, capacity / (1024 * 1024));
              id(op_detail).publish_state(det);
            } else if (jedec == 0x000000 || jedec == 0xFFFFFF) {
              ESP_LOGE("jedec", "  NO CHIP DETECTED! Check wiring!");
              id(op_status).publish_state("NO CHIP - check wiring!");
            } else {
              char msg[48];
              snprintf(msg, sizeof(msg), "Chip: 0x%06X (%u MB)", jedec, capacity / (1024 * 1024));
              id(op_status).publish_state(msg);
            }
            ESP_LOGI("jedec", "========================================");

  # =====================================================================
  # BUTTON 1b: Read/Clear Status Register (diagnose write protection)
  # Reads SR1 and SR2, logs all bits, clears block protection if set.
  # Must run before write operations if BP bits are blocking writes.
  # =====================================================================
  - platform: template
    name: "Read/Clear Status Reg"
    id: btn_status_reg
    icon: mdi:shield-lock-open-outline
    on_press:
      then:
        - lambda: |-
            auto *flash = id(ps4_flash);

            id(op_status).publish_state("Reading status regs...");
            id(op_progress).publish_state(0.0f);

            if (flash->is_failed()) {
              ESP_LOGE("sreg", "Flash component failed - check wiring!");
              id(op_status).publish_state("FAILED: Check wiring");
              return;
            }

            // Read both status registers
            uint8_t sr1 = flash->read_status_register();
            uint8_t sr2 = flash->read_status_register2();

            ESP_LOGI("sreg", "========================================");
            ESP_LOGI("sreg", "  STATUS REGISTER 1: 0x%02X (binary: %c%c%c%c%c%c%c%c)",
                     sr1,
                     (sr1 & 0x80) ? '1' : '0',  // SRP0
                     (sr1 & 0x40) ? '1' : '0',  // SEC
                     (sr1 & 0x20) ? '1' : '0',  // TB
                     (sr1 & 0x10) ? '1' : '0',  // BP2
                     (sr1 & 0x08) ? '1' : '0',  // BP1
                     (sr1 & 0x04) ? '1' : '0',  // BP0
                     (sr1 & 0x02) ? '1' : '0',  // WEL
                     (sr1 & 0x01) ? '1' : '0'); // BUSY
            ESP_LOGI("sreg", "  Bit 7 SRP0 (SR Protect):  %s", (sr1 & 0x80) ? "SET" : "clear");
            ESP_LOGI("sreg", "  Bit 6 SEC  (Sector/Block): %s", (sr1 & 0x40) ? "SET (sector)" : "clear (block)");
            ESP_LOGI("sreg", "  Bit 5 TB   (Top/Bottom):   %s", (sr1 & 0x20) ? "SET (bottom)" : "clear (top)");
            ESP_LOGI("sreg", "  Bit 4 BP2:                 %s", (sr1 & 0x10) ? "SET" : "clear");
            ESP_LOGI("sreg", "  Bit 3 BP1:                 %s", (sr1 & 0x08) ? "SET" : "clear");
            ESP_LOGI("sreg", "  Bit 2 BP0:                 %s", (sr1 & 0x04) ? "SET" : "clear");
            ESP_LOGI("sreg", "  Bit 1 WEL (Write Enable):  %s", (sr1 & 0x02) ? "SET" : "clear");
            ESP_LOGI("sreg", "  Bit 0 BUSY:                %s", (sr1 & 0x01) ? "SET" : "clear");

            ESP_LOGI("sreg", "  STATUS REGISTER 2: 0x%02X", sr2);
            ESP_LOGI("sreg", "  Bit 1 QE  (Quad Enable):   %s", (sr2 & 0x02) ? "SET" : "clear");
            ESP_LOGI("sreg", "  Bit 0 SRP1:                %s", (sr2 & 0x01) ? "SET" : "clear");
            ESP_LOGI("sreg", "========================================");

            // Check if any block protection bits are set
            uint8_t bp_bits = sr1 & 0x7C;  // BP0(2), BP1(3), BP2(4), TB(5), SEC(6)
            if (bp_bits != 0) {
              ESP_LOGW("sreg", "  BLOCK PROTECTION IS ACTIVE! (BP bits: 0x%02X)", bp_bits);
              ESP_LOGW("sreg", "  Clearing all block protection bits...");

              char det[48];
              snprintf(det, sizeof(det), "SR1:0x%02X BP active! Clearing...", sr1);
              id(op_detail).publish_state(det);

              // Clear BP0, BP1, BP2, TB, SEC bits - keep SRP0 as-is
              uint8_t new_sr1 = sr1 & 0x83;  // Keep SRP0(7), WEL(1), BUSY(0) - clear bits 2-6

              // Write status registers (handles write_enable + wait internally)
              if (!flash->write_status_registers(new_sr1, sr2)) {
                ESP_LOGE("sreg", "  Failed to write status registers!");
                ESP_LOGE("sreg", "  Check: WP# must be VCC (3.3V)!");
                id(op_status).publish_state("FAILED: SR write failed");
                id(op_detail).publish_state("Check WP# is on VCC!");
                return;
              }

              // Verify the change
              uint8_t verify_sr1 = flash->read_status_register();
              uint8_t verify_bp = verify_sr1 & 0x7C;

              ESP_LOGI("sreg", "  After clear: SR1 = 0x%02X", verify_sr1);

              if (verify_bp == 0) {
                ESP_LOGI("sreg", "  Block protection CLEARED successfully!");
                char msg[48];
                snprintf(msg, sizeof(msg), "BP cleared! 0x%02X -> 0x%02X", sr1, verify_sr1);
                id(op_status).publish_state(msg);
                id(op_detail).publish_state("All blocks now writable");
              } else {
                ESP_LOGE("sreg", "  Failed to clear BP bits! SR1 still 0x%02X", verify_sr1);
                ESP_LOGE("sreg", "  Check: WP# must be VCC, SRP0 may be locking SR");
                char msg[48];
                snprintf(msg, sizeof(msg), "BP clear FAILED! SR1=0x%02X", verify_sr1);
                id(op_status).publish_state(msg);
                id(op_detail).publish_state("Check WP#=VCC and SRP0");
              }
            } else {
              ESP_LOGI("sreg", "  No block protection - all sectors writable!");
              char msg[48];
              snprintf(msg, sizeof(msg), "SR1:0x%02X SR2:0x%02X - No BP", sr1, sr2);
              id(op_status).publish_state(msg);
              id(op_detail).publish_state("All blocks writable");
            }

            id(op_progress).publish_state(100.0f);

  # =====================================================================
  # BUTTON 2: Dump flash to SD card
  # Reads the entire flash content and writes it to the configured file
  # =====================================================================
  - platform: template
    name: "Dump Flash to SD"
    id: btn_dump
    icon: mdi:content-save
    on_press:
      then:
        - lambda: |-
            auto *flash = id(ps4_flash);
            uint32_t capacity = flash->get_capacity();
            std::string filepath = id(file_name).state;

            if (capacity == 0) {
              ESP_LOGE("dump", "Flash capacity is 0 - chip not detected!");
              id(op_status).publish_state("FAILED: No chip detected");
              return;
            }

            ESP_LOGI("dump", "Starting flash dump: %u bytes to %s", capacity, filepath.c_str());
            id(op_status).publish_state("Dumping...");
            id(op_progress).publish_state(0.0f);
            id(op_detail).publish_state(filepath.c_str());

            // Open output file on SD card
            FILE *f = fopen(filepath.c_str(), "wb");
            if (f == nullptr) {
              ESP_LOGE("dump", "Failed to open %s for writing!", filepath.c_str());
              id(op_status).publish_state("FAILED: SD write error");
              return;
            }

            // Allocate read buffer in PSRAM
            const size_t chunk_size = 16384;  // 16KB chunks
            RAMAllocator<uint8_t> allocator(RAMAllocator<uint8_t>::ALLOC_EXTERNAL);
            uint8_t *buf = allocator.allocate(chunk_size);
            if (buf == nullptr) {
              ESP_LOGE("dump", "Failed to allocate read buffer in PSRAM!");
              id(op_status).publish_state("FAILED: Out of memory");
              fclose(f);
              return;
            }

            uint32_t address = 0;
            uint32_t total_read = 0;
            bool success = true;
            uint32_t last_progress_report = 0;

            while (address < capacity) {
              size_t len = chunk_size;
              if (address + len > capacity) {
                len = capacity - address;
              }

              if (!flash->read(address, buf, len)) {
                ESP_LOGE("dump", "Read failed at address 0x%08X!", address);
                id(op_status).publish_state("FAILED: Read error");
                char det[32];
                snprintf(det, sizeof(det), "Fail @ 0x%08X", address);
                id(op_detail).publish_state(det);
                success = false;
                break;
              }

              size_t written = fwrite(buf, 1, len, f);
              if (written != len) {
                ESP_LOGE("dump", "SD write failed at address 0x%08X!", address);
                id(op_status).publish_state("FAILED: SD write error");
                success = false;
                break;
              }

              address += len;
              total_read += len;

              // Report progress every 1MB
              if (total_read - last_progress_report >= 1024 * 1024) {
                float pct = (float) total_read / (float) capacity * 100.0f;
                id(op_progress).publish_state(pct);
                ESP_LOGI("dump", "Progress: %.1f%% (%u / %u bytes)", pct, total_read, capacity);
                char det[32];
                snprintf(det, sizeof(det), "%uMB / %uMB", total_read / (1024*1024), capacity / (1024*1024));
                id(op_detail).publish_state(det);
                last_progress_report = total_read;
                App.feed_wdt();
                id(i2c_screen).update();
              }
            }

            allocator.deallocate(buf, chunk_size);
            fclose(f);

            if (success) {
              id(op_progress).publish_state(100.0f);
              ESP_LOGI("dump", "========================================");
              ESP_LOGI("dump", "  DUMP COMPLETE: %u bytes written", total_read);
              ESP_LOGI("dump", "  File: %s", filepath.c_str());
              ESP_LOGI("dump", "========================================");
              id(op_status).publish_state("DUMP OK - Run verify!");
              id(op_detail).publish_state(filepath.c_str());
            }

  # =====================================================================
  # BUTTON 3: Verify dump against flash (re-reads and compares)
  # =====================================================================
  - platform: template
    name: "Verify Dump"
    id: btn_verify
    icon: mdi:check-decagram
    on_press:
      then:
        - lambda: |-
            auto *flash = id(ps4_flash);
            uint32_t capacity = flash->get_capacity();
            std::string filepath = id(file_name).state;

            if (capacity == 0) {
              ESP_LOGE("verify", "Flash capacity is 0 - chip not detected!");
              id(op_status).publish_state("VERIFY FAILED: No chip");
              return;
            }

            // Open dump file for reading
            FILE *f = fopen(filepath.c_str(), "rb");
            if (f == nullptr) {
              ESP_LOGE("verify", "Failed to open %s - dump first!", filepath.c_str());
              id(op_status).publish_state("VERIFY FAILED: No dump file");
              return;
            }

            // Check file size matches capacity
            fseek(f, 0, SEEK_END);
            long file_size = ftell(f);
            fseek(f, 0, SEEK_SET);

            if ((uint32_t) file_size != capacity) {
              ESP_LOGE("verify", "File size mismatch! File: %ld, Flash: %u", file_size, capacity);
              id(op_status).publish_state("VERIFY FAILED: Size mismatch");
              fclose(f);
              return;
            }

            ESP_LOGI("verify", "Starting verification: %u bytes", capacity);
            id(op_status).publish_state("Verifying...");
            id(op_progress).publish_state(0.0f);
            id(op_detail).publish_state("Comparing flash vs dump");

            // Allocate both buffers in PSRAM
            const size_t chunk_size = 16384;  // 16KB chunks
            RAMAllocator<uint8_t> allocator(RAMAllocator<uint8_t>::ALLOC_EXTERNAL);
            uint8_t *flash_buf = allocator.allocate(chunk_size);
            uint8_t *file_buf = allocator.allocate(chunk_size);
            if (flash_buf == nullptr || file_buf == nullptr) {
              ESP_LOGE("verify", "Failed to allocate buffers in PSRAM!");
              id(op_status).publish_state("VERIFY FAILED: Out of memory");
              if (flash_buf) allocator.deallocate(flash_buf, chunk_size);
              if (file_buf) allocator.deallocate(file_buf, chunk_size);
              fclose(f);
              return;
            }

            uint32_t address = 0;
            uint32_t total_verified = 0;
            uint32_t mismatch_count = 0;
            uint32_t last_progress_report = 0;
            bool read_error = false;

            while (address < capacity) {
              size_t len = chunk_size;
              if (address + len > capacity) {
                len = capacity - address;
              }

              // Read from flash
              if (!flash->read(address, flash_buf, len)) {
                ESP_LOGE("verify", "Flash read failed at 0x%08X!", address);
                id(op_status).publish_state("VERIFY FAILED: Read error");
                read_error = true;
                break;
              }

              // Read from file
              size_t file_read = fread(file_buf, 1, len, f);
              if (file_read != len) {
                ESP_LOGE("verify", "File read failed at 0x%08X!", address);
                id(op_status).publish_state("VERIFY FAILED: File read error");
                read_error = true;
                break;
              }

              // Compare byte-by-byte
              for (size_t i = 0; i < len; i++) {
                if (flash_buf[i] != file_buf[i]) {
                  if (mismatch_count < 10) {
                    ESP_LOGE("verify", "MISMATCH at 0x%08X: flash=0x%02X file=0x%02X",
                             address + i, flash_buf[i], file_buf[i]);
                  }
                  mismatch_count++;
                }
              }

              address += len;
              total_verified += len;

              // Report progress every 1MB
              if (total_verified - last_progress_report >= 1024 * 1024) {
                float pct = (float) total_verified / (float) capacity * 100.0f;
                id(op_progress).publish_state(pct);
                ESP_LOGI("verify", "Verified: %.1f%% (%u / %u bytes), mismatches: %u",
                         pct, total_verified, capacity, mismatch_count);
                char det[48];
                snprintf(det, sizeof(det), "%uMB verified, %u bad", total_verified / (1024*1024), mismatch_count);
                id(op_detail).publish_state(det);
                last_progress_report = total_verified;
                App.feed_wdt();
                id(i2c_screen).update();
              }
            }

            allocator.deallocate(flash_buf, chunk_size);
            allocator.deallocate(file_buf, chunk_size);
            fclose(f);

            if (!read_error) {
              id(op_progress).publish_state(100.0f);
              if (mismatch_count == 0) {
                ESP_LOGI("verify", "========================================");
                ESP_LOGI("verify", "  VERIFICATION PASSED");
                ESP_LOGI("verify", "  %u bytes verified, 0 mismatches", total_verified);
                ESP_LOGI("verify", "========================================");
                id(op_status).publish_state("VERIFY PASSED!");
                id(op_detail).publish_state("0 mismatches - perfect");
              } else {
                ESP_LOGE("verify", "========================================");
                ESP_LOGE("verify", "  VERIFICATION FAILED!");
                ESP_LOGE("verify", "  %u mismatches in %u bytes!", mismatch_count, total_verified);
                ESP_LOGE("verify", "  DO NOT TRUST THIS DUMP!");
                ESP_LOGE("verify", "========================================");
                char msg[64];
                snprintf(msg, sizeof(msg), "VERIFY FAILED: %u mismatches!", mismatch_count);
                id(op_status).publish_state(msg);
              }
            }

  # =====================================================================
  # BUTTON 4: Sanity check the dump file
  # =====================================================================
  - platform: template
    name: "Sanity Check Dump"
    id: btn_sanity
    icon: mdi:stethoscope
    on_press:
      then:
        - lambda: |-
            std::string filepath = id(file_name).state;
            id(op_status).publish_state("Analyzing dump...");
            id(op_progress).publish_state(0.0f);
            id(op_detail).publish_state(filepath.c_str());

            FILE *f = fopen(filepath.c_str(), "rb");
            if (f == nullptr) {
              ESP_LOGE("sanity", "No dump file found: %s", filepath.c_str());
              id(op_status).publish_state("SANITY: No dump file");
              return;
            }

            fseek(f, 0, SEEK_END);
            long file_size = ftell(f);
            fseek(f, 0, SEEK_SET);

            ESP_LOGI("sanity", "Analyzing dump: %ld bytes (%.1f MB)", file_size, file_size / (1024.0f * 1024.0f));

            // Allocate buffer in PSRAM
            const size_t chunk_size = 16384;  // 16KB chunks
            RAMAllocator<uint8_t> allocator(RAMAllocator<uint8_t>::ALLOC_EXTERNAL);
            uint8_t *buf = allocator.allocate(chunk_size);
            if (buf == nullptr) {
              ESP_LOGE("sanity", "Failed to allocate buffer in PSRAM!");
              id(op_status).publish_state("SANITY: Out of memory");
              fclose(f);
              return;
            }

            uint32_t count_00 = 0;
            uint32_t count_ff = 0;
            uint32_t total = 0;

            // Check first 16 bytes for display
            fread(buf, 1, 16, f);
            fseek(f, 0, SEEK_SET);

            ESP_LOGI("sanity", "First 16 bytes:");
            ESP_LOGI("sanity", "  %02X %02X %02X %02X %02X %02X %02X %02X  %02X %02X %02X %02X %02X %02X %02X %02X",
                     buf[0], buf[1], buf[2], buf[3], buf[4], buf[5], buf[6], buf[7],
                     buf[8], buf[9], buf[10], buf[11], buf[12], buf[13], buf[14], buf[15]);

            // Scan entire file
            while (total < (uint32_t) file_size) {
              size_t len = chunk_size;
              if (total + len > (uint32_t) file_size) {
                len = file_size - total;
              }

              size_t bytes_read = fread(buf, 1, len, f);
              if (bytes_read != len) break;

              for (size_t i = 0; i < len; i++) {
                if (buf[i] == 0x00) count_00++;
                if (buf[i] == 0xFF) count_ff++;
              }

              total += len;

              if (total % (4 * 1024 * 1024) == 0) {
                float pct = (float) total / (float) file_size * 100.0f;
                id(op_progress).publish_state(pct);
                App.feed_wdt();
                id(i2c_screen).update();
              }
            }

            allocator.deallocate(buf, chunk_size);
            fclose(f);

            id(op_progress).publish_state(100.0f);

            float pct_00 = (float) count_00 / (float) total * 100.0f;
            float pct_ff = (float) count_ff / (float) total * 100.0f;
            float pct_data = 100.0f - pct_00 - pct_ff;

            ESP_LOGI("sanity", "========================================");
            ESP_LOGI("sanity", "  DUMP ANALYSIS RESULTS");
            ESP_LOGI("sanity", "  Total size: %u bytes (%.1f MB)", total, total / (1024.0f * 1024.0f));
            ESP_LOGI("sanity", "  0x00 bytes: %u (%.1f%%)", count_00, pct_00);
            ESP_LOGI("sanity", "  0xFF bytes: %u (%.1f%%)", count_ff, pct_ff);
            ESP_LOGI("sanity", "  Other data: %.1f%%", pct_data);

            char det[48];
            snprintf(det, sizeof(det), "00:%.0f%% FF:%.0f%% data:%.0f%%", pct_00, pct_ff, pct_data);
            id(op_detail).publish_state(det);

            if (pct_ff > 99.0f) {
              ESP_LOGW("sanity", "  WARNING: Dump appears BLANK/ERASED (>99%% 0xFF)!");
              id(op_status).publish_state("SANITY: Looks BLANK!");
            } else if (pct_00 > 99.0f) {
              ESP_LOGW("sanity", "  WARNING: Dump appears ALL ZEROS (>99%% 0x00)!");
              id(op_status).publish_state("SANITY: All zeros!");
            } else if (pct_00 > 90.0f || pct_ff > 90.0f) {
              ESP_LOGW("sanity", "  WARNING: Suspiciously uniform content");
              id(op_status).publish_state("SANITY: Suspicious!");
            } else {
              ESP_LOGI("sanity", "  Content looks reasonable");
              id(op_status).publish_state("SANITY: Looks good!");
            }
            ESP_LOGI("sanity", "========================================");

  # =====================================================================
  # BUTTON 5: Write SD file to Flash (full overwrite)
  # Reads configured file and writes entire contents to flash.
  # File size must exactly match flash capacity.
  # Erases sector-by-sector, then writes page-aligned.
  # Auto-verifies after write.
  # =====================================================================
  - platform: template
    name: "Write SD to Flash"
    id: btn_write
    icon: mdi:content-copy
    on_press:
      then:
        - lambda: |-
            auto *flash = id(ps4_flash);
            uint32_t capacity = flash->get_capacity();
            uint32_t sector_size = flash->get_erase_size();  // 4KB sectors
            std::string filepath = id(file_name).state;

            if (capacity == 0) {
              id(op_status).publish_state("FAILED: No chip detected");
              return;
            }

            id(op_status).publish_state("Write: Opening file...");
            id(op_progress).publish_state(0.0f);
            id(op_detail).publish_state(filepath.c_str());

            FILE *f = fopen(filepath.c_str(), "rb");
            if (f == nullptr) {
              ESP_LOGE("write", "Failed to open %s!", filepath.c_str());
              id(op_status).publish_state("FAILED: No write file");
              return;
            }

            fseek(f, 0, SEEK_END);
            long file_size = ftell(f);
            fseek(f, 0, SEEK_SET);

            if ((uint32_t) file_size != capacity) {
              ESP_LOGE("write", "File size mismatch! File: %ld, Flash: %u - must be exact!", file_size, capacity);
              char msg[64];
              snprintf(msg, sizeof(msg), "FAILED: Size %ldB != %uB", file_size, capacity);
              id(op_status).publish_state(msg);
              fclose(f);
              return;
            }

            ESP_LOGW("write", "========================================");
            ESP_LOGW("write", "  WRITING %ld bytes to flash!", file_size);
            ESP_LOGW("write", "  This will ERASE and OVERWRITE data!");
            ESP_LOGW("write", "========================================");

            // Allocate 16KB chunk buffer in PSRAM (for SD reads)
            const size_t chunk_size = 16384;  // 16KB SD read chunks
            RAMAllocator<uint8_t> allocator(RAMAllocator<uint8_t>::ALLOC_EXTERNAL);
            uint8_t *buf = allocator.allocate(chunk_size);
            if (buf == nullptr) {
              ESP_LOGE("write", "Failed to allocate buffer in PSRAM!");
              id(op_status).publish_state("FAILED: Out of memory");
              fclose(f);
              return;
            }

            uint32_t address = 0;
            uint32_t total_written = 0;
            uint32_t total_size = (uint32_t) file_size;
            uint32_t last_progress_report = 0;
            bool success = true;

            id(op_status).publish_state("Writing...");

            while (address < total_size) {
              // Read 16KB chunk from SD
              size_t chunk_len = chunk_size;
              if (address + chunk_len > total_size) {
                chunk_len = total_size - address;
              }

              size_t file_read = fread(buf, 1, chunk_len, f);
              if (file_read != chunk_len) {
                ESP_LOGE("write", "File read failed at 0x%08X!", address);
                id(op_status).publish_state("FAILED: File read error");
                success = false;
                break;
              }

              // Write this 16KB chunk in 4KB sector-sized pieces
              for (size_t offset = 0; offset < chunk_len; offset += sector_size) {
                size_t sector_len = sector_size;
                if (offset + sector_len > chunk_len) {
                  sector_len = chunk_len - offset;
                }

                // Erase the sector
                if (!flash->erase_sector(address + offset)) {
                  ESP_LOGE("write", "Erase failed at sector 0x%08X!", address + offset);
                  id(op_status).publish_state("FAILED: Erase error");
                  success = false;
                  break;
                }

                // Write the sector (page-aligned internally by flash->write())
                if (!flash->write(address + offset, buf + offset, sector_len)) {
                  ESP_LOGE("write", "Write failed at 0x%08X!", address + offset);
                  id(op_status).publish_state("FAILED: Write error");
                  success = false;
                  break;
                }
              }

              if (!success) break;

              address += chunk_len;
              total_written += chunk_len;

              // Report progress every 1MB
              if (total_written - last_progress_report >= 1024 * 1024) {
                float pct = (float) total_written / (float) total_size * 100.0f;
                id(op_progress).publish_state(pct);
                ESP_LOGI("write", "Write progress: %.1f%% (%u / %u)", pct, total_written, total_size);
                char det[32];
                snprintf(det, sizeof(det), "W: %uMB / %uMB", total_written / (1024*1024), total_size / (1024*1024));
                id(op_detail).publish_state(det);
                last_progress_report = total_written;
                App.feed_wdt();
                id(i2c_screen).update();
              }
            }

            fclose(f);

            if (!success) {
              allocator.deallocate(buf, chunk_size);
              return;
            }

            // --- Post-write verification (16KB chunks) ---
            id(op_status).publish_state("Write done, verifying...");
            id(op_progress).publish_state(0.0f);

            f = fopen(filepath.c_str(), "rb");
            if (f == nullptr) {
              ESP_LOGE("write", "Cannot reopen %s for verification!", filepath.c_str());
              id(op_status).publish_state("WRITE OK but verify failed");
              allocator.deallocate(buf, chunk_size);
              return;
            }

            uint8_t *verify_buf = allocator.allocate(chunk_size);
            if (verify_buf == nullptr) {
              ESP_LOGE("write", "Cannot allocate verify buffer!");
              id(op_status).publish_state("WRITE OK but verify failed");
              allocator.deallocate(buf, chunk_size);
              fclose(f);
              return;
            }

            address = 0;
            uint32_t mismatch_count = 0;
            last_progress_report = 0;
            uint32_t verified = 0;

            while (address < total_size) {
              size_t len = chunk_size;
              if (address + len > total_size) {
                len = total_size - address;
              }

              // Read from file
              fread(buf, 1, len, f);

              // Read from flash
              if (!flash->read(address, verify_buf, len)) {
                ESP_LOGE("write", "Verify read failed at 0x%08X!", address);
                id(op_status).publish_state("WRITE: Verify read error");
                break;
              }

              // Compare
              for (size_t i = 0; i < len; i++) {
                if (buf[i] != verify_buf[i]) {
                  if (mismatch_count < 10) {
                    ESP_LOGE("write", "Verify MISMATCH at 0x%08X: expected=0x%02X got=0x%02X",
                             address + i, buf[i], verify_buf[i]);
                  }
                  mismatch_count++;
                }
              }

              address += len;
              verified += len;

              if (verified - last_progress_report >= 1024 * 1024) {
                float pct = (float) verified / (float) total_size * 100.0f;
                id(op_progress).publish_state(pct);
                last_progress_report = verified;
                App.feed_wdt();
                id(i2c_screen).update();
              }
            }

            allocator.deallocate(buf, chunk_size);
            allocator.deallocate(verify_buf, chunk_size);
            fclose(f);

            id(op_progress).publish_state(100.0f);

            if (mismatch_count == 0) {
              ESP_LOGI("write", "========================================");
              ESP_LOGI("write", "  WRITE + VERIFY PASSED");
              ESP_LOGI("write", "  %u bytes written and verified", total_written);
              ESP_LOGI("write", "========================================");
              id(op_status).publish_state("WRITE+VERIFY PASSED!");
              char det[32];
              snprintf(det, sizeof(det), "%u bytes OK", total_written);
              id(op_detail).publish_state(det);
            } else {
              ESP_LOGE("write", "========================================");
              ESP_LOGE("write", "  WRITE VERIFICATION FAILED!");
              ESP_LOGE("write", "  %u mismatches!", mismatch_count);
              ESP_LOGE("write", "========================================");
              char msg[64];
              snprintf(msg, sizeof(msg), "WRITE VERIFY FAILED: %u bad!", mismatch_count);
              id(op_status).publish_state(msg);
            }

  # =====================================================================
  # BUTTON 6: Smart Write (minimal modification)
  # Compares configured file against current flash content
  # sector-by-sector (4KB). Only erases + rewrites sectors that differ.
  # File size must exactly match flash capacity.
  # Ideal for PS4 UART debug flag patching - minimal flash wear.
  # Auto-verifies all modified sectors after write.
  # =====================================================================
  - platform: template
    name: "Smart Write"
    id: btn_smart_write
    icon: mdi:delta
    on_press:
      then:
        - lambda: |-
            auto *flash = id(ps4_flash);
            uint32_t capacity = flash->get_capacity();
            uint32_t sector_size = flash->get_erase_size();  // 4KB sectors
            std::string filepath = id(file_name).state;

            if (capacity == 0) {
              id(op_status).publish_state("FAILED: No chip detected");
              return;
            }

            id(op_status).publish_state("Smart Write: Scanning...");
            id(op_progress).publish_state(0.0f);
            id(op_detail).publish_state(filepath.c_str());

            FILE *f = fopen(filepath.c_str(), "rb");
            if (f == nullptr) {
              ESP_LOGE("smart", "Failed to open %s!", filepath.c_str());
              id(op_status).publish_state("FAILED: No write file");
              return;
            }

            fseek(f, 0, SEEK_END);
            long file_size = ftell(f);
            fseek(f, 0, SEEK_SET);

            if ((uint32_t) file_size != capacity) {
              ESP_LOGE("smart", "File size mismatch! File: %ld, Flash: %u - must be exact!", file_size, capacity);
              char msg[64];
              snprintf(msg, sizeof(msg), "FAILED: Size %ldB != %uB", file_size, capacity);
              id(op_status).publish_state(msg);
              fclose(f);
              return;
            }

            uint32_t total_size = (uint32_t) file_size;
            uint32_t total_sectors = (total_size + sector_size - 1) / sector_size;

            ESP_LOGI("smart", "========================================");
            ESP_LOGI("smart", "  Smart Write: %u bytes, %u sectors", total_size, total_sectors);
            ESP_LOGI("smart", "  Sector size: %u bytes (4KB)", sector_size);
            ESP_LOGI("smart", "========================================");

            // Allocate 16KB buffers in PSRAM (for SD/flash reads in chunks)
            const size_t chunk_size = 16384;  // 16KB read chunks
            RAMAllocator<uint8_t> allocator(RAMAllocator<uint8_t>::ALLOC_EXTERNAL);
            uint8_t *file_buf = allocator.allocate(chunk_size);
            uint8_t *flash_buf = allocator.allocate(chunk_size);
            if (file_buf == nullptr || flash_buf == nullptr) {
              ESP_LOGE("smart", "Failed to allocate buffers in PSRAM!");
              id(op_status).publish_state("FAILED: Out of memory");
              if (file_buf) allocator.deallocate(file_buf, chunk_size);
              if (flash_buf) allocator.deallocate(flash_buf, chunk_size);
              fclose(f);
              return;
            }

            // --- Phase 1: Compare and identify changed sectors ---
            // Read 16KB at a time from SD + flash, compare per 4KB sector
            uint32_t address = 0;
            uint32_t sectors_differ = 0;
            uint32_t sectors_same = 0;
            uint32_t sectors_processed = 0;
            bool scan_error = false;

            // Dirty sector bitfield in PSRAM
            // For 32MB / 4KB = 8192 sectors = 1024 bytes for the bitfield
            uint32_t bitfield_size = (total_sectors + 7) / 8;
            uint8_t *dirty_sectors = allocator.allocate(bitfield_size);
            if (dirty_sectors == nullptr) {
              ESP_LOGE("smart", "Failed to allocate dirty sector bitfield!");
              id(op_status).publish_state("FAILED: Out of memory");
              allocator.deallocate(file_buf, chunk_size);
              allocator.deallocate(flash_buf, chunk_size);
              fclose(f);
              return;
            }
            memset(dirty_sectors, 0, bitfield_size);

            id(op_status).publish_state("Scanning differences...");

            while (address < total_size) {
              // Read 16KB chunk from both file and flash
              size_t chunk_len = chunk_size;
              if (address + chunk_len > total_size) {
                chunk_len = total_size - address;
              }

              size_t file_read = fread(file_buf, 1, chunk_len, f);
              if (file_read != chunk_len) {
                ESP_LOGE("smart", "File read failed at 0x%08X!", address);
                scan_error = true;
                break;
              }

              if (!flash->read(address, flash_buf, chunk_len)) {
                ESP_LOGE("smart", "Flash read failed at 0x%08X!", address);
                scan_error = true;
                break;
              }

              // Compare per sector within this 16KB chunk
              for (size_t offset = 0; offset < chunk_len; offset += sector_size) {
                size_t sector_len = sector_size;
                if (offset + sector_len > chunk_len) {
                  sector_len = chunk_len - offset;
                }

                bool differs = (memcmp(file_buf + offset, flash_buf + offset, sector_len) != 0);
                uint32_t sector_idx = (address + offset) / sector_size;

                if (differs) {
                  dirty_sectors[sector_idx / 8] |= (1 << (sector_idx % 8));
                  sectors_differ++;

                  if (sectors_differ <= 5) {
                    uint32_t first_diff = 0;
                    for (size_t i = 0; i < sector_len; i++) {
                      if (file_buf[offset + i] != flash_buf[offset + i]) {
                        first_diff = i;
                        break;
                      }
                    }
                    ESP_LOGI("smart", "  Sector %u (0x%08X) DIFFERS - first diff at offset %u",
                             sector_idx, address + offset, first_diff);
                  }
                } else {
                  sectors_same++;
                }
                sectors_processed++;
              }

              address += chunk_len;

              // Progress every 1MB
              if (address % (1024 * 1024) < chunk_size) {
                float pct = (float) address / (float) total_size * 50.0f;  // 0-50% for scan phase
                id(op_progress).publish_state(pct);
                char det[48];
                snprintf(det, sizeof(det), "Scan: %u/%u sec, %u differ",
                         sectors_processed, total_sectors, sectors_differ);
                id(op_detail).publish_state(det);
                App.feed_wdt();
                id(i2c_screen).update();
              }
            }

            if (scan_error) {
              id(op_status).publish_state("FAILED: Scan error");
              allocator.deallocate(file_buf, chunk_size);
              allocator.deallocate(flash_buf, chunk_size);
              allocator.deallocate(dirty_sectors, bitfield_size);
              fclose(f);
              return;
            }

            ESP_LOGI("smart", "========================================");
            ESP_LOGI("smart", "  Scan complete:");
            ESP_LOGI("smart", "  Total sectors: %u", total_sectors);
            ESP_LOGI("smart", "  Sectors to write: %u (%.1f KB)", sectors_differ,
                     sectors_differ * sector_size / 1024.0f);
            ESP_LOGI("smart", "  Sectors unchanged: %u", sectors_same);
            ESP_LOGI("smart", "========================================");

            if (sectors_differ == 0) {
              ESP_LOGI("smart", "Flash already matches file - nothing to do!");
              id(op_status).publish_state("Already up to date!");
              id(op_progress).publish_state(100.0f);
              id(op_detail).publish_state("0 sectors differ");
              allocator.deallocate(file_buf, sector_size);
              allocator.deallocate(flash_buf, sector_size);
              allocator.deallocate(dirty_sectors, bitfield_size);
              fclose(f);
              return;
            }

            char det_msg[48];
            snprintf(det_msg, sizeof(det_msg), "%u of %u sectors to write", sectors_differ, total_sectors);
            id(op_detail).publish_state(det_msg);

            // --- Phase 2: Erase + write only dirty sectors ---
            // For write phase we need sector-sized buffer (4KB) for precise writes
            // But we still read from SD in 16KB chunks when consecutive sectors are dirty
            id(op_status).publish_state("Writing changed sectors...");

            uint32_t sectors_written = 0;
            bool write_error = false;

            for (uint32_t sector_idx = 0; sector_idx < total_sectors; sector_idx++) {
              // Check if this sector is dirty
              if (!(dirty_sectors[sector_idx / 8] & (1 << (sector_idx % 8)))) {
                continue;  // Skip - sector matches
              }

              address = sector_idx * sector_size;
              size_t len = sector_size;
              if (address + len > total_size) {
                len = total_size - address;
              }

              // Seek to sector position in file and read one sector
              fseek(f, address, SEEK_SET);
              size_t file_read = fread(file_buf, 1, len, f);
              if (file_read != len) {
                ESP_LOGE("smart", "File re-read failed at sector %u (0x%08X)!", sector_idx, address);
                write_error = true;
                break;
              }

              // Erase the sector
              if (!flash->erase_sector(address)) {
                ESP_LOGE("smart", "Erase failed at sector %u (0x%08X)!", sector_idx, address);
                write_error = true;
                break;
              }

              // Write the new data (page-aligned internally)
              if (!flash->write(address, file_buf, len)) {
                ESP_LOGE("smart", "Write failed at sector %u (0x%08X)!", sector_idx, address);
                write_error = true;
                break;
              }

              sectors_written++;

              // Progress: 50-80% for write phase
              float pct = 50.0f + (float) sectors_written / (float) sectors_differ * 30.0f;
              id(op_progress).publish_state(pct);

              if (sectors_written % 16 == 0 || sectors_written == sectors_differ) {
                ESP_LOGI("smart", "  Written %u / %u sectors", sectors_written, sectors_differ);
                char det[48];
                snprintf(det, sizeof(det), "Write: %u/%u sectors", sectors_written, sectors_differ);
                id(op_detail).publish_state(det);
                App.feed_wdt();
                id(i2c_screen).update();
              }
            }

            if (write_error) {
              char msg[64];
              snprintf(msg, sizeof(msg), "WRITE ERROR after %u/%u sectors!", sectors_written, sectors_differ);
              id(op_status).publish_state(msg);
              allocator.deallocate(file_buf, chunk_size);
              allocator.deallocate(flash_buf, chunk_size);
              allocator.deallocate(dirty_sectors, bitfield_size);
              fclose(f);
              return;
            }

            // --- Phase 3: Verify written sectors (16KB reads) ---
            id(op_status).publish_state("Verifying written sectors...");

            // Re-verify using 16KB reads - check all dirty sectors within each chunk
            fseek(f, 0, SEEK_SET);
            address = 0;
            uint32_t sectors_verified = 0;
            uint32_t verify_mismatches = 0;

            while (address < total_size) {
              // Check if any sector in this 16KB range is dirty
              bool any_dirty = false;
              uint32_t chunk_end = address + chunk_size;
              if (chunk_end > total_size) chunk_end = total_size;

              for (uint32_t a = address; a < chunk_end; a += sector_size) {
                uint32_t si = a / sector_size;
                if (dirty_sectors[si / 8] & (1 << (si % 8))) {
                  any_dirty = true;
                  break;
                }
              }

              if (!any_dirty) {
                // Skip this 16KB range entirely - no dirty sectors
                fseek(f, chunk_end - address, SEEK_CUR);
                address = chunk_end;
                continue;
              }

              size_t chunk_len = chunk_end - address;

              // Read 16KB from both file and flash
              fread(file_buf, 1, chunk_len, f);
              if (!flash->read(address, flash_buf, chunk_len)) {
                ESP_LOGE("smart", "Verify read failed at 0x%08X!", address);
                verify_mismatches++;
                address = chunk_end;
                continue;
              }

              // Compare only dirty sectors within this chunk
              for (size_t offset = 0; offset < chunk_len; offset += sector_size) {
                uint32_t si = (address + offset) / sector_size;
                if (!(dirty_sectors[si / 8] & (1 << (si % 8)))) {
                  continue;
                }

                size_t sector_len = sector_size;
                if (offset + sector_len > chunk_len) sector_len = chunk_len - offset;

                for (size_t i = 0; i < sector_len; i++) {
                  if (file_buf[offset + i] != flash_buf[offset + i]) {
                    if (verify_mismatches < 10) {
                      ESP_LOGE("smart", "Verify MISMATCH at 0x%08X: expected=0x%02X got=0x%02X",
                               address + offset + i, file_buf[offset + i], flash_buf[offset + i]);
                    }
                    verify_mismatches++;
                  }
                }
                sectors_verified++;
              }

              address = chunk_end;

              // Progress: 80-100% for verify phase
              float pct = 80.0f + (float) sectors_verified / (float) sectors_differ * 20.0f;
              id(op_progress).publish_state(pct);

              if (sectors_verified % 64 == 0) {
                App.feed_wdt();
                id(i2c_screen).update();
              }
            }

            allocator.deallocate(file_buf, chunk_size);
            allocator.deallocate(flash_buf, chunk_size);
            allocator.deallocate(dirty_sectors, bitfield_size);
            fclose(f);

            id(op_progress).publish_state(100.0f);

            if (verify_mismatches == 0) {
              ESP_LOGI("smart", "========================================");
              ESP_LOGI("smart", "  SMART WRITE COMPLETE");
              ESP_LOGI("smart", "  %u sectors modified, %u unchanged", sectors_differ, sectors_same);
              ESP_LOGI("smart", "  All written sectors verified OK");
              ESP_LOGI("smart", "========================================");
              char msg[64];
              snprintf(msg, sizeof(msg), "SMART WRITE OK! %u/%u sectors", sectors_differ, total_sectors);
              id(op_status).publish_state(msg);
              char det[48];
              snprintf(det, sizeof(det), "%u written, %u skipped, verified", sectors_differ, sectors_same);
              id(op_detail).publish_state(det);
            } else {
              ESP_LOGE("smart", "========================================");
              ESP_LOGE("smart", "  SMART WRITE VERIFICATION FAILED!");
              ESP_LOGE("smart", "  %u byte mismatches in written sectors!", verify_mismatches);
              ESP_LOGE("smart", "========================================");
              char msg[64];
              snprintf(msg, sizeof(msg), "SMART WRITE VERIFY FAIL: %u bad!", verify_mismatches);
              id(op_status).publish_state(msg);
            }
