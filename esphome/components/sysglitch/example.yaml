# ══════════════════════════════════════════════════════════════════
# SysGlitch - RL78/G13 OCD Voltage Glitcher for PS4/PSVITA Syscon
# ══════════════════════════════════════════════════════════════════
#
# This component turns an ESP32-P4 into a syscon flasher replacement,
# capable of dumping and writing back the RL78/G13 syscon flash via
# voltage glitch attack on the OCD (On-Chip Debugger) interface.
#
# Hardware connections:
#   TOOL0 (syscon debug wire) → ESP32 GPIO32/GPIO33 UART (half-duplex, 1-wire)
#   RESET (syscon reset)      → ESP32 GPIO2 (active low)
#   GLITCH (to MOSFET/relay)  → ESP32 GPIO3 (pulls VCC low briefly)
#   RX_PULLDOWN               → ESP32 GPIO4 (holds TOOL0 low for mode entry)
#
# Three operational modes:
#   dump_sd   - Standalone: glitch → dump 512KB flash → save to SD card
#   dump_uart - Bridge: glitch → dump flash → stream over pc_uart
#   flasher   - Full flasher: scflasher.py-compatible protocol over pc_uart
#               (supports read/write/erase via ps4-wee-tools)
#
# PC UART via USB CDC:
#   ESP32-P4 has two independent USB interfaces:
#     - USB_SERIAL_JTAG: built-in debug serial (used by logger, default)
#     - USB_CDC: full USB CDC-ACM via TinyUSB (usb_cdc_acm component)
#   We use usb_cdc_acm for pc_uart, so ps4-wee-tools talks over USB.
#   Logger stays on USB_SERIAL_JTAG — no conflict, both work in parallel.
#   The PC sees two COM ports: one for logs, one for scflasher protocol.
#
# ══════════════════════════════════════════════════════════════════

esphome:
  name: sysglitch
  friendly_name: "PS4 Syscon Glitcher"

esp32:
  board: esp32-p4-function-ev-board
  variant: ESP32P4
  framework:
    type: esp-idf

# ── Logging ──
# Logger defaults to USB_SERIAL_JTAG on ESP32-P4.
# This is a separate USB interface from USB_CDC, so no conflict.
# Logs available on one COM port, scflasher protocol on the other.
logger:
  level: DEBUG
  # hardware_uart: USB_SERIAL_JTAG  # Default on P4, no need to set explicitly

# ── WiFi (optional, for HA integration and wireless logs) ──
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome

# ── SD Card Storage (required for dump_sd mode) ──
# Uncomment and adjust for your SD card wiring
# storage:
#
# sd_storage:
#   id: sd_card
#   mode_1bit: false  # Set true for 1-bit SD mode

# ══════════════════════════════════════════════════════════════════
# USB CDC ACM — provides a UART interface over USB
# ══════════════════════════════════════════════════════════════════
# This uses the TinyUSB stack to create a USB CDC-ACM serial port.
# The PC sees it as a second COM port (separate from USB_SERIAL_JTAG).
# ps4-wee-tools connects to this port for the scflasher protocol.

tinyusb:

usb_cdc_acm:
  rx_buffer_size: 2048
  tx_buffer_size: 2048
  interfaces:
    - id: uart_pc

# ══════════════════════════════════════════════════════════════════
# UART Configuration
# ══════════════════════════════════════════════════════════════════

uart:
  # TOOL0: Half-duplex 1-wire UART to syscon debug port
  # TX and RX are the same physical wire (TOOL0)
  # Pins chosen from Guition JC-ESP32P4-M3-Dev Expand IO header (JP1)
  - id: uart_tool0
    tx_pin: GPIO32
    rx_pin: GPIO33
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1

# ══════════════════════════════════════════════════════════════════
# Example 1: Dump to SD card (standalone, no PC needed)
# ══════════════════════════════════════════════════════════════════

# sysglitch:
#   id: glitcher
#   tool0_uart: uart_tool0
#   reset_pin: GPIO4
#   glitch_pin: GPIO5
#   rx_pulldown_pin: GPIO6
#   mode: dump_sd
#   dump_path: "/sd/syscon_dump.bin"
#   # Timing parameters (defaults work for most syscons)
#   glitch_delay_min: 1500    # us - start of glitch window
#   glitch_delay_max: 7500    # us - end of glitch window
#   glitch_width_max: 6300    # ns - max glitch pulse width
#   # OCD passcode (default is ":Not:Used:" for standard PS4 syscons)
#   passcode: [0x3A, 0x4E, 0x6F, 0x74, 0x3A, 0x55, 0x73, 0x65, 0x64, 0x3A]
#   max_attempts: 0           # 0 = infinite, keep trying until success

# ══════════════════════════════════════════════════════════════════
# Example 2: Dump over USB CDC to PC (legacy syscon_reader mode)
# ══════════════════════════════════════════════════════════════════

# sysglitch:
#   id: glitcher
#   tool0_uart: uart_tool0
#   pc_uart: uart_pc
#   reset_pin: GPIO4
#   glitch_pin: GPIO5
#   rx_pulldown_pin: GPIO6
#   mode: dump_uart

# ══════════════════════════════════════════════════════════════════
# Example 3: Full flasher (scflasher.py-compatible, read/write/erase)
#   Uses USB CDC as pc_uart — connect to PC via USB, run ps4-wee-tools
#   PC sees two COM ports: one for ESPHome logs, one for scflasher
# ══════════════════════════════════════════════════════════════════

sysglitch:
  id: glitcher
  tool0_uart: uart_tool0
  pc_uart: uart_pc
  reset_pin: GPIO2
  glitch_pin: GPIO3
  rx_pulldown_pin: GPIO4
  mode: flasher

# ══════════════════════════════════════════════════════════════════
# Home Assistant Automation Triggers
# ══════════════════════════════════════════════════════════════════

# Physical button to start/stop the glitch attack
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Start Glitch Button"
    on_press:
      then:
        - sysglitch.start_glitch:
            id: glitcher

  - platform: gpio
    pin:
      number: GPIO20
      mode: INPUT_PULLUP
      inverted: true
    name: "Stop Glitch Button"
    on_press:
      then:
        - sysglitch.stop:
            id: glitcher

# HA-triggered buttons
button:
  - platform: template
    name: "Start Syscon Glitch"
    on_press:
      then:
        - sysglitch.start_glitch:
            id: glitcher

  - platform: template
    name: "Stop Syscon Glitch"
    on_press:
      then:
        - sysglitch.stop:
            id: glitcher
