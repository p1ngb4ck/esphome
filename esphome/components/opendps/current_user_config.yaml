esphome:
  name: opendps
  friendly_name: "OpenDPS"
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            App.set_loop_interval(0);
    - priority: 1
      then:
        - lambda: |-
            id(opendps_id).set_upgrade_progress_callback([](uint8_t pct) {
              id(g_fw_progress) = pct;
              id(fw_poll_status).execute();
            });
            id(opendps_id).set_upgrade_complete_callback([](bool ok, const char *msg) {
              id(g_fw_flashing) = false;
              id(g_fw_status) = msg;
              id(g_fw_progress) = ok ? 100 : id(g_fw_progress);
              lv_lock();
              lv_bar_set_value(id(fw_progress_bar), id(g_fw_progress), LV_ANIM_OFF);
              lv_label_set_text(id(fw_progress_status), msg);
              lv_obj_set_style_bg_color(id(fw_progress_bar), ok ? lv_color_hex(0x39FF14) : lv_color_hex(0xFF3333), LV_PART_INDICATOR);
              lv_obj_clear_state(id(fw_progress_close), LV_STATE_DISABLED);
              lv_unlock();
            });

esp32:
  variant: ESP32P4
  board: esp32-p4
  flash_size: 16MB
  cpu_frequency: 360MHZ
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      disable_vfs_support_dir: false
      disable_vfs_support_select: false
      disable_vfs_support_termios: false
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_FATFS_VOLUME_COUNT: "4"
      CONFIG_FATFS_MAX_LFN: "255"
      CONFIG_FATFS_API_ENCODING_UTF_8: "y"
      CONFIG_FATFS_ALLOC_PREFER_EXTRAM: "y"
      CONFIG_FATFS_ALLOC_PREFER_ALIGNED_WORK_BUFFERS: "y"
      CONFIG_FATFS_PER_FILE_CACHE: "y"
      CONFIG_FATFS_CODEPAGE_DYNAMIC: "y"
      CONFIG_LWIP_SO_RCVBUF: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU1: "y"
      CONFIG_SDMMC_HOST_DEFAULT: "y"
      CONFIG_USB_TRANSFER_FLAG_ZERO_PACK: "y"
      CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE: "1024"
      CONFIG_USB_HOST_HW_BUFFER_BIAS_BALANCED: "y"
      CONFIG_USB_HOST_HW_BUFFER_BIAS_IN: "n"
      CONFIG_USB_HOST_HW_BUFFER_BIAS_PERIODIC_OUT: "n"
      CONFIG_COMPILER_CXX_EXCEPTIONS: n
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_PARTITION_TABLE_CUSTOM: "y"
      CONFIG_ESP32_P4_EV_BOARD: "n"
      CONFIG_HTTPD_MAX_REQ_HDR_LEN: "800"
      CONFIG_HTTPD_WS_SUPPORT: "y"
      CONFIG_ESP_WIFI_EXTRA_IRAM_OPT: "n"
      CONFIG_ESP_WIFI_SLP_IRAM_OPT: "n"
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_USB_TASK_STACK_SIZE: "16384"
      CONFIG_USB_HOST_DWC_DMA_CAP_MEMORY_IN_PSRAM: "y"
      CONFIG_SLAVE_IDF_TARGET_ESP32C6: "y"
      CONFIG_SDMMC_FREQ_HIGHSPEED: "y"
      CONFIG_USE_AUDIO_AAC_SUPPORT: "y"
      CONFIG_ESP_JPG_DECODE_ENABLE: "y"
      CONFIG_ESPHOME_ENABLE_PNGLE: "1"
external_components:
  - source: github://p1ngb4ck/esphome@dev
    components: [esp32, http_file_browser, nfs_client, opendps, psram, storage, sd_storage, uart, usb_host, usb_storage, usb_uart]
    refresh: 0s
  - source: github://p1ngb4ck/lvgl_9.5@main
    components: [font, image, lvgl]
    refresh: 0s

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  baud_rate: 115200
  logs:
    usb_host: DEBUG
    usb_client: DEBUG
    usb_device: DEBUG
    usb_uart: DEBUG
    sd_storage: DEBUG
    storage: DEBUG
    opendps: INFO

psram:
  mode: hex
  speed: 200MHz

debug:
  id: debugger
  update_interval: 10s

esp32_hosted:
  type: sdio
  use_psram: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

time:
  - platform: host
    id: host_time
    timezone: Europe/Berlin
    update_interval: 100ms
    on_time:
      - seconds: /1
        then:
          - lambda: |-
              if (!id(g_lvgl_ready)) return;
              auto t = id(rx8130_time).now();
              if (!t.is_valid()) return;
              if (t.second != 0 && lv_label_get_text(id(lbl_status_time))[0] != '-') return;
              char buf[32];
              switch (id(g_datetime_fmt)) {
                case 1: snprintf(buf, sizeof(buf), "%02d:%02d:%02d", t.hour, t.minute, t.second); break;
                case 2: snprintf(buf, sizeof(buf), "%02d.%02d.%04d %02d:%02d", t.day_of_month, t.month, t.year, t.hour, t.minute); break;
                case 3: snprintf(buf, sizeof(buf), "%02d/%02d/%04d %02d:%02d", t.month, t.day_of_month, t.year, t.hour, t.minute); break;
                case 4: snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d", t.year, t.month, t.day_of_month, t.hour, t.minute); break;
                default: snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute); break;
              }
              lv_lock();
              lv_label_set_text(id(lbl_status_time), buf);
              lv_unlock();
  - platform: rx8130
    id: rx8130_time
    update_interval: 3h
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        # Write time to RTC
        - rx8130.write_time:
            id: rx8130_time

