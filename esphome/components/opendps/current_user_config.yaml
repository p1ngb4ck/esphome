                  # ── Save bar ──────────────────────────────────────────────
                  - obj:
                      id: theme_save_bar
                      width: 868
                      height: 44
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollbar_mode: "off"
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: END
                        flex_align_cross: CENTER
                        pad_column: 12
                      widgets:
                        - button:
                            id: btn_theme_cancel
                            width: 120
                            height: 40
                            bg_color: 0x2A2A3A
                            border_color: 0x444466
                            border_width: 1
                            radius: 6
                            on_click:
                              - lambda: |-
                                  // Revert to pre-open snapshot
                                  id(g_theme_scheme)  = id(g_snap_scheme);
                                  id(theme_accent)    = id(g_snap_accent);
                                  id(theme_voltage)   = id(g_snap_voltage);
                                  id(theme_current)   = id(g_snap_current);
                                  id(theme_bg_main)   = id(g_snap_bg_main);
                                  id(theme_bg_panel)  = id(g_snap_bg_panel);
                                  id(theme_text_dim)  = id(g_snap_text_dim);
                                  lv_lock();
                                  lv_obj_add_flag(id(overlay_theme_editor), LV_OBJ_FLAG_HIDDEN);
                                  lv_unlock();
                              - script.execute: scr_theme_apply_full
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Cancel"
                                  text_color: 0xCCCCCC
                                  text_font: montserrat_16
                        - button:
                            id: btn_theme_apply
                            width: 200
                            height: 40
                            bg_color: 0x1A3A1A
                            border_color: 0x39FF14
                            border_width: 2
                            radius: 6
                            on_click:
                              - lambda: |-
                                  lv_lock();
                                  const char *txt = lv_textarea_get_text(id(theme_hex_input));
                                  if (strlen(txt) != 6) { lv_unlock(); return; }
                                  uint32_t rgb = (uint32_t)strtol(txt, nullptr, 16);
                                  switch (id(g_editing_color_token)) {
                                    case 0: id(theme_accent)   = (int)rgb; break;
                                    case 1: id(theme_voltage)  = (int)rgb; break;
                                    case 2: id(theme_current)  = (int)rgb; break;
                                    case 3: id(theme_bg_main)  = (int)rgb; break;
                                    case 4: id(theme_bg_panel) = (int)rgb; break;
                                    case 5: id(theme_text_dim) = (int)rgb; break;
                                  }
                                  id(g_theme_scheme) = 0;
                                  // Update snapshot so Cancel after Save keeps this color
                                  id(g_snap_scheme)   = 0;
                                  id(g_snap_accent)   = id(theme_accent);
                                  id(g_snap_voltage)  = id(theme_voltage);
                                  id(g_snap_current)  = id(theme_current);
                                  id(g_snap_bg_main)  = id(theme_bg_main);
                                  id(g_snap_bg_panel) = id(theme_bg_panel);
                                  id(g_snap_text_dim) = id(theme_text_dim);
                                  id(scr_update_theme_labels).execute();
                                  lv_unlock();
                              - script.execute: scr_theme_apply_full
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Save color"
                                  text_color: 0x39FF14
                                  text_font: montserrat_16

