                              - label:
                                  align: CENTER
                                  text: "Save & Close"
                                  text_color: 0x4499FF
                                  text_font: montserrat_14
                        - button:
                            id: btn_cal_assist_submit
                            width: 220
                            height: 44
                            hidden: true
                            bg_color: 0x1A3A1A
                            border_color: 0x39FF14
                            border_width: 2
                            radius: 6
                            on_click:
                              - lambda: |-
                                  auto state = id(opendps_id).get_calibration_assistant_state();
                                  float val = 0.0f;
                                  // For steps that need a numeric value, read textarea
                                  if (state != 23 && state != 30) {
                                    const char *t = lv_textarea_get_text(id(cal_assist_ta));
                                    val = atof(t);
                                    // Mirror to cal_input entity for log-based flow
                                    id(cal_input).publish_state(std::string(t));
                                  }
                                  id(g_cal_assist_value) = val;
                                  id(opendps_id).calibration_assistant_step(val);
                                  // Clear textarea for next step
                                  lv_lock();
                                  lv_textarea_set_text(id(cal_assist_ta), "");
                                  lv_unlock();
                              - script.execute: scr_cal_update_ui
                            widgets:
                              - label:
                                  id: lbl_cal_submit_btn
                                  align: CENTER
                                  text: "Submit"
                                  text_color: 0x39FF14
                                  text_font: montserrat_16

