                                    uint32_t rgb = (uint32_t)strtol(txt, nullptr, 16);
                                    lv_obj_set_style_bg_color(id(swatch_current_color), lv_color_hex(rgb), LV_PART_MAIN);
                                  }
                                  lv_unlock();
                            on_focus:
                              - lambda: |-
                                  lv_lock();
                                  lv_keyboard_set_textarea(id(theme_kbd)->obj, id(theme_hex_input));
