                    flex_align_cross: CENTER
                    flex_align_main: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "SET"
                        text_color: 0x39FF14
                        text_font: montserrat_12
                    - obj:
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        width: 171
                        height: 80
                        scrollbar_mode: "off"
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_cross: END
                          flex_align_main: START
                          pad_column: 2
                        widgets:
                          - label:
                              id: lbl_setv
                              width: 147
                              text_align: RIGHT
                              text: !lambda |-
                                char buf[16];
                                snprintf(buf, sizeof(buf), "%.2f", id(g_vset));
                                return std::string(buf);
                              text_color: 0x39FF14
                              text_font: roboto_mono_48
                          - label:
                              text: "V"
                              id: lbl_setv_unit
                              text_color: 0x39FF14
                              text_font: montserrat_20
                              y: -6

              # ACT value
              - obj:
                  width: 183
                  height: 128
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
