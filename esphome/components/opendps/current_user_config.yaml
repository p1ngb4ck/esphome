                                  lv_textarea_set_text(id(ta_cal_a_adc_c),   id(input_a_adc_c).state.c_str());
                                  lv_textarea_set_text(id(ta_cal_a_dac_k),   id(input_a_dac_k).state.c_str());
                                  lv_textarea_set_text(id(ta_cal_a_dac_c),   id(input_a_dac_c).state.c_str());
                                  lv_textarea_set_text(id(ta_cal_vin_adc_k), id(input_vin_adc_k).state.c_str());
                                  lv_textarea_set_text(id(ta_cal_vin_adc_c), id(input_vin_adc_c).state.c_str());
