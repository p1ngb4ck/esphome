                              - lambda: |-
                                  lv_lock();
                                  lv_keyboard_set_textarea(id(cal_assist_kbd)->obj, id(cal_assist_ta));
                                  lv_unlock();

                  # ── Number keyboard ────────────────────────────────────────
                  - keyboard:
                      id: cal_assist_kbd
                      height: 160
                      hidden: true
                      mode: NUMBER
                      bg_color: 0x111122
                      on_ready:
                        - lambda: |-
                            lv_lock();
                            // Store parsed value
                            const char *t = lv_textarea_get_text(id(cal_assist_ta));
                            id(g_cal_assist_value) = atof(t);
                            // Mirror to cal_input text entity so log-based flow stays in sync
                            lv_unlock();
                            id(cal_input).publish_state(std::string(lv_textarea_get_text(id(cal_assist_ta))));

                  # ── Auto-running indicator ─────────────────────────────────
                  - label:
                      id: lbl_cal_auto_running
