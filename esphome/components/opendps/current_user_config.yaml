                  # Cal file path row (always visible at bottom of overlay)
                  - obj:
                      x: 20
                      y: 342
                      width: 760
                      height: 36
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollbar_mode: "off"
                      scrollable: false
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: START
                        flex_align_cross: CENTER
                        pad_column: 6
                      widgets:
                        - label:
                            text: "Cal file:"
                            text_color: 0x888888
                            text_font: montserrat_12
                            width: 58
                        - label:
                            id: lbl_cal_file_inoverlay
                            text: !lambda 'return id(cal_backup_path);'
                            text_color: 0xAAAACC
                            text_font: montserrat_12
                            width: SIZE_CONTENT
                        - button:
                            width: 52
                            height: 28
                            bg_color: 0x2A2A3A
                            border_color: 0x4499FF
                            border_width: 1
                            radius: 3
                            on_click:
                              - lambda: |-
                                  lv_lock();
                                  std::string full = id(cal_backup_path);
                                  size_t slash = full.find_last_of('/');
                                  if (slash != std::string::npos) {
                                    id(g_cal_path_cwd) = full.substr(0, slash);
                                    lv_textarea_set_text(id(cal_path_textarea), full.substr(slash + 1).c_str());
                                  } else {
                                    id(g_cal_path_cwd) = "/sdcard";
                                    lv_textarea_set_text(id(cal_path_textarea), full.c_str());
                                  }
                                  lv_label_set_text(id(cal_path_preview_lbl), full.c_str());
                                  lv_obj_add_flag(id(cal_path_keyboard)->obj, LV_OBJ_FLAG_HIDDEN);
                                  lv_obj_clear_flag(id(overlay_cal_path), LV_OBJ_FLAG_HIDDEN);
                                  lv_unlock();
