  pages:
    # =========================================================
    # PAGE: MAIN  (content area y=40..560, 520px tall)
    # top_layer covers header y=0..40 and footer y=560..600
    # All positions absolute, all sizes fixed.
    # =========================================================
    - id: page_main
      bg_color: 0x1E1E1E
      scrollbar_mode: "off"
      scrollable: false
      pad_all: 0

      widgets:
        # ── VOLTAGE BAR: x=0, y=48, w=1024, h=140 ──────────────────
        # Left: slider (~65% width). Right: SET value + ACT value
        - obj:
            id: lcd_panel_v
            x: 0
            y: 48
            width: 1024
            height: 140
            bg_color: 0x0C1A0C
            border_color: 0x004408
            border_width: 2
            radius: 8
            pad_left: 16
            pad_right: 0
            pad_top: 6
            pad_bottom: 6
            scrollbar_mode: "off"
            scrollable: false
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: START
              flex_align_cross: CENTER
              pad_column: 0

            widgets:
              # Slider section (65%)
              - obj:
                  width: 624
                  height: 128
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: "off"
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: CENTER
                    flex_align_main: SPACE_EVENLY
                    pad_row: 4

                  widgets:
                    - obj:
                        width: 620
                        height: 18
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "off"
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text: "VOLTAGE"
                              text_color: 0x888888
                              text_font: montserrat_14
                          - label:
                              id: lbl_vrange
                              text: !lambda |-
                                char buf[16];
                                snprintf(buf, sizeof(buf), "0 - %.1fV", id(g_vmax));
                                return std::string(buf);
                              text_color: 0x444444
                              text_font: montserrat_12

                    - slider:
                        id: sl_v
                        width: 620
                        height: 62
                        min_value: 0
                        max_value: 10000
                        value: 0
                        bg_color: 0x222222
                        bg_opa: COVER
                        radius: 8
                        border_color: 0x333333
                        border_width: 1
                        indicator:
                          bg_color: 0x39FF14
                          bg_opa: COVER
                          radius: 8
                        knob:
                          bg_color: 0xDDDDDD
                          border_color: 0x888888
                          border_width: 2
                          radius: 4
                          width: 28
                          height: 52
                          pad_top: -4
                          pad_bottom: -4
                        on_press:
                          - globals.set:
                              id: g_ui_active
                              value: "true"
                        on_release:
                          - globals.set:
                              id: g_ui_active
                              value: "false"
                        on_value:
                          - lambda: |-
                              lv_lock();
                              if (id(g_slider_updating)) return;
                              if (!id(g_preset_active)) {
                                uint32_t n = lv_obj_get_child_count(id(preset_bar));
                                for (uint32_t ci = 0; ci < n; ci++)
                                  lv_obj_set_style_bg_color(lv_obj_get_child(id(preset_bar), ci), lv_color_hex(0x0A0A0A), LV_PART_MAIN);
                              }
                              float v = x / 10000.0f * id(g_vmax);
                              v = roundf(v / 0.005f) * 0.005f;
                              id(voltage_number).make_call().set_value(v).perform();
                              lv_unlock();

                    - obj:
                        width: 620
                        height: 16
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        scrollbar_mode: "off"
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text: "0"
                              text_color: 0x444444
                              text_font: montserrat_12
                          - label:
                              id: lbl_vtick25
                              text: !lambda |-
                                char buf[8];
                                snprintf(buf, sizeof(buf), "%.1f", id(g_vmax) * 0.25f);
                                return std::string(buf);
                              text_color: 0x444444
                              text_font: montserrat_12
                          - label:
                              id: lbl_vtick50
                              text: !lambda |-
                                char buf[8];
                                snprintf(buf, sizeof(buf), "%.1f", id(g_vmax) * 0.50f);
                                return std::string(buf);
                              text_color: 0x444444
                              text_font: montserrat_12
                          - label:
                              id: lbl_vtick75
                              text: !lambda |-
                                char buf[8];
                                snprintf(buf, sizeof(buf), "%.1f", id(g_vmax) * 0.75f);
                                return std::string(buf);
                              text_color: 0x444444
                              text_font: montserrat_12
                          - label:
                              id: lbl_vtick100
                              text: !lambda |-
                                char buf[8];
                                snprintf(buf, sizeof(buf), "%.1fV", id(g_vmax));
                                return std::string(buf);
                              text_color: 0x444444
                              text_font: montserrat_12

              # Spacer between slider and SET/ACT values
              - obj:
                  width: 8
                  height: 128
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false

              # SET value
              - obj:
                  width: 183
                  height: 128
                  bg_opa: TRANSP
                  border_color: 0x1A3A1A
                  border_width: 1
                  border_side: RIGHT
                  pad_all: 0
                  pad_left: 4
                  pad_right: 4
