                                  id(opendps_id).request_calibration_report();
                              - delay: 500ms
                              - lambda: |-
                                  lv_lock();
                                  auto &cal = id(opendps_id).get_calibration_data();
                                  char buf[32];
                                  snprintf(buf, sizeof(buf), "%.6f", cal.v_adc_k);   id(input_v_adc_k).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.v_adc_c);   id(input_v_adc_c).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.v_dac_k);   id(input_v_dac_k).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.v_dac_c);   id(input_v_dac_c).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.a_adc_k);   id(input_a_adc_k).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.a_adc_c);   id(input_a_adc_c).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.a_dac_k);   id(input_a_dac_k).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.a_dac_c);   id(input_a_dac_c).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.vin_adc_k); id(input_vin_adc_k).publish_state(buf);
                                  snprintf(buf, sizeof(buf), "%.6f", cal.vin_adc_c); id(input_vin_adc_c).publish_state(buf);
                                  lv_textarea_set_text(id(ta_cal_v_adc_k),   id(input_v_adc_k).state.c_str());
                                  lv_textarea_set_text(id(ta_cal_v_adc_c),   id(input_v_adc_c).state.c_str());
                                  lv_textarea_set_text(id(ta_cal_v_dac_k),   id(input_v_dac_k).state.c_str());
