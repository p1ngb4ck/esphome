                        - obj:
                            id: swatch_text_dim
                            width: 124
                            height: 44
                            bg_color: 0x555555
                            radius: 6
                            border_color: 0x444444
                            border_width: 1
                            clickable: true
                            on_click:
                              - lambda: |-
