                                  id(scr_update_theme_labels).execute();
                                  lv_unlock();
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Text Dim"
                                  text_color: 0xCCCCCC
                                  text_font: montserrat_12

                  # ── Active slot info: name + description + current color ───
                  - obj:
                      width: 868
                      height: 40
                      bg_color: 0x111122
                      border_color: 0x334466
                      border_width: 1
