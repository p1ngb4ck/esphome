                                  text_font: montserrat_14
                        - button:
                            id: btn_cal_set
                            width: 80
                            height: 40
                            bg_color: 0x1A3A1A
                            border_color: 0x39FF14
                            border_width: 1
                            radius: 4
                            on_click:
                              - lambda: |-
                                  lv_lock();
                                  auto read = [](lv_obj_t *ta, const std::string &fallback) -> float {
                                    const char *t = lv_textarea_get_text(ta);
                                    if (!t || t[0] == '\0' || t[0] == '-') return atof(fallback.c_str());
                                    return atof(t);
                                  };
                                  id(opendps_id).set_calibration("V_ADC_K",   read(id(ta_cal_v_adc_k),   id(input_v_adc_k).state));
                                  id(opendps_id).set_calibration("V_ADC_C",   read(id(ta_cal_v_adc_c),   id(input_v_adc_c).state));
                                  id(opendps_id).set_calibration("V_DAC_K",   read(id(ta_cal_v_dac_k),   id(input_v_dac_k).state));
                                  id(opendps_id).set_calibration("V_DAC_C",   read(id(ta_cal_v_dac_c),   id(input_v_dac_c).state));
                                  id(opendps_id).set_calibration("A_ADC_K",   read(id(ta_cal_a_adc_k),   id(input_a_adc_k).state));
                                  id(opendps_id).set_calibration("A_ADC_C",   read(id(ta_cal_a_adc_c),   id(input_a_adc_c).state));
                                  id(opendps_id).set_calibration("A_DAC_K",   read(id(ta_cal_a_dac_k),   id(input_a_dac_k).state));
                                  id(opendps_id).set_calibration("A_DAC_C",   read(id(ta_cal_a_dac_c),   id(input_a_dac_c).state));
                                  id(opendps_id).set_calibration("VIN_ADC_K", read(id(ta_cal_vin_adc_k), id(input_vin_adc_k).state));
                                  id(opendps_id).set_calibration("VIN_ADC_C", read(id(ta_cal_vin_adc_c), id(input_vin_adc_c).state));
                                  lv_obj_add_flag(id(cal_kb_panel), LV_OBJ_FLAG_HIDDEN);
                                  lv_unlock();
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Set"
                                  text_color: 0x39FF14
                                  text_font: montserrat_14
                        - button:
