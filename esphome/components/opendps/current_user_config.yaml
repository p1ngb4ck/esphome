                              - lambda: |-
                                  lv_lock();
                                  lv_obj_clear_flag(id(overlay_cal_assistant), LV_OBJ_FLAG_HIDDEN);
                                  lv_unlock();
                              - lambda: |-
                                  id(opendps_id).start_calibration_assistant();
