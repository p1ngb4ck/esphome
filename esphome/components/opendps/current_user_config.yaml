interval:
  - interval: 500ms
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          auto state = id(opendps_id).get_calibration_assistant_state();
          // Only repoll when overlay is visible and something is happening
          if (state == 0 || state == 40 || state == 41) return;
          lv_obj_t *ov = id(overlay_cal_assistant);
          if (lv_obj_has_flag(ov, LV_OBJ_FLAG_HIDDEN)) return;
          id(scr_cal_update_ui).execute();
  - interval: 5s
    then:
#      - uart.write:
#          id: ftdi_uart_1
#          data: "Hello World !\n"
      - uart.write:
          id: octa_uart_1
          data: "Hello World !\n"
      - uart.write:
          id: octa_uart_2
          data: "Hello World !\n"
      - uart.write:
          id: octa_uart_3
          data: "Hello World !\n"
      - uart.write:
          id: octa_uart_4
          data: "Hello World !\n"
      - uart.write:
          id: octa_uart_5
          data: "Hello World !\n"
      - uart.write:
          id: octa_uart_6
          data: "Hello World !\n"
      - uart.write:
          id: octa_uart_7
          data: "Hello World !\n"
      - uart.write:
          id: octa_uart_8
          data: "Hello World !\n"
      - uart.write:
          id: pl2303_uart_1
          data: "Hello World !\n"
  - interval: 10s
    then:
      - lambda: |-
          bool api_ok = global_api_server != nullptr && global_api_server->is_connected();
          bool mqtt_ok = mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected();
          bool ha_ok = api_ok || mqtt_ok;
          bool sd_ok = id(sd_card).is_mounted();
          bool usb_ok = id(usb_storage_1).is_mounted();
          bool nfs_ok = id(nfs_share).is_mounted();
          bool dps_ok = id(dps_connected_sensor_id).state;
          id(bs_ha_connected).publish_state(ha_ok);
          id(bs_sd_mounted).publish_state(sd_ok);
          id(bs_usb_mounted).publish_state(usb_ok);
          id(bs_nfs_mounted).publish_state(nfs_ok);
          if (!id(g_lvgl_ready)) return;
          lv_lock();
          lv_obj_set_style_text_color(id(lbl_icon_dps), dps_ok ? lv_color_hex(0x39FF14) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_icon_ha), ha_ok ? lv_color_hex(0x44AAFF) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_icon_sd), sd_ok ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_icon_usb), usb_ok ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_icon_nfs), nfs_ok ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_unlock();
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(g_fw_flashing);'
          then:
            - script.execute: fw_poll_status

  # Chart tick: push all series every 250 ms for time-based shifting
  - interval: 250ms
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          lv_lock();
          lv_chart_set_next_value(id(chart_main), id(ser_v),    id(g_chart_v_val));
          lv_chart_set_next_value(id(chart_main), id(ser_vset), id(g_chart_vset_val));
          lv_chart_set_next_value(id(chart_main), id(ser_i),    id(g_chart_i_val));
          lv_chart_set_next_value(id(chart_main), id(ser_iset), id(g_chart_iset_val));
          lv_chart_set_next_value(id(chart_main), id(ser_p),    id(g_chart_p_val));
          lv_unlock();

display:
  - platform: mipi_dsi
    id: dsi_display
    model: JC1060P470
    reset_pin: GPIO0
    update_interval: 17ms
    color_depth: 24

image:

uart:
  - id: uart1_id
    baud_rate: 19200
    rx_pin: GPIO01
    tx_pin: GPIO02

storage:
  id: storage_id

sd_storage:
  id: sd_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  data1_pin: GPIO40
  data2_pin: GPIO41
  data3_pin: GPIO42
  mode_1bit: false
  slot: 0

nfs_client:
  server: mainpi
  id: nfs_share
  uid: 1000
  gid: 1000
  export: "/opt/nfs/espshare"
  mount_path: "/nfs"

i2c:
  - id: i2c_bus_a
    sda: GPIO7
    scl: GPIO8
    scan: true
    frequency: 400kHz
    sda_pullup_enabled: False
    scl_pullup_enabled: False

touchscreen:
  - platform: gt911
    id: touchscreen_id
    on_touch:
      - logger.log:
          format: "Touch at %d/%d"
          args: [touch.x, touch.y]

usb_host:
  id: usb_host_id
  enable_hubs: True
  devices:
    - id: usb_uart_id
      vid: 0
      pid: 0

usb_uart:
  - id: pl2303_clone
    type: pl2303
    vid: 0x067B
    pid: 0x2303
    channels:
      - id: pl2303_uart_1
        baud_rate: 115200
        buffer_size: 256
        data_bits: 8
        stop_bits: 1
        parity: NONE
        debug: True
        dummy_receiver: False
        debug_prefix: "pl2303_uart_1"
  - id: ft232_clone
    type: FT232
    vid: 0x0403
    pid: 0x6001
    channels:
      - id: ftdi_uart_1
        baud_rate: 115200
        buffer_size: 256
        data_bits: 8
        stop_bits: 1
        parity: NONE
        debug: True
        dummy_receiver: False
        debug_prefix: "ftdi_uart_1"
  - id: octa_usb_uart
    type: CH348
