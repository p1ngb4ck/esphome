  # Trigger the firmware flash using the OpenDPS hub
  - id: fw_flash
    mode: single
    then:
      - lambda: |-
          std::string path = id(g_fw_selected);
          if (path.empty()) {
            id(g_fw_status) = "Error: no file selected";
            return;
          }
          id(g_fw_flashing) = true;
          id(g_fw_progress) = 0;
          id(g_fw_status) = "Uploading firmware...";
          id(opendps_firmware_path) = path;
          id(opendps_id).start_firmware_upgrade(path);
      - lvgl.widget.show: fw_progress_overlay
      - lvgl.label.update:
          id: fw_progress_status
          text: !lambda 'return id(g_fw_status).c_str();'
      - lvgl.bar.update:
          id: fw_progress_bar
          value: 0

  # Poll updates from g_fw_status / g_fw_progress into the overlay.
  # Called both from the 500ms interval (while g_fw_flashing) and directly
  # from the progress/complete callbacks for immediate LVGL updates.
  - id: fw_poll_status
    mode: single
    then:
      - lvgl.label.update:
          id: fw_progress_status
          text: !lambda 'return id(g_fw_status).c_str();'
      - lvgl.bar.update:
          id: fw_progress_bar
          value: !lambda 'return id(g_fw_progress);'

  # Loads scheme colors into theme_* globals (scheme 0 = custom, leave globals untouched)
  - id: scr_load_scheme
    then:
      - lambda: |-
          switch (id(g_theme_scheme)) {
            case 1: // Neon (default)
              id(theme_accent)   = 0x39FF14;
              id(theme_voltage)  = 0x39FF14;
              id(theme_current)  = 0x4499FF;
              id(theme_bg_main)  = 0x1E1E1E;
              id(theme_bg_panel) = 0x141414;
              id(theme_text_dim) = 0x555555;
              break;
            case 2: // Amber
              id(theme_accent)   = 0xFFBF00;
              id(theme_voltage)  = 0xFFDD44;
              id(theme_current)  = 0xFF8800;
              id(theme_bg_main)  = 0x1A1500;
              id(theme_bg_panel) = 0x0F0C00;
              id(theme_text_dim) = 0x665500;
              break;
            case 3: // Ice
              id(theme_accent)   = 0x00DDFF;
              id(theme_voltage)  = 0x88EEFF;
              id(theme_current)  = 0x4488FF;
              id(theme_bg_main)  = 0x0A1520;
              id(theme_bg_panel) = 0x050D18;
              id(theme_text_dim) = 0x336688;
              break;
            default: // 0 = custom, globals already have user values
              break;
          }

  # Applies theme_* globals to all styled widgets and triggers full redraw
  - id: scr_apply_theme
    then:
      - lambda: |-
          lv_lock();
          lv_color_t c_acc  = lv_color_hex((uint32_t)id(theme_accent));
          lv_color_t c_volt = lv_color_hex((uint32_t)id(theme_voltage));
          lv_color_t c_curr = lv_color_hex((uint32_t)id(theme_current));
          lv_color_t c_bg   = lv_color_hex((uint32_t)id(theme_bg_main));
          lv_color_t c_pan  = lv_color_hex((uint32_t)id(theme_bg_panel));
          lv_color_t c_dim  = lv_color_hex((uint32_t)id(theme_text_dim));

          // Derive secondary colors from tokens
          // bg_active = accent at ~15% brightness for active-button backgrounds
          uint8_t ar = (id(theme_accent) >> 16) & 0xFF;
          uint8_t ag = (id(theme_accent) >> 8)  & 0xFF;
          uint8_t ab = (id(theme_accent))        & 0xFF;
          lv_color_t c_acc_dim  = lv_color_make(ar/6, ag/6, ab/6);   // dark tint for active bg
          lv_color_t c_acc_mid  = lv_color_make(ar/3, ag/3, ab/3);   // mid tint for borders etc

          uint8_t vr = (id(theme_voltage) >> 16) & 0xFF;
          uint8_t vg = (id(theme_voltage) >> 8)  & 0xFF;
          uint8_t vb = (id(theme_voltage))        & 0xFF;
          lv_color_t c_volt_dim = lv_color_make(vr/6, vg/6, vb/6);

          uint8_t cr2 = (id(theme_current) >> 16) & 0xFF;
          uint8_t cg2 = (id(theme_current) >> 8)  & 0xFF;
          uint8_t cb2 = (id(theme_current))        & 0xFF;
          lv_color_t c_curr_dim = lv_color_make(cr2/6, cg2/6, cb2/6);

          // ── Page backgrounds ──────────────────────────────────────────
          lv_obj_set_style_bg_color(id(page_main)->obj,     c_bg,  LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(page_graphs)->obj,   lv_color_hex((uint32_t)id(theme_bg_panel)), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(page_settings)->obj, c_pan, LV_PART_MAIN);

          // ── Voltage slider ────────────────────────────────────────────
          lv_obj_set_style_bg_color(id(sl_v), c_volt_dim, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(sl_v), c_volt,     LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(sl_v), c_volt,     LV_PART_KNOB);
          lv_obj_set_style_border_color(id(sl_v), c_volt_dim, LV_PART_KNOB);

          // ── Current slider ────────────────────────────────────────────
          lv_obj_set_style_bg_color(id(sl_i), c_curr,     LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(sl_i), c_curr,     LV_PART_KNOB);
          lv_obj_set_style_border_color(id(sl_i), c_curr_dim, LV_PART_KNOB);

          // ── Power button ring / labels ────────────────────────────────
          bool pwr = id(g_output_on);
          lv_obj_set_style_border_color(id(pwr_ring), pwr ? c_acc : c_dim, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_pwr_icon), pwr ? c_acc : c_dim, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_pwr_on),  c_acc, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_pwr_off), c_dim, LV_PART_MAIN);

          // ── Set value labels ──────────────────────────────────────────
          lv_obj_set_style_text_color(id(lbl_setv), pwr ? c_acc_dim : c_volt, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_setv_unit), pwr ? c_acc_dim : c_volt, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_seti), pwr ? c_curr_dim : c_curr, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_seti_unit), pwr ? c_curr_dim : c_curr, LV_PART_MAIN);

          // ── Readout labels ────────────────────────────────────────────
          lv_obj_set_style_text_color(id(lbl_vout), pwr ? c_volt : lv_color_hex(0x2A2A2A), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_vout_unit), pwr ? c_volt : lv_color_hex(0x2A2A2A), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_iout), pwr ? c_curr : lv_color_hex(0x2A2A2A), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_iout_unit), pwr ? c_curr : lv_color_hex(0x2A2A2A), LV_PART_MAIN);

          // ── Tab bar ───────────────────────────────────────────────────
          // Active tab determined by current page — just set all to dim, active page handler will correct
          lv_obj_set_style_border_color(id(tab_btn_main),     c_acc, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(tab_btn_graphs),   c_acc, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(tab_btn_settings), c_acc, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(tab_lbl_main),     c_dim, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(tab_lbl_graphs),   c_dim, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(tab_lbl_settings), c_dim, LV_PART_MAIN);

          // ── LCD panels ────────────────────────────────────────────────
          lv_obj_set_style_bg_color(id(lcd_panel_v),
            lv_color_make(vr/20, vg/20, vb/20), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(lcd_panel_v),
            lv_color_make(vr/8, vg/8, vb/8), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(lcd_panel_i),
            lv_color_make(cr2/20, cg2/20, cb2/20), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(lcd_panel_i),
            lv_color_make(cr2/8, cg2/8, cb2/8), LV_PART_MAIN);

          // ── DPS connected icon ────────────────────────────────────────
          bool dps_ok = id(dps_connected_sensor_id).state;
          lv_obj_set_style_text_color(id(lbl_icon_dps), dps_ok ? c_acc : lv_color_hex(0x333333), LV_PART_MAIN);

          // ── CV mode button (active state) ─────────────────────────────
          lv_obj_set_style_bg_color(id(btn_cv),   c_acc_dim, LV_STATE_DEFAULT);
          lv_obj_set_style_border_color(id(btn_cv), c_acc,   LV_STATE_DEFAULT);
          lv_obj_set_style_text_color(id(lbl_cv),  c_acc,   LV_PART_MAIN);

          // ── Preset bar buttons ────────────────────────────────────────
          // rebuilt by scr_rebuild_presets which reads theme globals at creation time

          // ── Settings page accent (title + edit buttons) ───────────────
          lv_obj_set_style_border_color(id(btn_open_preset_editor), c_acc, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_open_preset_editor),
            lv_color_make(ar/10, ag/10, ab/10), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(btn_open_theme_editor), c_acc, LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(btn_open_theme_editor),
            lv_color_make(ar/10, ag/10, ab/10), LV_PART_MAIN);

          lv_unlock();

  # Loads scheme then applies — call this from boot and from theme overlay Save
  - id: scr_theme_apply_full
    then:
      - script.execute: scr_load_scheme
      - script.execute: scr_apply_theme
      - script.execute: scr_rebuild_presets
      - lambda: |-
          lv_lock();
          lv_obj_report_style_change(NULL);
          lv_unlock();

  # Loads slot values from globals into g_edit_v/i AND repopulates textareas.
  # Call only when the slot changes (prev/next) or overlay first opens —
  # NOT during typing (would clobber user input mid-entry).
  - id: scr_update_edit_labels
    then:
      - lambda: |-
          lv_lock();
          float vv[12] = {
            id(preset_v_0), id(preset_v_1), id(preset_v_2), id(preset_v_3),
            id(preset_v_4), id(preset_v_5), id(preset_v_6), id(preset_v_7),
            id(preset_v_8), id(preset_v_9), id(preset_v_10), id(preset_v_11)
          };
          float ii[12] = {
            id(preset_i_0), id(preset_i_1), id(preset_i_2), id(preset_i_3),
            id(preset_i_4), id(preset_i_5), id(preset_i_6), id(preset_i_7),
            id(preset_i_8), id(preset_i_9), id(preset_i_10), id(preset_i_11)
          };
          int s = id(g_edit_slot);
          id(g_edit_v) = vv[s];
          id(g_edit_i) = ii[s];
          id(g_preset_new_unsaved) = false;
          char buf_slot[16];
          char buf_v[16];
          char buf_i[16];
          snprintf(buf_slot, sizeof(buf_slot), "%d / %d", s + 1, id(preset_count));
          lv_label_set_text(id(lbl_edit_slot), buf_slot);
          snprintf(buf_v, sizeof(buf_v), "%.2f", vv[s]);
          lv_textarea_set_text(id(preset_ta_v), buf_v);
          snprintf(buf_i, sizeof(buf_i), "%.3f", ii[s]);
          lv_textarea_set_text(id(preset_ta_a), buf_i);
          lv_obj_set_style_border_width(id(preset_v_field), 2, LV_PART_MAIN);
          lv_obj_set_style_border_width(id(preset_a_field), 1, LV_PART_MAIN);
          lv_obj_set_style_border_color(id(preset_v_field), lv_color_hex(0x39FF14), LV_PART_MAIN);
          lv_obj_set_style_border_color(id(preset_a_field), lv_color_hex(0x334466),  LV_PART_MAIN);
          // Hide Save (no unsaved changes yet), show [+] if room
          lv_obj_add_flag(id(btn_preset_edit_save), LV_OBJ_FLAG_HIDDEN);
          if (id(preset_count) < 12)
            lv_obj_clear_flag(id(btn_preset_add_new), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(id(btn_preset_add_new), LV_OBJ_FLAG_HIDDEN);
          lv_unlock();

  # UI-only refresh — updates slot label + Save/Add button visibility.
  # Safe to call during typing: does NOT touch textareas or g_edit_v/i.
  - id: scr_refresh_edit_ui
    then:
      - lambda: |-
          lv_lock();
          char buf[16];
          snprintf(buf, sizeof(buf), "%d / %d", id(g_edit_slot) + 1, id(preset_count));
          lv_label_set_text(id(lbl_edit_slot), buf);
          bool save_ok = id(g_preset_new_unsaved) && (id(g_edit_v) > 0.0f) && (id(g_edit_i) > 0.0f);
          if (save_ok)
            lv_obj_clear_flag(id(btn_preset_edit_save), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(id(btn_preset_edit_save), LV_OBJ_FLAG_HIDDEN);
          if (id(preset_count) < 12)
            lv_obj_clear_flag(id(btn_preset_add_new), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(id(btn_preset_add_new), LV_OBJ_FLAG_HIDDEN);
          lv_unlock();

  # Save edited preset: write new V/I to current slot, sort all slots by voltage,
  # track g_edit_slot to follow the entry after sorting, stay in editor.
  - id: scr_save_preset
    then:
      - lambda: |-
          lv_lock();
          // Always read from textareas — user may have typed without pressing kbd OK
          float v = atof(lv_textarea_get_text(id(preset_ta_v)));
          float i2 = atof(lv_textarea_get_text(id(preset_ta_a)));
          if (v <= 0.0f || i2 <= 0.0f) { lv_unlock(); return; }
          id(g_edit_v) = v;
          id(g_edit_i) = i2;
          float *vv[12] = {
            &id(preset_v_0),  &id(preset_v_1),  &id(preset_v_2),  &id(preset_v_3),
            &id(preset_v_4),  &id(preset_v_5),  &id(preset_v_6),  &id(preset_v_7),
            &id(preset_v_8),  &id(preset_v_9),  &id(preset_v_10), &id(preset_v_11)
          };
          float *ii[12] = {
            &id(preset_i_0),  &id(preset_i_1),  &id(preset_i_2),  &id(preset_i_3),
            &id(preset_i_4),  &id(preset_i_5),  &id(preset_i_6),  &id(preset_i_7),
            &id(preset_i_8),  &id(preset_i_9),  &id(preset_i_10), &id(preset_i_11)
          };
          // Write new values to current slot
          int s = id(g_edit_slot);
          *vv[s] = v;
          *ii[s] = i2;
          // Insertion-sort all slots by voltage ascending, tracking saved index
          int cnt = id(preset_count);
          int saved_idx = s;
          for (int a = 1; a < cnt; a++) {
            float kv = *vv[a], ki = *ii[a];
            int ai = (a == saved_idx) ? a : -1;
            int b = a - 1;
            while (b >= 0 && *vv[b] > kv) {
              *vv[b+1] = *vv[b]; *ii[b+1] = *ii[b];
              if (saved_idx == b) saved_idx = b + 1;
              b--;
            }
            *vv[b+1] = kv; *ii[b+1] = ki;
            if (ai == a) saved_idx = b + 1;
          }
          id(g_edit_slot) = saved_idx;
          id(g_preset_new_unsaved) = false;
          lv_unlock();
      - script.execute: scr_rebuild_presets
      - script.execute: scr_update_edit_labels

  # Delete preset at g_edit_slot: shift slots above it down, decrement count.
  - id: scr_delete_preset
    then:
      - lambda: |-
          int cnt = id(preset_count);
          if (cnt <= 1) return;  // never delete the last preset
          int s = id(g_edit_slot);
          // Arrays of pointers for shift
          float *vv[12] = {
            &id(preset_v_0),  &id(preset_v_1),  &id(preset_v_2),  &id(preset_v_3),
            &id(preset_v_4),  &id(preset_v_5),  &id(preset_v_6),  &id(preset_v_7),
            &id(preset_v_8),  &id(preset_v_9),  &id(preset_v_10), &id(preset_v_11)
          };
          float *ii[12] = {
            &id(preset_i_0),  &id(preset_i_1),  &id(preset_i_2),  &id(preset_i_3),
            &id(preset_i_4),  &id(preset_i_5),  &id(preset_i_6),  &id(preset_i_7),
            &id(preset_i_8),  &id(preset_i_9),  &id(preset_i_10), &id(preset_i_11)
          };
          for (int i = s; i < cnt - 1; i++) {
            *vv[i] = *vv[i + 1];
            *ii[i] = *ii[i + 1];
          }
          // Clear the vacated last slot
          *vv[cnt - 1] = 0.0f;
          *ii[cnt - 1] = 0.0f;
          id(preset_count) = cnt - 1;
          // Clamp edit slot
          if (id(g_edit_slot) >= id(preset_count))
            id(g_edit_slot) = id(preset_count) - 1;
          // If we just deleted a new unsaved slot, clear the flag
          id(g_preset_new_unsaved) = false;
      - script.execute: scr_update_edit_labels
      - script.execute: scr_rebuild_presets

  # Rebuilds all preset buttons in preset_bar from globals.
  # Called on boot and after saving preset edits.
  - id: scr_rebuild_presets
    mode: restart
    then:
      - lambda: |-
          lv_lock();
          // float arrays for easy indexed access
          float vv[12] = {
            id(preset_v_0), id(preset_v_1), id(preset_v_2), id(preset_v_3),
            id(preset_v_4), id(preset_v_5), id(preset_v_6), id(preset_v_7),
            id(preset_v_8), id(preset_v_9), id(preset_v_10), id(preset_v_11)
          };
          float ii[12] = {
            id(preset_i_0), id(preset_i_1), id(preset_i_2), id(preset_i_3),
            id(preset_i_4), id(preset_i_5), id(preset_i_6), id(preset_i_7),
            id(preset_i_8), id(preset_i_9), id(preset_i_10), id(preset_i_11)
          };
          int cnt = id(preset_count);
          if (cnt < 1) cnt = 1;
          if (cnt > 12) cnt = 12;

          lv_obj_t *bar = id(preset_bar);

          // Remove previously created buttons
          lv_obj_clean(bar);

          int32_t btn_w = 1024 / cnt;

          for (int i = 0; i < cnt; i++) {
            lv_obj_t *btn = lv_btn_create(bar);
            lv_obj_set_pos(btn, i * btn_w, 0);
            lv_obj_set_size(btn, btn_w, 96);
            lv_obj_set_style_bg_color(btn, lv_color_hex(0x0A0A0A), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_border_color(btn, lv_color_hex(0x1A1A1A), LV_PART_MAIN);
            lv_obj_set_style_border_width(btn, 1, LV_PART_MAIN);
            lv_obj_set_style_radius(btn, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_all(btn, 0, LV_PART_MAIN);
            // Remove default pressed/checked style changes
            lv_obj_set_style_bg_color(btn, lv_color_hex(0x0A0A0A), (lv_style_selector_t)((uint32_t)LV_PART_MAIN | (uint32_t)LV_STATE_PRESSED));

            // Inner container (non-clickable, flex column, centered)
            lv_obj_t *inner = lv_obj_create(btn);
            lv_obj_set_size(inner, btn_w - 6, 60);
            lv_obj_align(inner, LV_ALIGN_CENTER, 0, 0);
            lv_obj_set_style_bg_opa(inner, LV_OPA_TRANSP, LV_PART_MAIN);
            lv_obj_set_style_border_width(inner, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_all(inner, 0, LV_PART_MAIN);
            lv_obj_clear_flag(inner, LV_OBJ_FLAG_CLICKABLE);
            lv_obj_set_scrollbar_mode(inner, LV_SCROLLBAR_MODE_OFF);
            lv_obj_set_flex_flow(inner, LV_FLEX_FLOW_COLUMN);
            lv_obj_set_flex_align(inner, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER);
            lv_obj_set_style_pad_row(inner, 2, LV_PART_MAIN);

            char buf[16];
            // Voltage label
            lv_obj_t *lbl_v = lv_label_create(inner);
            snprintf(buf, sizeof(buf), "%.4gV", vv[i]);
            lv_label_set_text(lbl_v, buf);
            lv_obj_set_style_text_color(lbl_v, lv_color_hex((uint32_t)id(theme_voltage)), LV_PART_MAIN);
            lv_obj_set_style_text_font(lbl_v, &lv_font_montserrat_16, LV_PART_MAIN);

            // Current label
            lv_obj_t *lbl_i = lv_label_create(inner);
            snprintf(buf, sizeof(buf), "%.4gA", ii[i]);
            lv_label_set_text(lbl_i, buf);
            lv_obj_set_style_text_color(lbl_i, lv_color_hex((uint32_t)id(theme_current)), LV_PART_MAIN);
            lv_obj_set_style_text_font(lbl_i, &lv_font_montserrat_12, LV_PART_MAIN);

            // Store slot index in user_data for the click handler
            lv_obj_set_user_data(btn, (void*)(intptr_t)i);

            // Click event
            lv_obj_add_event_cb(btn, [](lv_event_t *e) {
              int slot = (int)(intptr_t)lv_obj_get_user_data((lv_obj_t *)lv_event_get_target(e));
              float vv2[12] = {
                id(preset_v_0), id(preset_v_1), id(preset_v_2), id(preset_v_3),
                id(preset_v_4), id(preset_v_5), id(preset_v_6), id(preset_v_7),
                id(preset_v_8), id(preset_v_9), id(preset_v_10), id(preset_v_11)
              };
              float ii2[12] = {
                id(preset_i_0), id(preset_i_1), id(preset_i_2), id(preset_i_3),
                id(preset_i_4), id(preset_i_5), id(preset_i_6), id(preset_i_7),
                id(preset_i_8), id(preset_i_9), id(preset_i_10), id(preset_i_11)
              };
              id(g_ui_active) = true;
              id(g_preset_active) = true;
              id(opendps_select_mode).make_call().set_option("cv").perform();
              id(voltage_number).make_call().set_value(vv2[slot]).perform();
              id(current_number).make_call().set_value(ii2[slot]).perform();
              // Highlight active, dim all others
              lv_obj_t *bar2 = id(preset_bar);
              uint32_t n = lv_obj_get_child_count(bar2);
              for (uint32_t ci = 0; ci < n; ci++) {
                lv_obj_t *child = lv_obj_get_child(bar2, ci);
                lv_obj_set_style_bg_color(child,
                  (int)ci == slot ? lv_color_hex((uint32_t)id(theme_accent) & 0x333333) : lv_color_hex(0x0A0A0A),
                  LV_PART_MAIN);
              }
              id(g_preset_active) = false;
              id(g_ui_active) = false;
            }, LV_EVENT_CLICKED, nullptr);
          }
          lv_unlock();

  # Updates scheme name label, all 6 swatch slot buttons, and the colorwheel
  # to reflect current g_theme_scheme and g_editing_color_token.
  # Called on overlay open, scheme prev/next, and slot prev/next.
  # Also applies the current scheme immediately for live preview.
  - id: scr_update_theme_labels
    then:
      - script.execute: scr_load_scheme
      - script.execute: scr_apply_theme
      - lambda: |-
          lv_lock();
          const char *scheme_names[] = { "Custom", "Neon", "Amber", "Ice" };
          int s = id(g_theme_scheme);
          if (s < 0 || s > 3) s = 0;
          bool is_custom = (s == 0);
          lv_label_set_text(id(lbl_theme_name), scheme_names[s]);

          // Hint text: editing instructions for Custom, read-only notice for presets
          if (is_custom)
            lv_label_set_text(id(lbl_theme_hint), "— tap a color slot below to edit");
          else
            lv_label_set_text(id(lbl_theme_hint), "— read-only preset — switch to Custom to edit");

          // Show/hide edit UI based on whether we are in Custom mode
          if (is_custom) {
            lv_obj_clear_flag(id(theme_edit_row),    LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(theme_palette_row), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(theme_save_bar),    LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(theme_edit_row),    LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(theme_palette_row), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(theme_save_bar),    LV_OBJ_FLAG_HIDDEN);
          }

          // Update the 6 slot swatch bg colors
          uint32_t tokens[6] = {
            (uint32_t)id(theme_accent),   (uint32_t)id(theme_voltage),
            (uint32_t)id(theme_current),  (uint32_t)id(theme_bg_main),
            (uint32_t)id(theme_bg_panel), (uint32_t)id(theme_text_dim)
          };
          lv_obj_t *swatches[6] = {
            id(swatch_accent),   id(swatch_voltage), id(swatch_current),
            id(swatch_bg_main),  id(swatch_bg_panel), id(swatch_text_dim)
          };
          for (int i = 0; i < 6; i++)
            lv_obj_set_style_bg_color(swatches[i], lv_color_hex(tokens[i]), LV_PART_MAIN);

          // Active swatch highlight with contrast border color
          // Compute perceived luminance (0..255) of the swatch bg to pick a contrasting border.
          // Use integer approximation: L ≈ (2*R + 5*G + B) / 8  (BT.601 integer weights)
          int tok = id(g_editing_color_token);
          for (int i = 0; i < 6; i++) {
            bool active = (i == tok);
            lv_obj_set_style_border_width(swatches[i], active ? 3 : 1, LV_PART_MAIN);
            if (active) {
              uint32_t c = tokens[i];
              uint8_t r = (c >> 16) & 0xFF;
              uint8_t g = (c >> 8)  & 0xFF;
              uint8_t b =  c        & 0xFF;
              int lum = (2 * (int)r + 5 * (int)g + (int)b) / 8;
              // Always use a bright border so it pops on the dark overlay background.
              // Near-white swatches (lum > 200) get cyan; everything else gets white.
              uint32_t border_rgb = (lum > 200) ? 0x00FFFF : 0xFFFFFF;
              lv_obj_set_style_border_color(swatches[i], lv_color_hex(border_rgb), LV_PART_MAIN);
            } else {
              lv_obj_set_style_border_color(swatches[i], lv_color_hex(0x333333), LV_PART_MAIN);
            }
          }

          // Slot description labels
          const char *slot_names[] = { "Accent", "Voltage", "Current", "BG Main", "BG Panel", "Text Dim" };
          const char *slot_descs[] = {
            "UI accent — buttons, borders, active elements",
            "Voltage readout and set-value color",
            "Current readout and set-value color",
            "Main page background",
            "Panel / secondary background",
            "Dimmed text and inactive labels"
          };
          lv_label_set_text(id(lbl_color_slot_name), slot_names[tok]);
          lv_label_set_text(id(lbl_color_slot_desc), slot_descs[tok]);

          // Update current color preview swatch
          lv_obj_set_style_bg_color(id(swatch_current_color), lv_color_hex(tokens[tok]), LV_PART_MAIN);

          // Set hex textarea to current token color (only matters when edit row is visible)
          char hex_buf[7];
          snprintf(hex_buf, sizeof(hex_buf), "%06X", (unsigned int)(tokens[tok] & 0xFFFFFF));
          lv_textarea_set_text(id(theme_hex_input), hex_buf);

          lv_unlock();

  - id: scr_cal_update_ui
    then:
      - lambda: |-
          if (!id(g_lvgl_ready)) return;
          lv_lock();
          auto state = id(opendps_id).get_calibration_assistant_state();

          // Phase indicator: 0=Vin 1=Vout 2=Iout 3=CC 4=Done/Idle
          int phase = 0;
          if (state >= 10 && state < 20) phase = 1;      // CAL_VOUT_*
          else if (state >= 20 && state < 30) phase = 2; // CAL_IOUT_*
          else if (state >= 30 && state < 40) phase = 3; // CAL_CC_*
          else if (state == 40) phase = 4;               // CAL_COMPLETE
          else if (state == 0)  phase = 5;               // CAL_IDLE

          lv_obj_t *phases[4] = {
            id(cal_phase_vin), id(cal_phase_vout),
            id(cal_phase_iout), id(cal_phase_cc)
          };
          for (int i = 0; i < 4; i++) {
            bool active = (i == phase);
            lv_obj_set_style_bg_color(phases[i],
              active ? lv_color_hex(0x39FF14) : lv_color_hex(0x2A2A3A), LV_PART_MAIN);
            lv_obj_set_style_text_color(
              lv_obj_get_child(phases[i], 0),
              active ? lv_color_hex(0x000000) : lv_color_hex(0x666688), LV_PART_MAIN);
          }

          // Instruction text per state
          const char *instr = "";
          const char *sub = "";
          bool needs_input = false;
          bool auto_running = false;

          switch (state) {
            case 0:  // CAL_IDLE
              instr = "Calibration complete or not started.";
              sub = "Press Start to begin a full calibration sequence.";
              break;
            case 1:  // CAL_VIN_LOW_WAIT_INPUT
              instr = "STEP 1a — Input Voltage (Low Point)";
              sub = "Connect the LOWER supply voltage to the DPS.\nMeasure input voltage with a multimeter.\nEnter the measured value in mV, then press Submit.";
              needs_input = true;
              break;
            case 2:  // CAL_VIN_LOW_RECORD
              instr = "Reading Vin ADC for low point...";
              sub = "Please wait.";
              auto_running = true;
              break;
            case 3:  // CAL_UART_PAUSED
              instr = "STEP 1b — Input Voltage (High Point)";
              sub = "1. Power OFF the DPS\n2. Connect the HIGHER supply voltage\n3. Power the DPS back ON\n4. Measure the higher supply voltage (mV)\n5. Enter the value and press Submit.";
              needs_input = true;
              break;
            case 4:  // CAL_VIN_HIGH_RECORD
              instr = "Reading Vin ADC for high point...";
              sub = "Please wait.";
              auto_running = true;
              break;
            case 5:  // CAL_VIN_CALCULATE
              instr = "Calculating input voltage calibration...";
              sub = "Please wait.";
              auto_running = true;
              break;
            case 10: // CAL_VOUT_SWEEP
              instr = "STEP 2 — Output Voltage — sweeping DAC range...";
              sub = "Please wait. Do NOT connect anything to the output yet.";
              auto_running = true;
              break;
            case 11: // CAL_VOUT_LOW_WAIT_INPUT
              instr = "STEP 2a — Output Voltage (Low Point ~10%)";
              sub = "Measure the OUTPUT voltage with a multimeter.\nEnter the measured value in mV, then press Submit.";
              needs_input = true;
              break;
            case 12: // CAL_VOUT_LOW_RECORD
              instr = "Recording V_ADC for low point...";
              sub = "Please wait.";
              auto_running = true;
              break;
            case 13: // CAL_VOUT_HIGH_WAIT_INPUT
              instr = "STEP 2b — Output Voltage (High Point ~90%)";
              sub = "Measure the OUTPUT voltage with a multimeter.\nEnter the measured value in mV, then press Submit.";
              needs_input = true;
              break;
            case 14: // CAL_VOUT_HIGH_RECORD
              instr = "Recording V_ADC for high point...";
              sub = "Please wait.";
              auto_running = true;
              break;
            case 15: // CAL_VOUT_CALCULATE
              instr = "Calculating output voltage calibration...";
              sub = "Please wait.";
              auto_running = true;
              break;
            case 20: // CAL_IOUT_MAX_CURRENT_INPUT
              instr = "STEP 3 — Output Current — Max current";
              sub = "Enter the maximum output current of your DPS in Amps.\n(e.g. 5.0 for DPS5005, 3.0 for DPS5003)";
              needs_input = true;
              break;
            case 21: // CAL_IOUT_LOAD_RESISTANCE_INPUT
              instr = "STEP 3 — Output Current — Load resistance";
              sub = "Enter your load resistance in Ohms.\n(e.g. 10.0 for a 10Ω load resistor)";
              needs_input = true;
              break;
            case 22: // CAL_IOUT_LOAD_WATTAGE_INPUT
              instr = "STEP 3 — Output Current — Load wattage";
              sub = "Enter your load's maximum power rating in Watts.\n(e.g. 50 for a 50W load resistor)";
              needs_input = true;
              break;
            case 23: // CAL_IOUT_CONNECT_LOAD
              instr = "STEP 3 — Connect your load to the DPS output";
              sub = "Connect your load resistor to the DPS output terminals.\nThen press Confirm to continue.";
              needs_input = false;
              break;
            case 24: // CAL_IOUT_SWEEP
              instr = "Sweeping current range — please wait...";
              sub = "Auto-measuring. Do not disconnect the load.";
              auto_running = true;
              break;
            case 25: // CAL_IOUT_CALCULATE
              instr = "Calculating current calibration...";
              sub = "Please wait.";
              auto_running = true;
              break;
            case 30: // CAL_CC_SHORT_OUTPUT
              instr = "STEP 4 — Short the DPS output";
              sub = "Connect a thick wire (short circuit) across the DPS output terminals.\nThen press Confirm to continue.";
              needs_input = false;
              break;
            case 31: // CAL_CC_SWEEP
            case 32: // CAL_CC_MEASURE_SWEEP
              instr = "Sweeping CC range — please wait...";
              sub = "Auto-measuring. Do not remove the short.";
              auto_running = true;
              break;
            case 33: // CAL_CC_CALCULATE
              instr = "Calculating CC calibration...";
              sub = "Please wait.";
              auto_running = true;
              break;
            case 40: // CAL_COMPLETE
              instr = "Calibration complete!";
              sub = "All parameters have been calculated and applied.\nYou can now save to storage or close this assistant.";
              break;
            case 41: // CAL_ERROR
              instr = "Calibration error!";
              sub = "An error occurred. Check the log for details.\nYou may cancel and try again.";
              break;
            default:
              instr = "Running...";
              sub = "Please wait.";
              auto_running = true;
              break;
          }

          lv_label_set_text(id(lbl_cal_instr), instr);
          lv_label_set_text(id(lbl_cal_sub), sub);

          // Show/hide input area vs auto-running indicator
          if (needs_input) {
            lv_obj_clear_flag(id(cal_assist_input_row), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(cal_assist_kbd)->obj, LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(btn_cal_assist_submit), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_cal_auto_running), LV_OBJ_FLAG_HIDDEN);
            // For confirm-only steps (connect load, short output): hide input, show confirm label on button
            bool confirm_only = (state == 23 || state == 30);
            if (confirm_only) {
              lv_obj_add_flag(id(cal_assist_input_row), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(cal_assist_kbd)->obj, LV_OBJ_FLAG_HIDDEN);
            }
            lv_label_set_text(id(lbl_cal_submit_btn),
              (state == 23 || state == 30) ? "Confirm" : "Submit");
          } else if (auto_running) {
            lv_obj_add_flag(id(cal_assist_input_row), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(cal_assist_kbd)->obj, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(btn_cal_assist_submit), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(lbl_cal_auto_running), LV_OBJ_FLAG_HIDDEN);
          } else {
            // idle or complete — hide input, hide submit, hide spinner
            lv_obj_add_flag(id(cal_assist_input_row), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(cal_assist_kbd)->obj, LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(btn_cal_assist_submit), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(lbl_cal_auto_running), LV_OBJ_FLAG_HIDDEN);
          }

          // Save button: only show when complete
          if (state == 40) {
            lv_obj_clear_flag(id(btn_cal_assist_save), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(btn_cal_assist_save), LV_OBJ_FLAG_HIDDEN);
          }

          lv_unlock();

