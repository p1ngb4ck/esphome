                  flex_align_main: START
                  flex_align_cross: STRETCH
                  pad_row: 8

                widgets:
                  # ── Title + Cancel ─────────────────────────────────────────
                  - obj:
                      height: 36
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollbar_mode: "off"
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
