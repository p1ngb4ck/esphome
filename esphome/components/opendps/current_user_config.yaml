                                  lv_unlock();
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Current"
                                  text_color: 0x000000
                                  text_font: montserrat_12
                        - obj:
                            id: swatch_bg_main
                            width: 124
                            height: 44
                            bg_color: 0x1E1E1E
                            radius: 6
                            border_color: 0x444444
                            border_width: 1
                            clickable: true
                            on_click:
                              - lambda: |-
                                  lv_lock();
                                  id(g_editing_color_token) = 3;
                                  id(scr_update_theme_labels).execute();
                                  lv_unlock();
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "BG Main"
                                  text_color: 0x888888
                                  text_font: montserrat_12
                        - obj:
                            id: swatch_bg_panel
                            width: 124
                            height: 44
                            bg_color: 0x141414
                            radius: 6
