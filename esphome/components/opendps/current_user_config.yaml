      # ── CALIBRATION ASSISTANT OVERLAY ───────────────────────────────
      # Layout (900×540, pad_all=16 → inner 868×508, pad_row=8):
      #   Title+cancel     36px
      #   Phase bar        36px
      #   Instruction      68px  (large text, 2 lines)
      #   Sub-text         64px  (small, up to 4 lines)
      #   Input row        48px  (hidden when auto-running or confirm-only)
      #   Keyboard         160px (hidden when auto-running or confirm-only)
      #   Auto label       28px  (shown only when auto-running)
      #   Action bar       48px  (Submit/Confirm + Save + Cancel)
      #   gaps (8×7)       56px
      #   total           544px — keyboard/input swap keeps it within bounds
