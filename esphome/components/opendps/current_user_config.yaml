usb_storage:
  id: usb_storage_id
  devices:
    - id: usb_storage_1
      vid: 0
      pid: 0
      mount_path: /usb

switch:
  - platform: template
    name: "OpenDPS Output"
    id: dps_output_switch
    icon: "mdi:power"
    lambda: |-
      return id(dps_output_sensor_id).state;
    turn_on_action:
      - opendps.enable_output:
          id: opendps_id
          enable: true
    turn_off_action:
      - opendps.enable_output:
          id: opendps_id
          enable: false
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 30
  - platform: template
    name: "Lock OpenDPS"
    id: dps_lock_switch
    icon: "mdi:lock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - opendps.lock:
          id: opendps_id
          locked: true
    turn_off_action:
      - opendps.lock:
          id: opendps_id
          locked: false
    on_state:
      - globals.set:
          id: g_locked
          value: !lambda 'return x;'
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update:
                id: btn_lock
                bg_color: 0x3A1A00
                bg_opa: COVER
                border_color: 0xFF8800
                border_width: 2
            - lvgl.label.update:
                id: lbl_lock
                text_color: 0xFF8800
          else:
            - lvgl.widget.update:
                id: btn_lock
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_lock
                text_color: 0x444444
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 20
  - platform: template
    name: "Log to File"
    id: datalogger_switch
    icon: "mdi:content-save"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - opendps.start_datalog:
          id: opendps_id
    turn_off_action:
      - opendps.stop_datalog:
          id: opendps_id
    on_state:
      - globals.set:
          id: g_logging
          value: !lambda 'return x;'
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update:
                id: btn_log
                bg_color: 0x00243A
                bg_opa: COVER
                border_color: 0x00AAFF
                border_width: 2
            - lvgl.label.update:
                id: lbl_log
                text_color: 0x00AAFF
          else:
            - lvgl.widget.update:
                id: btn_log
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_log
                text_color: 0x444444
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 70
  - platform: gpio
    pin: GPIO11  # PA-CTRL
    name: "Speaker enable"
    restore_mode: ALWAYS_ON
    id: speaker_enable_switch
    inverted: False
  - platform: template
    name: "Ring Timer"
    id: timer_ringing
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      # Stop playing the alarm
      - media_player.stop:
          id: speaker_media_player_id
          announcement: true
    on_turn_on:
      - while:
          condition:
            switch.is_on: timer_ringing
          then:
            # Play the alarm sound as an announcement
            - media_player.speaker.play_on_device_media_file:
                id: speaker_media_player_id
                media_file: alarm_sound
                announcement: true
            # Wait until the alarm sound starts playing
            - wait_until:
                media_player.is_announcing:
                  id: speaker_media_player_id
            # Wait until the alarm sound stops playing
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: speaker_media_player_id

audio_dac:
  - platform: es8311
    id: es8311_codec
    i2c_id: i2c_bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 44100
    use_mclk: True
    use_microphone: True
    mic_gain: 24DB

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

microphone:
  - platform: i2s_audio
    id: external_mic
    i2s_audio_id: i2s_output
    i2s_mode: primary
    adc_type: external
    i2s_din_pin: GPIO48
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: stereo

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_output
    id: speaker_id
    i2s_dout_pin: GPIO09
    dac_type: external
    sample_rate: 44100
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_codec
    buffer_duration: 1000ms
    i2s_mode: primary
  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    num_channels: 1
    task_stack_in_psram: True
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

media_player:
  - platform: speaker
    name: "Speaker Media Player"
    id: speaker_media_player_id
    task_stack_in_psram: True
    buffer_size: 1000000
    volume_initial: 70%
    volume_max: 70%
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      sample_rate: 44100
      num_channels: 1
    files:
      - id: alarm_sound
        file: testsound.flac
      - id: wake_sound_file
        file: 'sounds/timer_finished.flac'

mqtt:
  broker: vmzone.duckdns.org
  username: tab7
  password: !secret mqtt_password_tab7
  discover_ip: True
  discovery: True

http_file_browser:
  id: filebrowser
  storage_id: storage_id
  root_path: "/"
  url_prefix: "/files"
  auth_enabled: true
  username: !secret file_browser_username
  password: !secret file_browser_password
  enable_upload: True
  enable_deletion: True

web_server:
  id: webserver_id
  version: 3
  sorting_groups:
    - id: opendps_sensors
      name: "OpenDPS sensors"
      sorting_weight: 10
    - id: opendps_control
      name: "OpenDPS control"
      sorting_weight: 20
    - id: esphome_device_control
      name: "ESPHome device controls"
      sorting_weight: 30

opendps:
  id: opendps_id
  uart_id: uart1_id
  update_interval: 50ms
  default_brightness: 80
  bootloader_baud_rate: 19200
  bootloader_legacy: true
  tcp_bridge:
    tcp_bridge_port: 5005
    tcp_bridge_disconnect_delay: 1s
    tcp_bridge_frame_timeout: 500ms
  calibration_backup:
    calibration_backup_path: "/sdcard/opendps_calibration.cfg"
    calibration_auto_restore: true
  on_connect:
    - script.execute: opendps_on_connect_init
    - lambda: |-
        // Voltage and current set values
        id(voltage_number).make_call().set_value(id(opendps_id).get_voltage_setting()).perform();
        id(current_number).make_call().set_value(id(opendps_id).get_current_setting()).perform();

        // Output mode (function: cv / cc / cl)
        auto func = id(opendps_id).get_data().cur_func;
        if (!func.empty())
          id(opendps_select_mode).make_call().set_option(func).perform();

        // Output enabled state - set global only, LVGL done below
        id(g_output_on) = id(opendps_id).get_data().output_enabled;

        // Brightness
        id(display_backlight).make_call().set_brightness(id(opendps_id).get_brightness_setting() / 100.0f).perform();

  datalogger:
    storage_path: "/sdcard/logs"
    filename_format: "dps_%Y%m%d_%H%M%S.csv"
    buffer_size: 1048576
    format: csv
    time_id: host_time
    columns:
      - system_time
      - elapsed_ms
      - voltage_in
      - voltage_out
      - current_out
      - power_out
      - output_enabled
    flush_interval: 10s

select:
  - platform: template
    id: opendps_select_mode
    name: "Select output mode"
    optimistic: true
    icon: mdi:cog-outline
    options:
      - "cv"
      - "cc"
      - "cl"
    set_action:
      - lambda: |-
          id(opendps_id).set_function(x.c_str());
    on_value:
      - if:
          condition:
            lambda: 'return id(g_lvgl_ready) && i == 0;'
          then:
            - lvgl.widget.update:
                id: btn_cv
                bg_color: 0x1A4A1A
                bg_opa: COVER
                border_color: 0x39FF14
                border_width: 3
            - lvgl.widget.update:
                id: btn_cc
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.widget.update:
                id: btn_cp
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_cv
                text_color: 0x39FF14
            - lvgl.label.update:
                id: lbl_cc
                text_color: 0x444444
            - lvgl.label.update:
                id: lbl_cp
                text_color: 0x444444
      - if:
          condition:
            lambda: 'return id(g_lvgl_ready) && i == 1;'
          then:
            - lvgl.widget.update:
                id: btn_cc
                bg_color: 0x3A3A00
                bg_opa: COVER
                border_color: 0xFFBF00
                border_width: 3
            - lvgl.widget.update:
                id: btn_cv
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.widget.update:
                id: btn_cp
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_cc
                text_color: 0xFFBF00
            - lvgl.label.update:
                id: lbl_cv
                text_color: 0x444444
            - lvgl.label.update:
                id: lbl_cp
                text_color: 0x444444
      - if:
          condition:
            lambda: 'return id(g_lvgl_ready) && i == 2;'
          then:
            - lvgl.widget.update:
                id: btn_cp
                bg_color: 0x3A0A0A
                bg_opa: COVER
                border_color: 0xFF3333
                border_width: 3
            - lvgl.widget.update:
                id: btn_cv
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.widget.update:
                id: btn_cc
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_cp
                text_color: 0xFF3333
            - lvgl.label.update:
                id: lbl_cv
                text_color: 0x444444
            - lvgl.label.update:
                id: lbl_cc
                text_color: 0x444444
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 40
  - id: change_baud_rate
    name: "OpenDPS serial connection baudrate"
    platform: template
    options:
      - "2400"
      - "9600"
      - "19200"
      - "38400"
      - "57600"
      - "115200"
      - "256000"
      - "512000"
      - "921600"
    initial_option: "57600"
    optimistic: true
    restore_value: True
    internal: false
    entity_category: config
    icon: mdi:swap-horizontal
    set_action:
      - lambda: |-
          id(opendps_id).set_uart_baud(std::stoul(x.c_str()));
          id(uart1_id).flush();
          uint32_t new_baud_rate = stoi(x);
          ESP_LOGD("change_baud_rate", "Changing baud rate from %" PRIu32 " to %" PRIu32 "",id(uart1_id).get_baud_rate(),
                   new_baud_rate);
          if (id(uart1_id).get_baud_rate() != new_baud_rate) {
            id(uart1_id).set_baud_rate(new_baud_rate);
            id(uart1_id).load_settings(true);
          }
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 70

text:
  # Single input field for ALL calibration assistant steps.
  # Enter your measurement value here, then press "Calibration Step" to submit.
  - platform: template
    name: "Calibration Input"
    id: cal_input
    mode: text
    optimistic: true
    initial_value: "0"
  - platform: template
    mode: TEXT
    name: "OpenDPS firmware path"
    icon: mdi:file-send-outline
    id: opendps_fw_path_input
    optimistic: True
    on_value:
      then:
        - lambda:
            id(opendps_firmware_path) = x;
            return;
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 110
  - platform: template
    name: "Cal: V_ADC_K"
    id: input_v_adc_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: V_ADC_C"
    id: input_v_adc_c
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: V_DAC_K"
    id: input_v_dac_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: V_DAC_C"
    id: input_v_dac_c
    mode: text
    optimistic: true

  # --- Current Calibration ---
  - platform: template
    name: "Cal: A_ADC_K"
    id: input_a_adc_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: A_ADC_C"
    id: input_a_adc_c
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: A_DAC_K"
    id: input_a_dac_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: A_DAC_C"
    id: input_a_dac_c
    mode: text
    optimistic: true

  # --- Input Voltage Calibration ---
  - platform: template
    name: "Cal: VIN_ADC_K"
    id: input_vin_adc_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: VIN_ADC_C"
    id: input_vin_adc_c
    mode: text
    optimistic: true

  # --- Calibration Assistant Parameters ---
  - platform: template
    name: "Cal Assist: Vin Low (mV)"
    id: input_vin_low
    mode: text
    optimistic: true
    initial_value: "12000"
    on_value:
      - lambda: |-
          id(cal_vin_low_mv) = atof(x.c_str());
          ESP_LOGI("cal", "Vin LOW set to: %.0f mV", id(cal_vin_low_mv));

  - platform: template
    name: "Cal Assist: Vin High (mV)"
    id: input_vin_high
    mode: text
    optimistic: true
    initial_value: "48000"
    on_value:
      - lambda: |-
          id(cal_vin_high_mv) = atof(x.c_str());
          ESP_LOGI("cal", "Vin HIGH set to: %.0f mV", id(cal_vin_high_mv));

  - platform: template
    name: "Cal Assist: Load Resistance (Ohm)"
    id: input_load_resistance
    mode: text
    optimistic: true
    initial_value: "10.0"
    on_value:
      - lambda: |-
          id(cal_load_resistance) = atof(x.c_str());
          ESP_LOGI("cal", "Load resistance set to: %.2f Ohm", id(cal_load_resistance));

  - platform: template
    name: "Cal Assist: Load Max Wattage (W)"
    id: input_load_wattage
    mode: text
    optimistic: true
    initial_value: "50.0"
    on_value:
      - lambda: |-
          id(cal_load_max_wattage) = atof(x.c_str());
          ESP_LOGI("cal", "Load max wattage set to: %.1f W", id(cal_load_max_wattage));

  - platform: template
    name: "Cal Assist: Max DPS Current (A)"
    id: input_max_current
    mode: text
    optimistic: true
    initial_value: "5.0"
    on_value:
      - lambda: |-
          id(cal_max_dps_current) = atof(x.c_str());
          ESP_LOGI("cal", "Max DPS current set to: %.1f A", id(cal_max_dps_current));

  # --- Backup Path ---
  - platform: template
    name: "Calibration Backup Path"
    id: input_backup_path
    mode: text
    optimistic: true
    initial_value: "/sdcard/opendps_calibration.cfg"
    on_value:
      - lambda: |-
          id(cal_backup_path) = x;
          ESP_LOGI("cal", "Backup path: %s", x.c_str());

binary_sensor:
  - platform: opendps
    opendps_id: opendps_id
    output_enabled:
      id: dps_output_sensor_id
      name: "OpenDPS Output Enabled"
      icon: mdi:meter-electric-outline
      on_state:
        - globals.set:
            id: g_output_on
            value: !lambda 'return x;'
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.widget.update:
                  id: pwr_ring
                  border_color: 0x39FF14
                  shadow_color: 0x39FF14
                  shadow_width: 16
              - lambda: |-
                  lv_lock();
                  lv_obj_add_flag(id(lbl_pwr_off), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(id(lbl_pwr_on), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_set_style_text_color(id(lbl_pwr_on), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_pwr_icon), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_vout), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_vout_unit), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_iout), lv_color_hex(0x4499FF), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_iout_unit), lv_color_hex(0x4499FF), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_setv), lv_color_hex(0x1A4A1A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_setv_unit), lv_color_hex(0x1A4A1A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_seti), lv_color_hex(0x1A1A4A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_seti_unit), lv_color_hex(0x1A1A4A), LV_PART_MAIN);
                  lv_unlock();
            else:
              - lvgl.widget.update:
                  id: pwr_ring
                  border_color: 0x555555
                  shadow_color: 0x000000
                  shadow_width: 0
              - lambda: |-
                  lv_lock();
                  lv_obj_clear_flag(id(lbl_pwr_off), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_add_flag(id(lbl_pwr_on), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_set_style_text_color(id(lbl_pwr_off), lv_color_hex(0x555555), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_pwr_icon), lv_color_hex(0x555555), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_vout), lv_color_hex(0x2A2A2A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_vout_unit), lv_color_hex(0x2A2A2A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_iout), lv_color_hex(0x2A2A2A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_iout_unit), lv_color_hex(0x2A2A2A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_setv), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_setv_unit), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_seti), lv_color_hex(0x4499FF), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_seti_unit), lv_color_hex(0x4499FF), LV_PART_MAIN);
                  lv_unlock();
      web_server:
        sorting_group_id: opendps_sensors
        sorting_weight: 10
    connected:
      id: dps_connected_sensor_id
      name: "OpenDPS Connected"
      icon: mdi:power-plug
      on_state:
        - lambda: |-
            lv_lock();
            lv_obj_set_style_text_color(id(lbl_icon_dps), x ? lv_color_hex(0x39FF14) : lv_color_hex(0x333333), LV_PART_MAIN);
            lv_unlock();

  - platform: template
    id: bs_ha_connected
    name: "HA⁄MQTT Connected"
    lambda: |-
      bool api_ok = global_api_server != nullptr && global_api_server->is_connected();
      bool mqtt_ok = mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected();
      return api_ok || mqtt_ok;
    on_state:
      - lambda: |-
          lv_lock();
          lv_obj_set_style_text_color(id(lbl_icon_ha), x ? lv_color_hex(0x44AAFF) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_unlock();

  - platform: template
    id: bs_sd_mounted
    name: "SD Card Mounted"
    lambda: 'return id(sd_card).is_mounted();'
    on_state:
      - lambda: |-
          lv_lock();
          lv_obj_set_style_text_color(id(lbl_icon_sd), x ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_unlock();

  - platform: template
    id: bs_usb_mounted
    name: "USB Mounted"
    lambda: 'return id(usb_storage_1).is_mounted();'
    on_state:
      - lambda: |-
          lv_lock();
          lv_obj_set_style_text_color(id(lbl_icon_usb), x ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);
