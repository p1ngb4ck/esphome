                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: CENTER
                        flex_align_cross: CENTER
                        pad_column: 12
                      widgets:
                        - button:
                            id: btn_theme_prev
                            width: 44
                            height: 44
                            bg_color: 0x2A2A3A
                            border_color: 0x444466
                            border_width: 1
                            radius: 6
                            on_click:
                              - lambda: |-
                                  int s = id(g_theme_scheme) - 1;
                                  if (s < 0) s = 3;
                                  id(g_theme_scheme) = s;
                                  id(scr_update_theme_labels).execute();
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "<"
                                  text_color: 0xCCCCCC
                                  text_font: montserrat_20
                        - label:
                            id: lbl_theme_name
                            text: "Neon"
                            text_color: 0xFFFF66
                            text_font: montserrat_16
                            width: 120
                            align: CENTER
                        - button:
                            id: btn_theme_next
                            width: 44
                            height: 44
                            bg_color: 0x2A2A3A
                            border_color: 0x444466
                            border_width: 1
                            radius: 6
