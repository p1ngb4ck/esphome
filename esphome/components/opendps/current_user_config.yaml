      - obj:
          id: overlay_preset_editor
          x: 0
          y: 0
          width: 1024
          height: 600
          bg_color: 0x000000
          bg_opa: 86%
          border_width: 0
          radius: 0
          scrollbar_mode: "off"
          scrollable: false
          hidden: true

          widgets:
            # ── Dialog card ───────────────────────────────────────────────
            - obj:
                x: 62
                y: 30
                width: 900
                height: 540
                bg_color: 0x1A1A2A
                border_color: 0x39FF14
                border_width: 2
                radius: 10
                pad_all: 16
                scrollbar_mode: "off"
                scrollable: false
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: START
                  flex_align_cross: CENTER
                  pad_row: 10

                widgets:
                  # ── Title + close ────────────────────────────────────────
                  - obj:
                      width: 868
                      height: 36
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollbar_mode: "off"
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text: "EDIT PRESETS"
                            text_color: 0x39FF14
                            text_font: montserrat_16
                        - button:
                            width: 80
                            height: 30
                            bg_color: 0x333344
                            border_width: 0
                            radius: 4
                            on_click:
                              - lambda: |-
                                  lv_lock();
                                  id(g_preset_new_unsaved) = false;
                                  lv_obj_add_flag(id(overlay_preset_editor), LV_OBJ_FLAG_HIDDEN);
                                  lv_unlock();
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Cancel"
                                  text_color: 0xCCCCCC
                                  text_font: montserrat_14

                  # ── Slot navigator: ◄ N/M ► [+]  ···  [Delete] ─────────
                  - obj:
                      width: 868
                      height: 48
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollbar_mode: "off"
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        # ◄ N/M ► + optional [+]
                        - obj:
                            bg_opa: TRANSP
                            border_width: 0
                            pad_all: 0
                            scrollbar_mode: "off"
                            width: size_content
                            height: size_content
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_cross: CENTER
                              pad_column: 8
                            widgets:
                              - button:
                                  id: btn_preset_edit_prev
                                  width: 48
                                  height: 48
                                  bg_color: 0x2A2A3A
                                  border_color: 0x444466
                                  border_width: 1
                                  radius: 6
                                  on_click:
                                    - lambda: |-
                                        int s = id(g_edit_slot) - 1;
                                        if (s < 0) s = id(preset_count) - 1;
                                        id(g_edit_slot) = s;
                                        id(scr_update_edit_labels).execute();
                                  widgets:
                                    - label:
                                        align: CENTER
                                        text: "<"
                                        text_color: 0xCCCCCC
                                        text_font: montserrat_20
                              - label:
                                  id: lbl_edit_slot
                                  text: "1 / 8"
                                  text_color: 0xFFFF66
                                  text_font: montserrat_16
                                  width: 70
                                  align: CENTER
                              - button:
                                  id: btn_preset_edit_next
                                  width: 48
                                  height: 48
                                  bg_color: 0x2A2A3A
                                  border_color: 0x444466
                                  border_width: 1
                                  radius: 6
                                  on_click:
                                    - lambda: |-
                                        int s = (id(g_edit_slot) + 1) % id(preset_count);
                                        id(g_edit_slot) = s;
                                        id(scr_update_edit_labels).execute();
                                  widgets:
                                    - label:
                                        align: CENTER
                                        text: ">"
                                        text_color: 0xCCCCCC
                                        text_font: montserrat_20
                              # [+] only visible when below max preset count
                              - button:
                                  id: btn_preset_add_new
                                  width: 48
                                  height: 48
                                  bg_color: 0x1A3A1A
                                  border_color: 0x39FF14
                                  border_width: 1
                                  radius: 6
                                  hidden: true
                                  on_click:
                                    - lambda: |-
                                        lv_lock();
                                        int cnt = id(preset_count);
                                        if (cnt >= 12) { lv_unlock(); return; }
                                        float *vv[12] = {
                                          &id(preset_v_0),  &id(preset_v_1),  &id(preset_v_2),  &id(preset_v_3),
                                          &id(preset_v_4),  &id(preset_v_5),  &id(preset_v_6),  &id(preset_v_7),
                                          &id(preset_v_8),  &id(preset_v_9),  &id(preset_v_10), &id(preset_v_11)
                                        };
                                        float *ii[12] = {
                                          &id(preset_i_0),  &id(preset_i_1),  &id(preset_i_2),  &id(preset_i_3),
                                          &id(preset_i_4),  &id(preset_i_5),  &id(preset_i_6),  &id(preset_i_7),
                                          &id(preset_i_8),  &id(preset_i_9),  &id(preset_i_10), &id(preset_i_11)
                                        };
                                        // Read current values from textareas (user may not have pressed OK)
                                        float nv = atof(lv_textarea_get_text(id(preset_ta_v)));
                                        float ni = atof(lv_textarea_get_text(id(preset_ta_a)));
                                        if (nv <= 0.0f || ni <= 0.0f) { lv_unlock(); return; }
                                        id(g_edit_v) = nv;
                                        id(g_edit_i) = ni;
                                        // Append new slot at end
                                        *vv[cnt] = nv;
                                        *ii[cnt] = ni;
                                        id(preset_count) = cnt + 1;
                                        // Sort slots by voltage (insertion sort)
                                        for (int a = 1; a < id(preset_count); a++) {
                                          float kv = *vv[a], ki = *ii[a];
                                          int b = a - 1;
                                          while (b >= 0 && *vv[b] > kv) {
                                            *vv[b+1] = *vv[b]; *ii[b+1] = *ii[b]; b--;
                                          }
                                          *vv[b+1] = kv; *ii[b+1] = ki;
                                        }
                                        // Find the newly inserted slot
                                        for (int x = 0; x < id(preset_count); x++) {
                                          if (*vv[x] == id(g_edit_v) && *ii[x] == id(g_edit_i)) {
                                            id(g_edit_slot) = x; break;
                                          }
                                        }
                                        id(g_preset_new_unsaved) = false;
                                        lv_unlock();
                                        id(scr_rebuild_presets).execute();
                                        id(scr_update_edit_labels).execute();
                                  widgets:
                                    - label:
                                        align: CENTER
                                        text: "+"
                                        text_color: 0x39FF14
                                        text_font: montserrat_20
                        # Delete button — right side
                        - button:
                            id: btn_preset_edit_delete
                            width: 120
                            height: 48
                            bg_color: 0x3A1A1A
                            border_color: 0xFF4444
                            border_width: 1
                            radius: 6
                            on_click:
                              - lambda: |-
                                  lv_lock();
                                  lv_obj_clear_flag(id(overlay_preset_delete_confirm), LV_OBJ_FLAG_HIDDEN);
                                  lv_unlock();
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Delete"
                                  text_color: 0xFF4444
                                  text_font: montserrat_16

                  # ── Value display row: [V field]  [A field] ──────────────
                  - obj:
                      width: 868
                      height: 64
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollbar_mode: "off"
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: CENTER
                        flex_align_cross: CENTER
                        pad_column: 20
                      widgets:
                        # Voltage field — tap to focus keyboard here
                        - obj:
                            id: preset_v_field
                            flex_grow: 1
                            height: 64
                            bg_color: 0x0F1F0F
                            border_color: 0x39FF14
                            border_width: 2
                            radius: 8
                            pad_all: 0
                            scrollbar_mode: "off"
                            clickable: true
                            on_click:
                              - lambda: |-
                                  lv_lock();
                                  lv_keyboard_set_textarea(id(preset_kbd)->obj, id(preset_ta_v));
                                  lv_obj_set_style_border_width(id(preset_v_field), 2, LV_PART_MAIN);
                                  lv_obj_set_style_border_width(id(preset_a_field), 1, LV_PART_MAIN);
                                  lv_obj_set_style_border_color(id(preset_v_field), lv_color_hex(0x39FF14), LV_PART_MAIN);
                                  lv_obj_set_style_border_color(id(preset_a_field), lv_color_hex(0x334466),  LV_PART_MAIN);
                                  lv_unlock();
                            widgets:
                              - label:
                                  x: 10
                                  y: 4
                                  text: "V"
                                  text_color: 0x39FF14
                                  text_font: montserrat_12
                              - textarea:
                                  id: preset_ta_v
                                  x: 10
                                  y: 20
                                  width: SIZE_CONTENT
                                  height: 36
                                  one_line: true
                                  text_font: montserrat_24
                                  text_color: 0x39FF14
                                  bg_opa: TRANSP
                                  border_width: 0
                                  pad_all: 0
                                  cursor:
                                    bg_color: 0x39FF14
                                  on_value:
                                    - lambda: |-
                                        lv_lock();
                                        float v = atof(lv_textarea_get_text(id(preset_ta_v)));
                                        if (v >= 0.0f && v <= 50.0f) {
                                          id(g_edit_v) = v;
                                          id(g_preset_new_unsaved) = true;
                                        }
                                        lv_unlock();
                                    - script.execute: scr_refresh_edit_ui
                        # Current field — tap to focus keyboard here
                        - obj:
                            id: preset_a_field
                            flex_grow: 1
                            height: 64
                            bg_color: 0x0F0F1F
                            border_color: 0x334466
                            border_width: 1
                            radius: 8
                            pad_all: 0
                            scrollbar_mode: "off"
                            clickable: true
                            on_click:
                              - lambda: |-
                                  lv_lock();
                                  lv_keyboard_set_textarea(id(preset_kbd)->obj, id(preset_ta_a));
                                  lv_obj_set_style_border_width(id(preset_a_field), 2, LV_PART_MAIN);
                                  lv_obj_set_style_border_width(id(preset_v_field), 1, LV_PART_MAIN);
                                  lv_obj_set_style_border_color(id(preset_a_field), lv_color_hex(0x4499FF), LV_PART_MAIN);
                                  lv_obj_set_style_border_color(id(preset_v_field), lv_color_hex(0x334466),  LV_PART_MAIN);
                                  lv_unlock();
                            widgets:
                              - label:
                                  x: 10
                                  y: 4
                                  text: "A"
                                  text_color: 0x4499FF
                                  text_font: montserrat_12
                              - textarea:
                                  id: preset_ta_a
                                  x: 10
                                  y: 20
                                  width: SIZE_CONTENT
                                  height: 36
                                  one_line: true
                                  text_font: montserrat_24
                                  text_color: 0x4499FF
                                  bg_opa: TRANSP
                                  border_width: 0
                                  pad_all: 0
                                  cursor:
                                    bg_color: 0x4499FF
                                  on_value:
                                    - lambda: |-
                                        lv_lock();
                                        float a = atof(lv_textarea_get_text(id(preset_ta_a)));
                                        if (a >= 0.0f && a <= 5.0f) {
                                          id(g_edit_i) = a;
                                          id(g_preset_new_unsaved) = true;
                                        }
                                        lv_unlock();
                                    - script.execute: scr_refresh_edit_ui

                  # ── Number keyboard — always visible ─────────────────────
                  - keyboard:
                      id: preset_kbd
                      mode: NUMBER
                      width: 868
                      height: 272
                      on_ready:
                        - script.execute: scr_refresh_edit_ui

                  # ── Save bar ─────────────────────────────────────────────
                  - obj:
                      width: 868
                      height: 48
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollbar_mode: "off"
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: END
                        flex_align_cross: CENTER
                      widgets:
                        - button:
                            id: btn_preset_edit_save
                            width: 160
                            height: 48
                            bg_color: 0x1A3A1A
                            border_color: 0x39FF14
                            border_width: 2
                            radius: 6
                            hidden: true
                            on_click:
                              - lambda: |-
                                  id(scr_save_preset).execute();
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Save preset"
                                  text_color: 0x39FF14
                                  text_font: montserrat_16

                  # ── Delete confirmation (covers entire dialog) ───────────
                  # LV_OBJ_FLAG_FLOATING removes it from FLEX flow so it overlays at x/y=0
                  - obj:
                      id: overlay_preset_delete_confirm
                      x: 0
                      y: 0
                      width: 900
                      height: 540
                      bg_color: 0x111122
                      bg_opa: 92%
                      border_width: 0
                      radius: 10
                      scrollbar_mode: "off"
                      scrollable: false
                      hidden: true
                      floating: true
                      widgets:
                        - label:
                            align: CENTER
                            y: -40
                            text: "Delete this preset?"
                            text_color: 0xFFFFFF
                            text_font: montserrat_20
                        - obj:
                            align: CENTER
                            y: 30
                            width: 320
                            height: 52
                            bg_opa: TRANSP
                            border_width: 0
                            scrollbar_mode: "off"
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_main: SPACE_BETWEEN
                              flex_align_cross: CENTER
                            widgets:
                              - button:
                                  id: btn_delete_confirm_cancel
                                  width: 140
                                  height: 52
                                  bg_color: 0x2A2A3A
                                  border_color: 0x444466
                                  border_width: 1
                                  radius: 6
                                  on_click:
                                    - lambda: |-
                                        lv_lock();
                                        lv_obj_add_flag(id(overlay_preset_delete_confirm), LV_OBJ_FLAG_HIDDEN);
                                        lv_unlock();
                                  widgets:
                                    - label:
                                        align: CENTER
                                        text: "Cancel"
                                        text_color: 0xCCCCCC
                                        text_font: montserrat_16
                              - button:
                                  id: btn_delete_confirm_ok
                                  width: 140
                                  height: 52
                                  bg_color: 0x3A1A1A
                                  border_color: 0xFF4444
                                  border_width: 2
                                  radius: 6
                                  on_click:
                                    - lambda: |-
                                        lv_lock();
                                        lv_obj_add_flag(id(overlay_preset_delete_confirm), LV_OBJ_FLAG_HIDDEN);
                                        id(scr_delete_preset).execute();
                                        lv_unlock();
                                  widgets:
                                    - label:
                                        align: CENTER
                                        text: "Delete"
                                        text_color: 0xFF4444
                                        text_font: montserrat_16

      # ── THEME EDITOR OVERLAY ─────────────────────────────────────────
      # Layout (900×540, pad_all=16 → inner 868×508, pad_row=10):
      #   Title+close        36px
      #   Scheme selector    44px
      #   Slot selector row  52px  (6 swatch buttons, tap to pick color slot)
      #   Slot info row      40px  (name + description + current color preview)
      #   Colorwheel        280px
      #   Save bar           44px
      #   total             506px  ✓
      - obj:
          id: overlay_theme_editor
          x: 0
          y: 0
          width: 1024
          height: 600
          bg_color: 0x000000
          bg_opa: 86%
          border_width: 0
          radius: 0
          scrollbar_mode: "off"
          scrollable: false
          hidden: true

          widgets:
            - obj:
                x: 62
                y: 30
                width: 900
                height: 540
                bg_color: 0x1A1A2A
                border_color: 0x39FF14
                border_width: 2
                radius: 10
                pad_all: 16
                scrollbar_mode: "off"
                scrollable: false
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: START
                  flex_align_cross: CENTER
                  pad_row: 10

                widgets:
                  # ── Title + close ──────────────────────────────────────────
                  - obj:
                      width: 868
                      height: 36
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollbar_mode: "off"
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text: "THEME EDITOR"
                            text_color: 0x39FF14
                            text_font: montserrat_16
                        - button:
                            width: 80
                            height: 30
                            bg_color: 0x333344
                            border_width: 0
                            radius: 4
                            on_click:
                              - lambda: |-
                                  // Revert to pre-open snapshot
                                  id(g_theme_scheme)  = id(g_snap_scheme);
                                  id(theme_accent)    = id(g_snap_accent);
                                  id(theme_voltage)   = id(g_snap_voltage);
                                  id(theme_current)   = id(g_snap_current);
                                  id(theme_bg_main)   = id(g_snap_bg_main);
                                  id(theme_bg_panel)  = id(g_snap_bg_panel);
                                  id(theme_text_dim)  = id(g_snap_text_dim);
                                  lv_lock();
                                  lv_obj_add_flag(id(overlay_theme_editor), LV_OBJ_FLAG_HIDDEN);
                                  lv_unlock();
                              - script.execute: scr_theme_apply_full
                            widgets:
                              - label:
                                  align: CENTER
                                  text: "Close"
                                  text_color: 0xCCCCCC
                                  text_font: montserrat_14

                  # ── Scheme selector: ◄ Neon ► ─────────────────────────────
