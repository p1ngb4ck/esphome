# OpenDPS Full Example Configuration
# This example shows all available features and options

esphome:
  name: opendps-controller
  platform: ESP32
  board: esp32dev
  min_version: 2026.1.0-dev
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_upload.maximum_ram_size: 524288
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            App.set_loop_interval(0);
    - priority: 100
      then:
        - lambda: |-
            auto call = id(opendps_fw_path_input).make_call();
            call.set_value(id(opendps_firmware_path));
            call.perform();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  cpu_frequency: 240MHZ
  framework:
    type: esp-idf
    version: recommended
    advanced:
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false
      enable_idf_experimental_features: True
    sdkconfig_options:
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_COMPILER_OPTIMIZATION_PERF: y
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU1: y
      CONFIG_SDMMC_HOST_DEFAULT: "y"
      CONFIG_USB_TRANSFER_FLAG_ZERO_PACK: "y"
      CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE: "1024"
      CONFIG_USB_HOST_HW_BUFFER_BIAS_BALANCED: "y"
      CONFIG_USB_HOST_HW_BUFFER_BIAS_IN: "n"
      CONFIG_USB_HOST_HW_BUFFER_BIAS_PERIODIC_OUT: "n"
      CONFIG_COMPILER_CXX_EXCEPTIONS: "n"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_FATFS_LFN_STACK: "y"
      CONFIG_LWIP_SO_RCVBUF: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_ESP_WIFI_REMOTE_LIBRARY_HOSTED: "y"
      CONFIG_IDF_TARGET: "esp32s3"
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_PARTITION_TABLE_CUSTOM: "y"
      CONFIG_HTTPD_MAX_REQ_HDR_LEN: "800"
      CONFIG_HTTPD_WS_SUPPORT: "y"
      CONFIG_ESP_WIFI_EXTRA_IRAM_OPT=: "n"
      CONFIG_ESP_WIFI_SLP_IRAM_OPT: "n"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_USB_TASK_STACK_SIZE: "16384"
      CONFIG_USB_HOST_DWC_DMA_CAP_MEMORY_IN_PSRAM: "y"
      CONFIG_SLAVE_IDF_TARGET_ESP32C6: "y"
      CONFIG_SDMMC_FREQ_HIGHSPEED: "y"

external_components:
  - source: github://p1ngb4ck/esphome@dev
    components: [http_file_browser, opendps, storage, sd_storage, webdav_server]
    refresh: 0s

# Enable logging
logger:
  level: INFO

# WiFi Configuration
wifi:
  ssid: "your-ssid"
  password: "your-password"

  # Optional: Use static IP for faster connection
  manual_ip:
    static_ip: 192.168.1.100
    gateway: 192.168.1.1
    subnet: 255.255.255.0

# Enable Home Assistant API
api:
  encryption:
    key: "your-encryption-key"

# Enable OTA updates
ota:
  password: "your-ota-password"

# Global variables
globals:
  - id: opendps_firmware_path
    type: std::string
    initial_value: '"/sdcard/opendps_DPS5005.bin"'

# UART for OpenDPS communication
uart:
  id: opendps_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200

time:
  - platform: host
    id: host_time
    timezone: Europe/Berlin
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    update_interval: 3h
  - platform: homeassistant
    id: homeassistant_time
    update_interval: 3h

# Storage config for sd card as example - for use with datalogger and firmware upgrades
storage:
  - id: storage_id

sd_storage:
  spi_id: spi_bus_1
  id: sd_storage_id
  type: sd_spi
  cs_pin: GPIO48
  path: "/sdcard"
  slot: 0

webdav_server:
  id: webdav_sdcard
  storage_id: storage_id
  root_path: "/"
  url_prefix: "/"
  port: 81
  username: !secret web_access_username
  password: !secret web_access_password

http_file_browser:
  storage_id: storage_id
  url_prefix: "/files"
  root_path: "/"
  auth_enabled: true
  username: !secret web_access_username
  password: !secret web_access_password
  enable_upload: true
  enable_download: true
  enable_deletion: true

web_server:
  id: webserver_id
  version: 3
  sorting_groups:
    - id: opendps_sensors
      name: "OpenDPS sensors"
      sorting_weight: 10
    - id: opendps_control
      name: "OpenDPS control"
      sorting_weight: 20
    - id: esphome_device_control
      name: "ESPHome device controls"
      sorting_weight: 30

# OpenDPS Component
opendps:
  id: my_opendps
  uart_id: opendps_uart
  update_interval: 50ms
  default_brightness: 80
  bootloader_baud_rate: 19200
  tcp_bridge:
    port: 5005
  on_connect:
    - lambda: |-
        id(voltage_number).publish_state(id(my_opendps).get_voltage_setting());
        id(current_number).publish_state(id(my_opendps).get_current_setting());
    - light.turn_on:
        id: display_backlight
        brightness: !lambda |-
          return (float)id(my_opendps).get_brightness_setting();

  datalogger:
    storage_path: "/sdcard/logs"
    filename_format: "dps_%Y%m%d_%H%M%S.csv"
    buffer_size: 524288
    format: csv
    time_id: host_time
    columns:
      - system_time
      - elapsed_ms
      - voltage_in
      - voltage_out
      - current_out
      - power_out
      - output_enabled
    flush_interval: 10s

# Sensors
sensor:
  - platform: opendps
    opendps_id: my_opendps
    voltage_in:
      name: "OpenDPS Input Voltage"
      id: opendps_vin
      filters:
        - throttle: 1s  # Throttle to Home Assistant
    voltage_out:
      name: "OpenDPS Output Voltage"
      id: opendps_vout
      filters:
        - throttle: 100ms
    current_out:
      name: "OpenDPS Output Current"
      id: opendps_iout
      filters:
        - throttle: 100ms
    power_out:
      name: "OpenDPS Output Power"
      id: opendps_pout
      filters:
        - throttle: 100ms
    temperature_1:
      name: "OpenDPS Heatsink Temperature"
      id: opendps_temp1
    temperature_2:
      name: "OpenDPS Ambient Temperature"
      id: opendps_temp2

text:
  - platform: template
    mode: TEXT
    name: "OpenDPS firmware path"
    id: opendps_fw_path_input
    optimistic: true
    on_value:
      - lambda: |-
          id(opendps_firmware_path) = x;

# Binary Sensor
binary_sensor:
  - platform: opendps
    opendps_id: my_opendps
    output_enabled:
      name: "OpenDPS Output State"
      id: opendps_output_state

# Numbers (for setting voltage and current)
number:
  - platform: template
    name: "OpenDPS Set Voltage"
    id: opendps_set_voltage
    min_value: 0
    max_value: 30
    step: 0.1
    unit_of_measurement: "V"
    mode: box
    optimistic: true
    set_action:
      - opendps.set_voltage:
          id: my_opendps
          voltage: !lambda "return x;"

  - platform: template
    name: "OpenDPS Set Current Limit"
    id: opendps_set_current
    min_value: 0
    max_value: 5
    step: 0.01
    unit_of_measurement: "A"
    mode: box
    optimistic: true
    set_action:
      - opendps.set_current:
          id: my_opendps
          current: !lambda "return x;"

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display backlight brightness"
    output: brightness_output
    restore_mode: ALWAYS_ON
    gamma_correct: 1.0
    default_transition_length: 0s
    icon: mdi:television-ambient-light

output:
  - platform: template
    type: float
    id: brightness_output
    write_action:
      - lambda: |-
          id(my_opendps).set_brightness(static_cast<uint8_t>(state*100));

# Select (for operating mode)
select:
  - platform: template
    name: "OpenDPS Operating Mode"
    id: opendps_mode
    options:
      - "cv"  # Constant Voltage
      - "cc"  # Constant Current
      - "cp"  # Constant Power
    optimistic: true
    set_action:
      - opendps.set_function:
          id: my_opendps
          function: !lambda "return x.c_str();"

spi:
  - id: spi_bus_1
    interface: spi3
    mosi_pin: GPIO41
    miso_pin: GPIO40
    clk_pin: GPIO39

# Switches
switch:
  - platform: template
    name: "OpenDPS Output Enable"
    id: opendps_output_switch
    optimistic: true
    turn_on_action:
      - opendps.enable_output:
          id: my_opendps
          enable: true
    turn_off_action:
      - opendps.enable_output:
          id: my_opendps
          enable: false

  - platform: template
    name: "OpenDPS Lock"
    id: opendps_lock_switch
    optimistic: true
    turn_on_action:
      - opendps.lock:
          id: my_opendps
          locked: true
    turn_off_action:
      - opendps.lock:
          id: my_opendps
          locked: false

# Buttons
button:
  - platform: template
    name: "OpenDPS Ping"
    on_press:
      - opendps.ping:
          id: my_opendps

  - platform: template
    name: "OpenDPS Request Version"
    on_press:
      - opendps.request_version:
          id: my_opendps

  - platform: template
    name: "OpenDPS Upgrade Firmware"
    on_press:
      - lambda: |-
          // Use runtime path from global variable
          std::string fw_path = id(opendps_firmware_path);
          ESP_LOGI("opendps", "Starting upgrade from: %s", fw_path.c_str());
          id(my_opendps).start_firmware_upgrade(fw_path);

  - platform: template
    name: "Auto-find and Upgrade"
    on_press:
      - lambda: |-
          // Search for firmware in common locations
          std::vector<std::string> paths = {
            "/usb/opendps-latest.bin",
            "/flash/opendps-latest.bin",
            "/littlefs/opendps.bin",
            "/nfs/firmware/opendps-latest.bin",
            "/sd/opendps.bin"
          };
          for (const auto& path : paths) {
            if (storage::global_storage->file_exists(path)) {
              ESP_LOGI("opendps", "Found firmware: %s", path.c_str());
              id(my_opendps).start_firmware_upgrade(path);
              return;
            }
          }
          ESP_LOGE("opendps", "No firmware found");

# Preset configurations
  - platform: template
    name: "Preset: 12V 1A"
    on_press:
      - opendps.set_function:
          id: my_opendps
          function: "cv"
      - opendps.set_voltage:
          id: my_opendps
          voltage: 12.0
      - opendps.set_current:
          id: my_opendps
          current: 1.0
      - opendps.enable_output:
          id: my_opendps
          enable: true

  - platform: template
    name: "Preset: 5V 2A"
    on_press:
      - opendps.set_function:
          id: my_opendps
          function: "cv"
      - opendps.set_voltage:
          id: my_opendps
          voltage: 5.0
      - opendps.set_current:
          id: my_opendps
          current: 2.0
      - opendps.enable_output:
          id: my_opendps
          enable: true

  - platform: template
    name: "Preset: Battery Charge 4.2V 0.5A"
    on_press:
      - opendps.set_function:
          id: my_opendps
          function: "cv"
      - opendps.set_voltage:
          id: my_opendps
          voltage: 4.2
      - opendps.set_current:
          id: my_opendps
          current: 0.5
      - opendps.enable_output:
          id: my_opendps
          enable: true

# Automations
# Example: Auto-shutdown on over-temperature
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(opendps_temp1).state > 60.0) {
            ESP_LOGW("opendps", "Over-temperature detected! Disabling output.");
            id(my_opendps).enable_output(false);
          }

# Example: Log current measurement for debugging
  - interval: 100ms
    then:
      - lambda: |-
          ESP_LOGD("opendps_debug", "Current: %.3fA", id(opendps_iout).state);
