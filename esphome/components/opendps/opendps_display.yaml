font:
  - file: "gfonts://Montserrat"
    id: montserrat_12
    size: 12
  - file: "gfonts://Montserrat"
    id: montserrat_14
    size: 14
  - file: "gfonts://Montserrat"
    id: montserrat_16
    size: 16
  - file: "gfonts://Montserrat"
    id: montserrat_18
    size: 18
  - file: "gfonts://Montserrat"
    id: montserrat_20
    size: 20
  - file: "gfonts://Montserrat"
    id: montserrat_28
    size: 28
  - file: "gfonts://Montserrat"
    id: montserrat_36
    size: 36
  - file: "gfonts://Montserrat"
    id: montserrat_48
    size: 48
  - file: "gfonts://Montserrat"
    id: montserrat_72
    size: 72

globals:
  - id: g_vset
    type: float
    initial_value: "0.0"
  - id: g_iset
    type: float
    initial_value: "0.0"

sensor:
  - platform: opendps
    opendps_id: opendps_id
    voltage_out:
      id: opendps_output_voltage
      on_value:
        - lvgl.label.update:
            id: lbl_vout
            text: {format: "%.2f", args: [x]}
        - lvgl.label.update:
            id: lbl_vout_g
            text: {format: "Vout  %.2fV", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_v
            series_id: ser_v
            value: !lambda 'return (int)(x * 100);'
    current_out:
      id: opendps_ouput_current
      on_value:
        - lvgl.label.update:
            id: lbl_iout
            text: {format: "%.3f", args: [x]}
        - lvgl.label.update:
            id: lbl_iout_g
            text: {format: "Iout  %.3fA", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_i
            series_id: ser_i
            value: !lambda 'return (int)(x * 1000);'
    power_out:
      id: opendps_output_power
      on_value:
        - lvgl.label.update:
            id: lbl_pout
            text: {format: "%.2f", args: [x]}
        - lvgl.label.update:
            id: lbl_pout_g
            text: {format: "Pout  %.2fW", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_p
            series_id: ser_p
            value: !lambda 'return (int)(x * 100);'
    voltage_in:
      id: opendps_input_voltage
      on_value:
        - lvgl.label.update:
            id: lbl_vin
            text: {format: "%.1fV", args: [x]}
    temperature_1:
      id: opendps_temp1
      on_value:
        - lvgl.bar.update:
            id: bar_t1
            value: !lambda 'return (int)x;'
        - lvgl.label.update:
            id: lbl_t1
            text: {format: "%.0f°C", args: [x]}
    temperature_2:
      id: opendps_temp2
      on_value:
        - lvgl.bar.update:
            id: bar_t2
            value: !lambda 'return (int)x;'
        - lvgl.label.update:
            id: lbl_t2
            text: {format: "%.0f°C", args: [x]}

number:
  - platform: template
    id: voltage_number
    name: "Set Voltage"
    icon: mdi:flash-triangle
    min_value: 0
    max_value: 50
    step: 0.1
    unit_of_measurement: "V"
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          id(opendps_id).set_voltage(x);
    on_value:
      - globals.set:
          id: g_vset
          value: !lambda 'return x;'
      - lvgl.slider.update:
          id: sl_v
          value: !lambda 'return (int)(x * 10);'
      - lvgl.label.update:
          id: lbl_setv
          text: {format: "%.2f", args: [x]}
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 50
  - platform: template
    id: current_number
    name: "Set Current Limit"
    icon: mdi:current-dc
    min_value: 0
    max_value: 5
    step: 0.01
    unit_of_measurement: "A"
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          id(opendps_id).set_current(x);
    on_value:
      - globals.set:
          id: g_iset
          value: !lambda 'return x;'
      - lvgl.slider.update:
          id: sl_i
          value: !lambda 'return (int)(x * 100);'
      - lvgl.label.update:
          id: lbl_seti
          text: {format: "%.3f", args: [x]}
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 60

binary_sensor:
  - platform: opendps
    opendps_id: opendps_id
    output_enabled:
      id: dps_output_sensor_id
      name: "OpenDPS Output Enabled"
      icon: mdi:meter-electric-outline
      on_press:
        - lvgl.widget.update:
            id: pwr_ring
            border_color: 0x39FF14
            shadow_color: 0x39FF14
            shadow_width: 16
        - lvgl.label.update:
            id: lbl_pwr
            text: "OUTPUT\nON"
            text_color: 0x39FF14
      on_release:
        - lvgl.widget.update:
            id: pwr_ring
            border_color: 0x555555
            shadow_color: 0x000000
            shadow_width: 0
        - lvgl.label.update:
            id: lbl_pwr
            text: "OUTPUT\nOFF"
            text_color: 0x555555
      web_server:
        sorting_group_id: opendps_sensors
        sorting_weight: 10

select:
  - platform: template
    id: opendps_select_mode
    name: "Select output mode"
    icon: mdi:cog-outline
    options:
      - "cv"
      - "cc"
      - "cp"
    set_action:
      - lambda: |-
          id(opendps_id).set_function(x.c_str());
    on_value:
      - lvgl.widget.update:
          id: led_cv
          bg_color: !lambda 'return (x == "cv") ? lv_color_hex(0x39FF14) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cv") ? lv_color_hex(0x39FF14) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cv") ? 10 : 0;'
      - lvgl.widget.update:
          id: led_cc
          bg_color: !lambda 'return (x == "cc") ? lv_color_hex(0xFFBF00) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cc") ? lv_color_hex(0xFFBF00) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cc") ? 10 : 0;'
      - lvgl.widget.update:
          id: led_cp
          bg_color: !lambda 'return (x == "cp") ? lv_color_hex(0xFF3333) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cp") ? lv_color_hex(0xFF3333) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cp") ? 10 : 0;'
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 40

switch:
  - platform: template
    name: "OpenDPS Output"
    id: dps_output_switch
    icon: "mdi:power"
    lambda: |-
      return id(dps_output_sensor_id).state;
    turn_on_action:
      - opendps.enable_output:
          id: opendps_id
          enable: true
    turn_off_action:
      - opendps.enable_output:
          id: opendps_id
          enable: false
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 30
  - platform: template
    name: "Lock OpenDPS"
    id: dps_lock_switch
    icon: "mdi:lock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - opendps.lock:
          id: opendps_id
          locked: true
    turn_off_action:
      - opendps.lock:
          id: opendps_id
          locked: false
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 20

lvgl:
  displays: dsi_display
  touchscreens: touchscreen_id
  byte_order: little_endian
  default_font: montserrat_16

  # =========================================================
  # TOP LAYER — always visible, covers header (y=0) and footer (y=760)
  # Uses no layout so children can be absolutely positioned
  # =========================================================
  top_layer:
    width: 1280
    height: 800
    bg_opa: TRANSP
    border_width: 0
    radius: 0
    scrollbar_mode: "off"

    widgets:
      # --- Header bar (y=0, h=40) ---
      - obj:
          x: 0
          y: 0
          width: 1280
          height: 40
          bg_color: 0x141414
          border_width: 0
          radius: 0
          pad_left: 20
          pad_right: 20
          pad_top: 0
          pad_bottom: 0
          scrollbar_mode: "off"
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_BETWEEN
            flex_align_cross: CENTER
          widgets:
            - label:
                text: "DPS5005"
                text_color: 0xAAAAAA
                text_font: montserrat_16
            - obj:
                bg_opa: TRANSP
                border_width: 0
                height: size_content
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  pad_column: 8
                widgets:
                  - label:
                      id: lbl_t1
                      text: "--°C"
                      text_color: 0x39FF14
                      text_font: montserrat_14
                  - label:
                      text: "|"
                      text_color: 0x333333
                      text_font: montserrat_14
                  - label:
                      id: lbl_t2
                      text: "--°C"
                      text_color: 0x00AACC
                      text_font: montserrat_14
            - obj:
                bg_opa: TRANSP
                border_width: 0
                height: size_content
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  pad_column: 4
                widgets:
                  - label:
                      text: "IN"
                      text_color: 0x555555
                      text_font: montserrat_12
                  - label:
                      id: lbl_vin
                      text: "--.-V"
                      text_color: 0x888888
                      text_font: montserrat_14

      # --- Footer tab bar (y=760, h=40) ---
      - obj:
          x: 0
          y: 760
          width: 1280
          height: 40
          bg_color: 0x0D0D0D
          border_width: 0
          radius: 0
          scrollbar_mode: "off"
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: CENTER
            flex_align_cross: CENTER
            pad_column: 0
          widgets:
            - button:
                id: tab_btn_main
                width: 426
                height: 40
                bg_color: 0x1A1A1A
                border_width: 2
                border_side: BOTTOM
                border_color: 0x39FF14
                radius: 0
                on_click:
                  - lvgl.page.show: page_main
                widgets:
                  - label:
                      id: tab_lbl_main
                      align: CENTER
                      text: "MAIN"
                      text_color: 0x39FF14
                      text_font: montserrat_16
            - button:
                id: tab_btn_graphs
                width: 426
                height: 40
                bg_color: 0x111111
                border_width: 0
                radius: 0
                on_click:
                  - lvgl.page.show: page_graphs
                widgets:
                  - label:
                      id: tab_lbl_graphs
                      align: CENTER
                      text: "GRAPHS"
                      text_color: 0x555555
                      text_font: montserrat_16
            - button:
                id: tab_btn_settings
                width: 428
                height: 40
                bg_color: 0x111111
                border_width: 0
                radius: 0
                on_click:
                  - lvgl.page.show: page_settings
                widgets:
                  - label:
                      id: tab_lbl_settings
                      align: CENTER
                      text: "SETTINGS"
                      text_color: 0x555555
                      text_font: montserrat_16

  pages:
    # =========================================================
    # PAGE: MAIN  (content area y=40..760, 720px tall)
    # top_layer covers header y=0..40 and footer y=760..800
    # All positions absolute, all sizes fixed.
    # =========================================================
    - id: page_main
      bg_color: 0x1E1E1E
      scrollbar_mode: "off"

      widgets:
        # LCD panel: x=40, y=48, w=1200, h=244
        - obj:
            id: lcd_panel
            x: 40
            y: 48
            width: 1200
            height: 244
            bg_color: 0x0C1A0C
            border_color: 0x004408
            border_width: 2
            radius: 8
            shadow_color: 0x39FF14
            shadow_width: 10
            shadow_opa: 25%
            pad_left: 16
            pad_right: 16
            pad_top: 12
            pad_bottom: 8
            scrollbar_mode: "off"
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: SPACE_EVENLY
              flex_align_cross: STRETCH
              pad_row: 0

            widgets:
              # Top row: Vout + Iout — w=1168, h=140
              - obj:
                  width: 1168
                  height: 140
                  bg_opa: TRANSP
                  border_width: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: CENTER

                  widgets:
                    # Voltage display — w=564, h=130
                    - obj:
                        width: 564
                        height: 130
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: 2
                        widgets:
                          - label:
                              text: "VOLTAGE"
                              text_color: 0x39FF14
                              text_font: montserrat_14
                          - obj:
                              width: 564
                              height: 100
                              bg_opa: TRANSP
                              border_width: 0
                              scrollbar_mode: "off"
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_cross: END
                                flex_align_main: CENTER
                                pad_column: 4
                              widgets:
                                - label:
                                    id: lbl_vout
                                    text: "--.-"
                                    text_color: 0x39FF14
                                    text_font: montserrat_72
                                - label:
                                    text: "V"
                                    text_color: 0x1A8020
                                    text_font: montserrat_28
                                    y: -8

                    # Current display — w=564, h=130
                    - obj:
                        width: 564
                        height: 130
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER
                          pad_row: 2
                        widgets:
                          - label:
                              text: "CURRENT"
                              text_color: 0x39FF14
                              text_font: montserrat_14
                          - obj:
                              width: 564
                              height: 100
                              bg_opa: TRANSP
                              border_width: 0
                              scrollbar_mode: "off"
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_cross: END
                                flex_align_main: CENTER
                                pad_column: 4
                              widgets:
                                - label:
                                    id: lbl_iout
                                    text: "-.---"
                                    text_color: 0x39FF14
                                    text_font: montserrat_72
                                - label:
                                    text: "A"
                                    text_color: 0x1A8020
                                    text_font: montserrat_28
                                    y: -8

              # Bottom row: Power / SetV / SetA — w=1168, h=68
              - obj:
                  width: 1168
                  height: 68
                  bg_color: 0x060E06
                  border_color: 0x002208
                  border_width: 1
                  radius: 4
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: CENTER

                  widgets:
                    - obj:
                        width: 360
                        height: 56
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: END
                          pad_column: 6
                        widgets:
                          - label:
                              text: "POWER"
                              text_color: 0x1A6020
                              text_font: montserrat_14
                              y: -4
                          - label:
                              id: lbl_pout
                              text: "--.-"
                              text_color: 0x39FF14
                              text_font: montserrat_36
                          - label:
                              text: "W"
                              text_color: 0x1A6020
                              text_font: montserrat_20
                              y: -4

                    - obj:
                        width: 1
                        height: 36
                        bg_color: 0x003308
                        border_width: 0
                        radius: 0

                    - obj:
                        width: 360
                        height: 56
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: END
                          pad_column: 6
                        widgets:
                          - label:
                              text: "SET V"
                              text_color: 0x1A6020
                              text_font: montserrat_14
                              y: -4
                          - label:
                              id: lbl_setv
                              text: "--.-"
                              text_color: 0x22CC55
                              text_font: montserrat_36
                          - label:
                              text: "V"
                              text_color: 0x1A6020
                              text_font: montserrat_20
                              y: -4

                    - obj:
                        width: 1
                        height: 36
                        bg_color: 0x003308
                        border_width: 0
                        radius: 0

                    - obj:
                        width: 360
                        height: 56
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: END
                          pad_column: 6
                        widgets:
                          - label:
                              text: "SET A"
                              text_color: 0x1A6020
                              text_font: montserrat_14
                              y: -4
                          - label:
                              id: lbl_seti
                              text: "-.--"
                              text_color: 0x22CC55
                              text_font: montserrat_36
                          - label:
                              text: "A"
                              text_color: 0x1A6020
                              text_font: montserrat_20
                              y: -4

        # Mode buttons + output indicator: x=40, y=300, w=1200, h=44
        - obj:
            x: 40
            y: 300
            width: 1200
            height: 44
            bg_color: 0x141414
            border_width: 0
            radius: 4
            scrollbar_mode: "off"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_column: 56

            widgets:
              - button:
                  id: btn_cv
                  width: 96
                  height: 36
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 4
                  pad_all: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_main: CENTER
                    pad_column: 8
                  on_click:
                    - select.set:
                        id: opendps_select_mode
                        option: "cv"
                  widgets:
                    - obj:
                        id: led_cv
                        width: 14
                        height: 14
                        radius: 7
                        bg_color: 0x1A1A1A
                        border_color: 0x39FF14
                        border_width: 1
                        shadow_width: 0
                        clickable: false
                    - label:
                        text: "CV"
                        text_color: 0x39FF14
                        text_font: montserrat_16

              - button:
                  id: btn_cc
                  width: 96
                  height: 36
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 4
                  pad_all: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_main: CENTER
                    pad_column: 8
                  on_click:
                    - select.set:
                        id: opendps_select_mode
                        option: "cc"
                  widgets:
                    - obj:
                        id: led_cc
                        width: 14
                        height: 14
                        radius: 7
                        bg_color: 0x1A1A1A
                        border_color: 0xFFBF00
                        border_width: 1
                        shadow_width: 0
                        clickable: false
                    - label:
                        text: "CC"
                        text_color: 0xFFBF00
                        text_font: montserrat_16

              - button:
                  id: btn_cp
                  width: 96
                  height: 36
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 4
                  pad_all: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_main: CENTER
                    pad_column: 8
                  on_click:
                    - select.set:
                        id: opendps_select_mode
                        option: "cp"
                  widgets:
                    - obj:
                        id: led_cp
                        width: 14
                        height: 14
                        radius: 7
                        bg_color: 0x1A1A1A
                        border_color: 0xFF3333
                        border_width: 1
                        shadow_width: 0
                        clickable: false
                    - label:
                        text: "CP"
                        text_color: 0xFF3333
                        text_font: montserrat_16

              - obj:
                  width: 96
                  height: 36
                  bg_opa: TRANSP
                  border_width: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_main: CENTER
                    pad_column: 8
                  widgets:
                    - obj:
                        id: led_out
                        width: 14
                        height: 14
                        radius: 7
                        bg_color: 0x1A1A1A
                        border_color: 0x555555
                        border_width: 1
                        shadow_width: 0
                    - label:
                        text: "OUT"
                        text_color: 0x888888
                        text_font: montserrat_16

        # Sliders + power button: x=40, y=352, w=1200, h=188
        - obj:
            x: 40
            y: 352
            width: 1200
            height: 188
            bg_color: 0x171717
            border_color: 0x2A2A2A
            border_width: 1
            radius: 6
            pad_left: 24
            pad_right: 24
            pad_top: 12
            pad_bottom: 12
            scrollbar_mode: "off"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER

            widgets:
              # Voltage slider — w=448, h=164
              - obj:
                  width: 448
                  height: 164
                  bg_opa: TRANSP
                  border_width: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: STRETCH
                    flex_align_main: SPACE_EVENLY
                    pad_row: 4

                  widgets:
                    - obj:
                        width: 448
                        height: 20
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text: "VOLTAGE"
                              text_color: 0x888888
                              text_font: montserrat_14
                          - label:
                              text: "0 — 30V"
                              text_color: 0x444444
                              text_font: montserrat_12

                    - slider:
                        id: sl_v
                        width: 448
                        height: 32
