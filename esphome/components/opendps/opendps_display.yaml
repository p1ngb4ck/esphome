globals:
  - id: g_vset
    type: float
    initial_value: "0.0"
  - id: g_iset
    type: float
    initial_value: "0.0"
  - id: g_output_on
    type: bool
    initial_value: "false"
  - id: g_datetime_fmt
    type: int
    initial_value: "2"
  - id: g_vmax
    type: float
    initial_value: "44.3"
  - id: g_ui_active
    type: bool
    initial_value: "false"
  - id: g_slider_updating
    type: bool
    initial_value: "false"
  - id: g_locked
    type: bool
    initial_value: "false"
  - id: g_logging
    type: bool
    initial_value: "false"

sensor:
  - platform: opendps
    opendps_id: opendps_id
    voltage_out:
      id: opendps_output_voltage
      on_value:
        - lambda: |-
            char buf[24];
            snprintf(buf, sizeof(buf), "%.2f", x);
            lv_label_set_text(id(lbl_vout), buf);
            lv_obj_set_style_text_color(id(lbl_vout), id(g_output_on) ? lv_color_hex(0x39FF14) : lv_color_hex(0x2A2A2A), LV_PART_MAIN);
            snprintf(buf, sizeof(buf), "Vout  %.2fV", x);
            lv_label_set_text(id(lbl_vout_g), buf);
        - lvgl.chart.set_next_value:
            id: chart_v
            series_id: ser_v
            value: !lambda 'return (int)(x * 100);'
    current_out:
      id: opendps_ouput_current
      on_value:
        - lambda: |-
            char buf[24];
            snprintf(buf, sizeof(buf), "%.3f", x);
            lv_label_set_text(id(lbl_iout), buf);
            lv_obj_set_style_text_color(id(lbl_iout), id(g_output_on) ? lv_color_hex(0x4499FF) : lv_color_hex(0x2A2A2A), LV_PART_MAIN);
            snprintf(buf, sizeof(buf), "Iout  %.3fA", x);
            lv_label_set_text(id(lbl_iout_g), buf);
        - lvgl.chart.set_next_value:
            id: chart_i
            series_id: ser_i
            value: !lambda 'return (int)(x * 1000);'

    power_out:
      id: opendps_output_power
      on_value:
        - lvgl.label.update:
            id: lbl_pout_g
            text: {format: "Pout  %.2fW", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_p
            series_id: ser_p
            value: !lambda 'return (int)(x * 100);'
    voltage_set:
      id: opendps_voltage_set
      on_value:
        - lambda: |-
            if (!id(g_ui_active))
              id(voltage_number).make_call().set_value(x).perform();
    current_set:
      id: opendps_current_set
      on_value:
        - lambda: |-
            if (!id(g_ui_active))
              id(current_number).make_call().set_value(x).perform();
    voltage_in:
      id: opendps_input_voltage
      on_value:
        - lvgl.label.update:
            id: lbl_vin
            text: {format: "%.2fV", args: [x]}

number:
  - platform: template
    id: voltage_number
    name: "Set Voltage"
    icon: mdi:flash-triangle
    min_value: 0
    max_value: 50
    step: 0.1
    unit_of_measurement: "V"
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          if (id(opendps_id).is_connected())
            id(opendps_id).set_voltage(x);
    on_value:
      - globals.set:
          id: g_vset
          value: !lambda 'return x;'
      - lambda: |-
          id(g_slider_updating) = true;
          lv_slider_set_value(id(sl_v), (int)(x / id(g_vmax) * 10000.0f), LV_ANIM_OFF);
          lv_obj_invalidate(id(sl_v));
          id(g_slider_updating) = false;
      - lambda: |-
          char buf[16];
          snprintf(buf, sizeof(buf), "%.2f", x);
          lv_label_set_text(id(lbl_setv), buf);
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 50
  - platform: template
    id: current_number
    name: "Set Current Limit"
    icon: mdi:current-dc
    min_value: 0
    max_value: 5
    step: 0.01
    unit_of_measurement: "A"
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          if (id(opendps_id).is_connected())
            id(opendps_id).set_current(x);
    on_value:
      - globals.set:
          id: g_iset
          value: !lambda 'return x;'
      - lambda: |-
          lv_slider_set_value(id(sl_i), (int)(x * 100), LV_ANIM_OFF);
          lv_obj_invalidate(id(sl_i));
      - lambda: |-
          char buf[16];
          snprintf(buf, sizeof(buf), "%.3f", x);
          lv_label_set_text(id(lbl_seti), buf);
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 60
  - platform: template
    id: voltage_max_number
    name: "Max Voltage"
    icon: mdi:flash-triangle-outline
    min_value: 10
    max_value: 60
    step: 0.1
    unit_of_measurement: "V"
    mode: box
    optimistic: true
    initial_value: 44.3
    restore_value: true
    on_value:
      - globals.set:
          id: g_vmax
          value: !lambda 'return x;'
      - lambda: |-
          lv_obj_invalidate(id(sl_v));
          char buf[8];
          snprintf(buf, sizeof(buf), "%.1f", x * 0.25f); lv_label_set_text(id(lbl_vtick25), buf);
          snprintf(buf, sizeof(buf), "%.1f", x * 0.50f); lv_label_set_text(id(lbl_vtick50), buf);
          snprintf(buf, sizeof(buf), "%.1f", x * 0.75f); lv_label_set_text(id(lbl_vtick75), buf);
          snprintf(buf, sizeof(buf), "%.1fV", x);         lv_label_set_text(id(lbl_vtick100), buf);
      - lvgl.label.update:
          id: lbl_vrange
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "0 — %.1fV", x);
            return std::string(buf);
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 70

binary_sensor:
  - platform: opendps
    opendps_id: opendps_id
    output_enabled:
      id: dps_output_sensor_id
      name: "OpenDPS Output Enabled"
      icon: mdi:meter-electric-outline
      on_state:
        - globals.set:
            id: g_output_on
            value: !lambda 'return x;'
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.widget.update:
                  id: pwr_ring
                  border_color: 0x39FF14
                  shadow_color: 0x39FF14
                  shadow_width: 16
              - lambda: |-
                  lv_label_set_text(id(lbl_pwr), "ON");
                  lv_obj_set_style_text_color(id(lbl_pwr), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_vout), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_iout), lv_color_hex(0x4499FF), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_setv), lv_color_hex(0x1A4A1A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_seti), lv_color_hex(0x1A1A4A), LV_PART_MAIN);
            else:
              - lvgl.widget.update:
                  id: pwr_ring
                  border_color: 0x555555
                  shadow_color: 0x000000
                  shadow_width: 0
              - lambda: |-
                  lv_label_set_text(id(lbl_pwr), "OFF");
                  lv_obj_set_style_text_color(id(lbl_pwr), lv_color_hex(0x555555), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_vout), lv_color_hex(0x2A2A2A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_iout), lv_color_hex(0x2A2A2A), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_setv), lv_color_hex(0x39FF14), LV_PART_MAIN);
                  lv_obj_set_style_text_color(id(lbl_seti), lv_color_hex(0x4499FF), LV_PART_MAIN);
      web_server:
        sorting_group_id: opendps_sensors
        sorting_weight: 10
    connected:
      id: dps_connected_sensor_id
      name: "OpenDPS Connected"
      icon: mdi:power-plug
      on_state:
        - lambda: |-
            lv_obj_set_style_text_color(id(lbl_icon_dps), x ? lv_color_hex(0x39FF14) : lv_color_hex(0x333333), LV_PART_MAIN);

  - platform: template
    id: bs_ha_connected
    name: "HA⁄MQTT Connected"
    lambda: |-
      bool api_ok = global_api_server != nullptr && global_api_server->is_connected();
      bool mqtt_ok = mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected();
      return api_ok || mqtt_ok;
    on_state:
      - lambda: |-
          lv_obj_set_style_text_color(id(lbl_icon_ha), x ? lv_color_hex(0x44AAFF) : lv_color_hex(0x333333), LV_PART_MAIN);

  - platform: template
    id: bs_sd_mounted
    name: "SD Card Mounted"
    lambda: 'return id(sd_card).is_mounted();'
    on_state:
      - lambda: |-
          lv_obj_set_style_text_color(id(lbl_icon_sd), x ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);

  - platform: template
    id: bs_usb_mounted
    name: "USB Mounted"
    lambda: 'return id(usb_storage_1).is_mounted();'
    on_state:
      - lambda: |-
          lv_obj_set_style_text_color(id(lbl_icon_usb), x ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);

  - platform: template
    id: bs_nfs_mounted
    name: "NFS Mounted"
    lambda: 'return id(nfs_share).is_mounted();'
    on_state:
      - lambda: |-
          lv_obj_set_style_text_color(id(lbl_icon_nfs), x ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);

select:
  - platform: template
    id: opendps_select_mode
    name: "Select output mode"
    icon: mdi:cog-outline
    optimistic: true
    options:
      - "cv"
      - "cc"
      - "cl"
    set_action:
      - lambda: |-
          id(opendps_id).set_function(x.c_str());
    on_value:
      - if:
          condition:
            lambda: 'return i == 0;'
          then:
            - lvgl.widget.update:
                id: btn_cv
                bg_color: 0x1A4A1A
                bg_opa: COVER
                border_color: 0x39FF14
                border_width: 3
            - lvgl.widget.update:
                id: btn_cc
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.widget.update:
                id: btn_cp
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_cv
                text_color: 0x39FF14
            - lvgl.label.update:
                id: lbl_cc
                text_color: 0x444444
            - lvgl.label.update:
                id: lbl_cp
                text_color: 0x444444
      - if:
          condition:
            lambda: 'return i == 1;'
          then:
            - lvgl.widget.update:
                id: btn_cc
                bg_color: 0x3A3A00
                bg_opa: COVER
                border_color: 0xFFBF00
                border_width: 3
            - lvgl.widget.update:
                id: btn_cv
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.widget.update:
                id: btn_cp
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_cc
                text_color: 0xFFBF00
            - lvgl.label.update:
                id: lbl_cv
                text_color: 0x444444
            - lvgl.label.update:
                id: lbl_cp
                text_color: 0x444444
      - if:
          condition:
            lambda: 'return i == 2;'
          then:
            - lvgl.widget.update:
                id: btn_cp
                bg_color: 0x3A0A0A
                bg_opa: COVER
                border_color: 0xFF3333
                border_width: 3
            - lvgl.widget.update:
                id: btn_cv
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.widget.update:
                id: btn_cc
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_cp
                text_color: 0xFF3333
            - lvgl.label.update:
                id: lbl_cv
                text_color: 0x444444
            - lvgl.label.update:
                id: lbl_cc
                text_color: 0x444444
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 40

switch:
  - platform: template
    name: "OpenDPS Output"
    id: dps_output_switch
    icon: "mdi:power"
    lambda: |-
      return id(dps_output_sensor_id).state;
    turn_on_action:
      - opendps.enable_output:
          id: opendps_id
          enable: true
    turn_off_action:
      - opendps.enable_output:
          id: opendps_id
          enable: false
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 30
  - platform: template
    name: "Lock OpenDPS"
    id: dps_lock_switch
    icon: "mdi:lock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - opendps.lock:
          id: opendps_id
          locked: true
    turn_off_action:
      - opendps.lock:
          id: opendps_id
          locked: false
    on_state:
      - globals.set:
          id: g_locked
          value: !lambda 'return x;'
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update:
                id: btn_lock
                bg_color: 0x3A1A00
                bg_opa: COVER
                border_color: 0xFF8800
                border_width: 2
            - lvgl.label.update:
                id: lbl_lock
                text_color: 0xFF8800
          else:
            - lvgl.widget.update:
                id: btn_lock
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_lock
                text_color: 0x444444
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 20
  - platform: template
    name: "Log to SD"
    id: datalogger_switch
    icon: "mdi:content-save"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - opendps.start_datalog:
          id: opendps_id
    turn_off_action:
      - opendps.stop_datalog:
          id: opendps_id
    on_state:
      - globals.set:
          id: g_logging
          value: !lambda 'return x;'
      - if:
          condition:
            lambda: 'return x;'
          then:
            - lvgl.widget.update:
                id: btn_log
                bg_color: 0x00243A
                bg_opa: COVER
                border_color: 0x00AAFF
                border_width: 2
            - lvgl.label.update:
                id: lbl_log
                text_color: 0x00AAFF
          else:
            - lvgl.widget.update:
                id: btn_log
                bg_color: 0x0A0A0A
                bg_opa: COVER
                border_color: 0x1A1A1A
                border_width: 0
            - lvgl.label.update:
                id: lbl_log
                text_color: 0x444444
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 70

interval:
  - interval: 10s
    then:
      - lambda: |-
          bool api_ok = global_api_server != nullptr && global_api_server->is_connected();
          bool mqtt_ok = mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected();
          bool ha_ok = api_ok || mqtt_ok;
          bool sd_ok = id(sd_card).is_mounted();
          bool usb_ok = id(usb_storage_1).is_mounted();
          bool nfs_ok = id(nfs_share).is_mounted();
          bool dps_ok = id(dps_connected_sensor_id).state;
          id(bs_ha_connected).publish_state(ha_ok);
          id(bs_sd_mounted).publish_state(sd_ok);
          id(bs_usb_mounted).publish_state(usb_ok);
          id(bs_nfs_mounted).publish_state(nfs_ok);
          lv_obj_set_style_text_color(id(lbl_icon_dps), dps_ok ? lv_color_hex(0x39FF14) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_icon_ha), ha_ok ? lv_color_hex(0x44AAFF) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_icon_sd), sd_ok ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_icon_usb), usb_ok ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_icon_nfs), nfs_ok ? lv_color_hex(0xFFFF44) : lv_color_hex(0x333333), LV_PART_MAIN);

time:
  - platform: rx8130
    id: rx8130_time
    on_time:
      - seconds: /1
        then:
          - lambda: |-
              auto t = id(rx8130_time).now();
              if (!t.is_valid()) return;
              if (t.second != 0 && lv_label_get_text(id(lbl_status_time))[0] != '-') return;
              char buf[32];
              switch (id(g_datetime_fmt)) {
                case 1: snprintf(buf, sizeof(buf), "%02d:%02d:%02d", t.hour, t.minute, t.second); break;
                case 2: snprintf(buf, sizeof(buf), "%02d.%02d.%04d %02d:%02d", t.day_of_month, t.month, t.year, t.hour, t.minute); break;
                case 3: snprintf(buf, sizeof(buf), "%02d/%02d/%04d %02d:%02d", t.month, t.day_of_month, t.year, t.hour, t.minute); break;
                case 4: snprintf(buf, sizeof(buf), "%04d-%02d-%02d %02d:%02d", t.year, t.month, t.day_of_month, t.hour, t.minute); break;
                default: snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute); break;
              }
              lv_label_set_text(id(lbl_status_time), buf);

lvgl:
  displays: dsi_display
  touchscreens: touchscreen_id
  byte_order: little_endian
  default_font: montserrat_16
  pad_all: 0

  # =========================================================
  # TOP LAYER — always visible, covers header (y=0) and footer (y=560)
  # Uses no layout so children can be absolutely positioned
  # =========================================================
  top_layer:
    width: 1024
    height: 600
    bg_opa: TRANSP
    border_width: 0
    radius: 0
    scrollbar_mode: "off"

    widgets:
      # --- Header bar (y=0, h=80) ---
      - obj:
          x: 0
          y: 0
          width: 1024
          height: 80
          bg_color: 0x141414
          border_width: 0
          radius: 0
          pad_left: 20
          pad_right: 20
          pad_top: 0
          pad_bottom: 0
          scrollbar_mode: "off"
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_BETWEEN
            flex_align_cross: CENTER
          widgets:
            - label:
                id: lbl_status_time
                text: "--.--.---- --:--"
                text_color: 0xAAAAAA
                text_font: montserrat_20
                width: 220
            - obj:
                bg_opa: TRANSP
                border_width: 0
                border_opa: TRANSP
                pad_all: 0
                width: size_content
                height: size_content
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  pad_column: 10
                widgets:
                  - label:
                      id: lbl_icon_sd
                      text: "\U000F0479"
                      text_color: 0x333333
                      text_font: mdi_20
                  - label:
                      id: lbl_icon_usb
                      text: "\U000F0553"
                      text_color: 0x333333
                      text_font: mdi_20
                  - label:
                      id: lbl_icon_nfs
                      text: "\U000F0870"
                      text_color: 0x333333
                      text_font: mdi_20
                  - label:
                      id: lbl_icon_ha
                      text: "\U000F07D0"
                      text_color: 0x333333
                      text_font: mdi_20
                  - label:
                      id: lbl_icon_dps
                      text: "\U000F095C"
                      text_color: 0x333333
                      text_font: mdi_20
                  - label:
                      text: "IN"
                      text_color: 0x555555
                      text_font: montserrat_16
                  - label:
                      id: lbl_vin
                      text: "--.-V"
                      text_color: 0x888888
                      text_font: montserrat_20

