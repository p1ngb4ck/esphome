font:
  - file: "gfonts://Montserrat"
    id: montserrat_12
    size: 12
  - file: "gfonts://Montserrat"
    id: montserrat_14
    size: 14
  - file: "gfonts://Montserrat"
    id: montserrat_16
    size: 16
  - file: "gfonts://Montserrat"
    id: montserrat_18
    size: 18
  - file: "gfonts://Montserrat"
    id: montserrat_20
    size: 20
  - file: "gfonts://Montserrat"
    id: montserrat_28
    size: 28
  - file: "gfonts://Montserrat"
    id: montserrat_36
    size: 36
  - file: "gfonts://Montserrat"
    id: montserrat_48
    size: 48
  - file: "gfonts://Montserrat"
    id: montserrat_72
    size: 72

globals:
  - id: g_vset
    type: float
    initial_value: "0.0"
  - id: g_iset
    type: float
    initial_value: "0.0"
  - id: g_output_on
    type: bool
    initial_value: "false"
  - id: g_datetime_fmt
    type: int
    initial_value: "2"

sensor:
  - platform: opendps
    opendps_id: opendps_id
    voltage_out:
      id: opendps_output_voltage
      on_value:
        - if:
            condition:
              lambda: 'return id(g_output_on);'
            then:
              - lvgl.label.update:
                  id: lbl_vout
                  text: {format: "%.2f", args: [x]}
        - lvgl.label.update:
            id: lbl_vout_g
            text: {format: "Vout  %.2fV", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_v
            series_id: ser_v
            value: !lambda 'return (int)(x * 100);'
    current_out:
      id: opendps_ouput_current
      on_value:
        - if:
            condition:
              lambda: 'return id(g_output_on);'
            then:
              - lvgl.label.update:
                  id: lbl_iout
                  text: {format: "%.3f", args: [x]}
        - lvgl.label.update:
            id: lbl_iout_g
            text: {format: "Iout  %.3fA", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_i
            series_id: ser_i
            value: !lambda 'return (int)(x * 1000);'

    power_out:
      id: opendps_output_power
      on_value:
        - lvgl.label.update:
            id: lbl_pout_g
            text: {format: "Pout  %.2fW", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_p
            series_id: ser_p
            value: !lambda 'return (int)(x * 100);'
    voltage_in:
      id: opendps_input_voltage
      on_value:
        - lvgl.label.update:
            id: lbl_vin
            text: {format: "%.1fV", args: [x]}

number:
  - platform: template
    id: voltage_number
    name: "Set Voltage"
    icon: mdi:flash-triangle
    min_value: 0
    max_value: 50
    step: 0.1
    unit_of_measurement: "V"
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          if (id(opendps_id).is_connected())
            id(opendps_id).set_voltage(x);
    on_value:
      - globals.set:
          id: g_vset
          value: !lambda 'return x;'
      - lvgl.slider.update:
          id: sl_v
          value: !lambda 'return (int)(x * 10);'
      - if:
          condition:
            lambda: 'return !id(g_output_on);'
          then:
            - lvgl.label.update:
                id: lbl_vout
                text: {format: "%.2f", args: [x]}
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 50
  - platform: template
    id: current_number
    name: "Set Current Limit"
    icon: mdi:current-dc
    min_value: 0
    max_value: 5
    step: 0.01
    unit_of_measurement: "A"
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          if (id(opendps_id).is_connected())
            id(opendps_id).set_current(x);
    on_value:
      - globals.set:
          id: g_iset
          value: !lambda 'return x;'
      - lvgl.slider.update:
          id: sl_i
          value: !lambda 'return (int)(x * 100);'
      - if:
          condition:
            lambda: 'return !id(g_output_on);'
          then:
            - lvgl.label.update:
                id: lbl_iout
                text: {format: "%.3f", args: [x]}
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 60

binary_sensor:
  - platform: opendps
    opendps_id: opendps_id
    output_enabled:
      id: dps_output_sensor_id
      name: "OpenDPS Output Enabled"
      icon: mdi:meter-electric-outline
      on_value:
        - globals.set:
            id: g_output_on
            value: !lambda 'return x;'
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.widget.update:
                  id: pwr_ring
                  border_color: 0x39FF14
                  shadow_color: 0x39FF14
                  shadow_width: 16
              - lvgl.label.update:
                  id: lbl_pwr
                  text: "ON"
                  text_color: 0x39FF14
            else:
              - lvgl.widget.update:
                  id: pwr_ring
                  border_color: 0x555555
                  shadow_color: 0x000000
                  shadow_width: 0
              - lvgl.label.update:
                  id: lbl_pwr
                  text: "OFF"
                  text_color: 0x555555
              - lvgl.label.update:
                  id: lbl_vout
                  text: {format: "%.2f", args: [id(g_vset)]}
              - lvgl.label.update:
                  id: lbl_iout
                  text: {format: "%.3f", args: [id(g_iset)]}
      web_server:
        sorting_group_id: opendps_sensors
        sorting_weight: 10

select:
  - platform: template
    id: opendps_select_mode
    name: "Select output mode"
    icon: mdi:cog-outline
    options:
      - "cv"
      - "cc"
      - "cl"
    set_action:
      - lambda: |-
          id(opendps_id).set_function(x.c_str());
    on_value:
      - lvgl.widget.update:
          id: led_cv
          bg_color: !lambda 'return (x == "cv") ? lv_color_hex(0x39FF14) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cv") ? lv_color_hex(0x39FF14) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cv") ? 10 : 0;'
      - lvgl.widget.update:
          id: led_cc
          bg_color: !lambda 'return (x == "cc") ? lv_color_hex(0xFFBF00) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cc") ? lv_color_hex(0xFFBF00) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cc") ? 10 : 0;'
      - lvgl.widget.update:
          id: led_cl
          bg_color: !lambda 'return (x == "cl") ? lv_color_hex(0xFF3333) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cl") ? lv_color_hex(0xFF3333) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cl") ? 10 : 0;'
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 40

switch:
  - platform: template
    name: "OpenDPS Output"
    id: dps_output_switch
    icon: "mdi:power"
    lambda: |-
      return id(dps_output_sensor_id).state;
    turn_on_action:
      - opendps.enable_output:
          id: opendps_id
          enable: true
    turn_off_action:
      - opendps.enable_output:
          id: opendps_id
          enable: false
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 30
  - platform: template
    name: "Lock OpenDPS"
    id: dps_lock_switch
    icon: "mdi:lock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - opendps.lock:
          id: opendps_id
          locked: true
    turn_off_action:
      - opendps.lock:
          id: opendps_id
          locked: false
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 20

lvgl:
  displays: dsi_display
  touchscreens: touchscreen_id
  byte_order: little_endian
  default_font: montserrat_16

  # =========================================================
  # TOP LAYER — always visible, covers header (y=0) and footer (y=560)
  # Uses no layout so children can be absolutely positioned
  # =========================================================
  top_layer:
    width: 1024
    height: 600
    bg_opa: TRANSP
    border_width: 0
    radius: 0
    scrollbar_mode: "off"

    widgets:
      # --- Header bar (y=0, h=40) ---
      - obj:
          x: 0
          y: 0
          width: 1024
          height: 40
          bg_color: 0x141414
          border_width: 0
          radius: 0
          pad_left: 20
          pad_right: 20
          pad_top: 0
          pad_bottom: 0
          scrollbar_mode: "off"
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_BETWEEN
            flex_align_cross: CENTER
          widgets:
            - label:
                id: lbl_status_time
                text: "--:--"
                text_color: 0xAAAAAA
                text_font: montserrat_14
            - obj:
                bg_opa: TRANSP
                border_width: 0
                height: size_content
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  pad_column: 8
                widgets:
                  - label:
                      id: lbl_t1
                      text: "--°C"
                      text_color: 0x39FF14
                      text_font: montserrat_14
                  - label:
                      text: "|"
                      text_color: 0x333333
                      text_font: montserrat_14
                  - label:
                      id: lbl_t2
                      text: "--°C"
                      text_color: 0x00AACC
                      text_font: montserrat_14
            - obj:
                bg_opa: TRANSP
                border_width: 0
                height: size_content
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_cross: CENTER
                  pad_column: 4
                widgets:
                  - label:
                      text: "IN"
                      text_color: 0x555555
                      text_font: montserrat_12
                  - label:
                      id: lbl_vin
                      text: "--.-V"
                      text_color: 0x888888
                      text_font: montserrat_14

      # --- Footer tab bar (y=560, h=40) ---
      - obj:
          x: 0
          y: 560
          width: 1024
          height: 40
          bg_color: 0x0D0D0D
          border_width: 0
          radius: 0
          scrollbar_mode: "off"
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: CENTER
            flex_align_cross: CENTER
            pad_column: 0
          widgets:
            - button:
                id: tab_btn_main
                width: 341
                height: 40
                bg_color: 0x1A1A1A
                border_width: 2
                border_side: BOTTOM
                border_color: 0x39FF14
                radius: 0
                on_click:
                  - lvgl.page.show: page_main
                widgets:
                  - label:
                      id: tab_lbl_main
                      align: CENTER
                      text: "MAIN"
                      text_color: 0x39FF14
                      text_font: montserrat_16
            - button:
                id: tab_btn_graphs
                width: 341
                height: 40
                bg_color: 0x111111
                border_width: 0
                radius: 0
                on_click:
                  - lvgl.page.show: page_graphs
                widgets:
                  - label:
                      id: tab_lbl_graphs
                      align: CENTER
                      text: "GRAPHS"
                      text_color: 0x555555
                      text_font: montserrat_16
            - button:
                id: tab_btn_settings
                width: 342
                height: 40
                bg_color: 0x111111
                border_width: 0
                radius: 0
                on_click:
                  - lvgl.page.show: page_settings
                widgets:
                  - label:
                      id: tab_lbl_settings
                      align: CENTER
                      text: "SETTINGS"
                      text_color: 0x555555
                      text_font: montserrat_16

  pages:
    # =========================================================
    # PAGE: MAIN  (content area y=40..560, 520px tall)
    # top_layer covers header y=0..40 and footer y=560..600
    # All positions absolute, all sizes fixed.
    # =========================================================
    - id: page_main
      bg_color: 0x1E1E1E
      scrollbar_mode: "off"

      widgets:
        # LCD panel: x=32, y=40, w=960, h=160
        - obj:
            id: lcd_panel
            x: 32
            y: 40
            width: 960
            height: 160
            bg_color: 0x0C1A0C
            border_color: 0x004408
            border_width: 2
            radius: 8
            shadow_color: 0x39FF14
            shadow_width: 10
            shadow_opa: 25%
            pad_left: 16
            pad_right: 16
            pad_top: 8
            pad_bottom: 8
            scrollbar_mode: "off"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER

            widgets:
              # Voltage display
              - obj:
                  width: 440
                  height: 140
                  bg_opa: TRANSP
                  border_width: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: END
                    flex_align_main: CENTER
                    pad_column: 4
                  widgets:
                    - label:
                        id: lbl_vout
                        text: !lambda |-
                          char buf[16];
                          snprintf(buf, sizeof(buf), "%.2f", id(g_vset));
                          return std::string(buf);
                        text_color: 0x39FF14
                        text_font: montserrat_72
                    - label:
                        text: "V"
                        text_color: 0x1A8020
                        text_font: montserrat_28
                        y: -10

              # Current display
              - obj:
                  width: 440
                  height: 140
                  bg_opa: TRANSP
                  border_width: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: END
                    flex_align_main: CENTER
                    pad_column: 4
                  widgets:
                    - label:
                        id: lbl_iout
                        text: !lambda |-
                          char buf[16];
                          snprintf(buf, sizeof(buf), "%.3f", id(g_iset));
                          return std::string(buf);
                        text_color: 0x39FF14
                        text_font: montserrat_72
                    - label:
                        text: "A"
                        text_color: 0x1A8020
                        text_font: montserrat_28
                        y: -10

        # Controls row: CV/CC/CP + power ring + lock — x=32, y=208, w=960, h=52
        - obj:
            x: 32
            y: 208
            width: 960
            height: 52
            bg_color: 0x141414
            border_width: 0
            radius: 4
            scrollbar_mode: "off"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER

            widgets:
              - button:
                  id: btn_cv
                  width: 88
                  height: 40
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 4
                  pad_all: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_main: CENTER
                    pad_column: 8
                  on_click:
                    - select.set:
                        id: opendps_select_mode
                        option: "cv"
                  widgets:
                    - obj:
                        id: led_cv
                        width: 14
                        height: 14
                        radius: 7
                        bg_color: 0x1A1A1A
                        border_color: 0x39FF14
                        border_width: 1
                        shadow_width: 0
                        clickable: false
                    - label:
                        text: "CV"
                        text_color: 0x39FF14
                        text_font: montserrat_16

              - button:
                  id: btn_cc
                  width: 88
                  height: 40
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 4
                  pad_all: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_main: CENTER
                    pad_column: 8
                  on_click:
                    - select.set:
                        id: opendps_select_mode
                        option: "cc"
                  widgets:
                    - obj:
                        id: led_cc
                        width: 14
                        height: 14
                        radius: 7
                        bg_color: 0x1A1A1A
                        border_color: 0xFFBF00
                        border_width: 1
                        shadow_width: 0
                        clickable: false
                    - label:
                        text: "CC"
                        text_color: 0xFFBF00
                        text_font: montserrat_16

              - button:
                  id: btn_cp
                  width: 88
                  height: 40
                  bg_opa: TRANSP
                  border_width: 0
                  radius: 4
                  pad_all: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    flex_align_main: CENTER
                    pad_column: 8
                  on_click:
                    - select.set:
                        id: opendps_select_mode
                        option: "cl"
                  widgets:
                    - obj:
                        id: led_cp
                        width: 14
                        height: 14
                        radius: 7
                        bg_color: 0x1A1A1A
                        border_color: 0xFF3333
                        border_width: 1
                        shadow_width: 0
                        clickable: false
                    - label:
                        text: "CP"
                        text_color: 0xFF3333
                        text_font: montserrat_16

              # Power ring button
              - obj:
                  id: pwr_ring
                  width: 44
                  height: 44
                  radius: 22
                  bg_color: 0x222222
                  border_color: 0x555555
                  border_width: 3
                  shadow_color: 0x000000
                  shadow_width: 0
                  scrollbar_mode: "off"
                  on_click:
                    - switch.toggle: dps_output_switch
                  widgets:
                    - label:
                        id: lbl_pwr_icon
                        align: CENTER
                        text: "\u23FB"
                        text_color: 0x555555
                        text_font: montserrat_28

              - label:
                  id: lbl_pwr
                  text: "OFF"
                  text_color: 0x555555
                  text_font: montserrat_16

              # Lock switch
              - switch:
                  id: sw_lock_main
                  on_value:
                    - opendps.lock:
                        id: opendps_id
                        locked: !lambda 'return x;'

        # Sliders: x=32, y=268, w=960, h=140
        - obj:
            x: 32
            y: 268
            width: 960
            height: 140
            bg_color: 0x171717
            border_color: 0x2A2A2A
            border_width: 1
            radius: 6
            pad_left: 20
            pad_right: 20
            pad_top: 10
            pad_bottom: 10
            scrollbar_mode: "off"
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER

            widgets:
              # Voltage slider — w=440, h=120
              - obj:
                  width: 440
                  height: 120
                  bg_opa: TRANSP
                  border_width: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: STRETCH
                    flex_align_main: SPACE_EVENLY
                    pad_row: 4

                  widgets:
                    - obj:
                        width: 440
                        height: 20
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text: "VOLTAGE"
                              text_color: 0x888888
                              text_font: montserrat_14
                          - label:
                              text: "0 — 30V"
                              text_color: 0x444444
                              text_font: montserrat_12

                    - slider:
                        id: sl_v
                        width: 440
                        height: 32
                        min_value: 0
                        max_value: 300
                        value: 0
                        main:
                          bg_color: 0x222222
                          bg_opa: COVER
                          radius: 6
                          border_color: 0x333333
                          border_width: 1
                        indicator:
                          bg_color: 0x39FF14
                          bg_opa: COVER
                          radius: 6
                        knob:
                          bg_color: 0xDDDDDD
                          border_color: 0x888888
                          border_width: 2
                          radius: 4
                          width: 20
                          height: 34
                          pad_top: -4
                          pad_bottom: -4
                        on_value:
                          - lambda: |-
                              id(voltage_number).make_call().set_value(x / 10.0f).perform();

                    - obj:
                        width: 440
                        height: 16
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text: "0"
                              text_color: 0x444444
                              text_font: montserrat_12
                          - label:
                              text: "7.5"
                              text_color: 0x444444
                              text_font: montserrat_12
                          - label:
                              text: "15"
                              text_color: 0x444444
                              text_font: montserrat_12
                          - label:
                              text: "22.5"
                              text_color: 0x444444
                              text_font: montserrat_12
                          - label:
                              text: "30V"
                              text_color: 0x444444
                              text_font: montserrat_12

              # Current slider — w=440, h=120
              - obj:
                  width: 440
                  height: 120
                  bg_opa: TRANSP
                  border_width: 0
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: STRETCH
                    flex_align_main: SPACE_EVENLY
                    pad_row: 4

                  widgets:
                    - obj:
                        width: 440
                        height: 20
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                        widgets:
                          - label:
                              text: "CURRENT"
                              text_color: 0x888888
                              text_font: montserrat_14
                          - label:
                              text: "0 — 5A"
                              text_color: 0x444444
                              text_font: montserrat_12

                    - slider:
                        id: sl_i
                        width: 440
                        height: 32
                        min_value: 0
                        max_value: 500
                        value: 0
                        main:
                          bg_color: 0x222222
                          bg_opa: COVER
                          radius: 6
                          border_color: 0x333333
                          border_width: 1
                        indicator:
                          bg_color: 0x39FF14
                          bg_opa: COVER
                          radius: 6
                        knob:
                          bg_color: 0xDDDDDD
                          border_color: 0x888888
                          border_width: 2
                          radius: 4
                          width: 20
                          height: 34
                          pad_top: -4
                          pad_bottom: -4
                        on_value:
                          - lambda: |-
                              id(current_number).make_call().set_value(x / 100.0f).perform();

                    - obj:
                        width: 440
                        height: 16
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
