                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                        widgets:
                          - label:
                              text: "Brightness"
                              text_color: 0xCCCCCC
                              text_font: montserrat_16
                          - label:
                              id: lbl_bright
                              text: "80%"
                              text_color: 0xFFFF66
                              text_font: montserrat_16
                    - slider:
                        id: sl_bright
                        width: 320
                        height: 24
                        min_value: 5
                        max_value: 100
                        value: 80
                        bg_color: 0x2A2A2A
                        radius: 4
                        indicator:
                          bg_color: 0xFFFF66
                          radius: 4
                        knob:
                          bg_color: 0xFFFFCC
                          radius: 4
                          width: 20
                          height: 28
                          pad_top: -4
                          pad_bottom: -4
                        on_press:
                          - globals.set:
                              id: g_ui_active
                              value: "true"
                        on_release:
                          - globals.set:
                              id: g_ui_active
                              value: "false"
                        on_value:
                          - lambda: |-
                              if (id(opendps_id).is_connected())
                                id(opendps_id).set_brightness(x);
                          - lvgl.label.update:
                              id: lbl_bright
                              text:
                                format: "%d%%"
                                args: [x]

              # Lock keypad toggle
              - obj:
                  width: 348
                  height: 56
                  bg_color: 0x222222
                  border_color: 0x333333
                  border_width: 1
                  radius: 6
                  pad_all: 14
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER

                  widgets:
                    - label:
                        text: "Lock keypad"
                        text_color: 0xCCCCCC
                        text_font: montserrat_16
                    - switch:
                        id: sw_lock_settings
                        on_value:
                          - globals.set:
                              id: g_ui_active
                              value: "true"
                          - lambda: |-
                              if (id(opendps_id).is_connected())
                                id(opendps_id).lock(x);
                          - globals.set:
                              id: g_ui_active
                              value: "false"
