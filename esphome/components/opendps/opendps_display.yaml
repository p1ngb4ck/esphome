                                          flex_align_cross: CENTER
                                        widgets:
                                          - label:
                                              text: "4.2V / 0.5A"
                                              text_color: 0x8888FF
                                              text_font: montserrat_20
                                          - label:
                                              text: "LiPo charge"
                                              text_color: 0x333366
                                              text_font: montserrat_12

                              # 24V / 0.5A
                              - button:
                                  width: 320
                                  height: 90
                                  bg_color: 0x1A0F0F
                                  border_color: 0x3A1A1A
                                  border_width: 1
                                  radius: 6
                                  on_click:
                                    - select.set:
                                        id: opendps_mode
                                        option: "cv"
                                    - number.set:
                                        id: opendps_set_voltage
                                        value: 24.0
                                    - number.set:
                                        id: opendps_set_current
                                        value: 0.5
                                  widgets:
                                    - obj:
                                        align: CENTER
                                        bg_opa: TRANSP
                                        border_width: 0
                                        layout:
                                          type: FLEX
                                          flex_flow: COLUMN
                                          flex_align_cross: CENTER
                                        widgets:
                                          - label:
                                              text: "24V / 0.5A"
                                              text_color: 0xFF6666
                                              text_font: montserrat_20
                                          - label:
                                              text: "Automation"
                                              text_color: 0x663333
                                              text_font: montserrat_12

                  # ── Right: Brightness + misc ────────────────────────────
                  - obj:
                      width: 408
                      height: 712
                      bg_color: 0x1C1C1C
                      border_color: 0x2A2A2A
                      border_width: 1
                      radius: 8
                      pad_all: 20
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_main: START
                        flex_align_cross: STRETCH
                        pad_row: 20

                      widgets:
                        - label:
                            text: "PSU DISPLAY"
                            text_color: 0x39FF14
                            text_font: montserrat_20

                        # Brightness
                        - obj:
                            bg_color: 0x222222
                            border_color: 0x333333
                            border_width: 1
                            radius: 6
                            pad_all: 16
                            height: size_content
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_cross: STRETCH
                              pad_row: 10

                            widgets:
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  height: size_content
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                  widgets:
                                    - label:
                                        text: "Brightness"
                                        text_color: 0xCCCCCC
                                        text_font: montserrat_16
                                    - label:
                                        id: lbl_bright
                                        text: "80%"
                                        text_color: 0xFFFF66
                                        text_font: montserrat_16
                              - slider:
                                  id: sl_bright
                                  height: 24
                                  min_value: 5
                                  max_value: 100
                                  value: 80
                                  main:
                                    bg_color: 0x2A2A2A
                                    radius: 4
                                  indicator:
                                    bg_color: 0xFFFF66
                                    radius: 4
                                  knob:
                                    bg_color: 0xFFFFCC
                                    radius: 4
                                    width: 20
                                    height: 28
                                    pad_top: -4
                                    pad_bottom: -4
                                  on_value:
                                    - opendps.set_brightness:
                                        id: my_opendps
                                        brightness: !lambda 'return x;'
                                    - lvgl.label.update:
                                        id: lbl_bright
                                        text:
                                          format: "%d%%"
                                          args: [x]

                        # Lock switch
                        - obj:
                            bg_color: 0x222222
                            border_color: 0x333333
                            border_width: 1
                            radius: 6
                            pad_all: 16
                            height: size_content
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_main: SPACE_BETWEEN
                              flex_align_cross: CENTER

                            widgets:
                              - label:
                                  text: "Lock keypad"
                                  text_color: 0xCCCCCC
                                  text_font: montserrat_16
                              - switch:
                                  id: sw_lock
                                  on_value:
                                    - if:
                                        condition:
                                          lvgl.is_paused: sw_lock
                                        else:
                                          - lambda: |-
                                              id(my_opendps).lock(x);

            # ── Page nav bar ─────────────────────────────────────────────
            - obj:
                x: 0
                y: 760
                width: 1280
                height: 40
                bg_color: 0x0D0D0D
                border_width: 0
                radius: 0
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: CENTER
                  flex_align_cross: CENTER
                  pad_column: 0
                widgets:
                  - button:
                      width: 426
                      height: 40
                      bg_color: 0x111111
                      border_width: 0
                      radius: 0
                      on_click:
                        - lvgl.page.show: page_main
                      widgets:
                        - label:
                            align: CENTER
                            text: "MAIN"
                            text_color: 0x555555
                            text_font: montserrat_16
                  - button:
                      width: 426
                      height: 40
                      bg_color: 0x111111
                      border_width: 0
                      radius: 0
                      on_click:
                        - lvgl.page.show: page_graphs
                      widgets:
                        - label:
                            align: CENTER
                            text: "GRAPHS"
                            text_color: 0x555555
                            text_font: montserrat_16
                  - button:
                      width: 428
                      height: 40
                      bg_color: 0x1A1A1A
                      border_width: 0
                      border_side: BOTTOM
                      border_color: 0xAAAAAA
                      radius: 0
                      widgets:
                        - label:
                            align: CENTER
                            text: "SETTINGS"
                            text_color: 0xAAAAAA
                            text_font: montserrat_16
