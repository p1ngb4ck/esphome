                                    text_font: montserrat_20
                                - label:
                                    text: "LiPo charge"
                                    text_color: 0x333366
                                    text_font: montserrat_12

                    - button:
                        width: 336
                        height: 88
                        bg_color: 0x1A0F0F
                        border_color: 0x3A1A1A
                        border_width: 1
                        radius: 6
                        on_click:
                          - select.set:
                              id: opendps_select_mode
                              option: "cv"
                          - number.set:
                              id: voltage_number
                              value: 24.0
                          - number.set:
                              id: current_number
                              value: 0.5
                        widgets:
                          - obj:
                              align: CENTER
                              bg_opa: TRANSP
                              border_width: 0
                              width: 310
                              height: 60
                              scrollbar_mode: "off"
                              layout:
                                type: FLEX
                                flex_flow: COLUMN
                                flex_align_cross: CENTER
                              widgets:
                                - label:
                                    text: "24V / 0.5A"
                                    text_color: 0xFF6666
                                    text_font: montserrat_20
                                - label:
                                    text: "Automation"
                                    text_color: 0x663333
                                    text_font: montserrat_12

        # Right column (PSU controls): x=796, y=48, w=464, h=700
        - obj:
            x: 796
            y: 48
            width: 464
            height: 700
            bg_color: 0x1C1C1C
            border_color: 0x2A2A2A
            border_width: 1
            radius: 8
            pad_all: 20
            scrollbar_mode: "off"
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: STRETCH
              pad_row: 20

            widgets:
              - label:
                  text: "PSU DISPLAY"
                  text_color: 0x39FF14
                  text_font: montserrat_20

              # Brightness control box
              - obj:
                  width: 424
                  height: 108
                  bg_color: 0x222222
                  border_color: 0x333333
                  border_width: 1
                  radius: 6
                  pad_all: 16
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_cross: STRETCH
                    pad_row: 10

                  widgets:
                    - obj:
                        width: 392
                        height: 20
                        bg_opa: TRANSP
                        border_width: 0
                        scrollbar_mode: "off"
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                        widgets:
                          - label:
                              text: "Brightness"
                              text_color: 0xCCCCCC
                              text_font: montserrat_16
                          - label:
                              id: lbl_bright
                              text: "80%"
                              text_color: 0xFFFF66
                              text_font: montserrat_16
                    - slider:
                        id: sl_bright
                        width: 392
                        height: 24
                        min_value: 5
                        max_value: 100
                        value: 80
                        main:
                          bg_color: 0x2A2A2A
                          radius: 4
                        indicator:
                          bg_color: 0xFFFF66
                          radius: 4
                        knob:
                          bg_color: 0xFFFFCC
                          radius: 4
                          width: 20
                          height: 28
                          pad_top: -4
                          pad_bottom: -4
                        on_value:
                          - opendps.set_brightness:
                              id: opendps_id
                              brightness: !lambda 'return x;'
                          - lvgl.label.update:
                              id: lbl_bright
                              text:
                                format: "%d%%"
                                args: [x]

              # Lock keypad toggle
              - obj:
                  width: 424
                  height: 64
                  bg_color: 0x222222
                  border_color: 0x333333
                  border_width: 1
                  radius: 6
                  pad_all: 16
                  scrollbar_mode: "off"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER

                  widgets:
                    - label:
                        text: "Lock keypad"
                        text_color: 0xCCCCCC
                        text_font: montserrat_16
                    - switch:
                        id: sw_lock
                        on_value:
                          - opendps.lock:
                              id: opendps_id
                              locked: !lambda 'return x;'
