# ============================================================================
# OpenDPS Lab PSU Display — LVGL 9.5
# Target: ESP32-P4 + 10.1" DSI display (1280×800)
#
# Page 1 — MAIN:      PSU front panel (LCD + sliders + power button + LEDs)
# Page 2 — GRAPHS:    Live V/I/P 60-second history charts
# Page 3 — SETTINGS:  Presets + brightness
#
# Merge the sensor/number/binary_sensor on_value hooks shown in the comments
# below into your existing opendps config.
#
# external_components:
#   - source: github://youkorr/dev-lvgl_9.5
#     components: [lvgl]
# ============================================================================

# ============================================================================
# GLOBALS
# ============================================================================
globals:
  # Shadow the setpoints so we can initialise sliders from opendps on_connect
  - id: g_vset
    type: float
    initial_value: "0.0"
  - id: g_iset
    type: float
    initial_value: "0.0"

# ============================================================================
# SENSOR on_value HOOKS (merge into your sensor: block)
# ============================================================================
# sensor:
#   - platform: opendps
#     opendps_id: my_opendps
#     voltage_out:
#       id: opendps_vout
#       on_value:
#         - lvgl.label.update:
#             id: lbl_vout
#             text: {format: "%.2f", args: [x]}
#         - lvgl.label.update:
#             id: lbl_vout_g
#             text: {format: "Vout  %.2fV", args: [x]}
#         - lvgl.chart.set_next_value:
#             id: chart_v
#             series_id: ser_v
#             value: !lambda 'return (int)(x * 100);'
#
#     current_out:
#       id: opendps_iout
#       on_value:
#         - lvgl.label.update:
#             id: lbl_iout
#             text: {format: "%.3f", args: [x]}
#         - lvgl.label.update:
#             id: lbl_iout_g
#             text: {format: "Iout  %.3fA", args: [x]}
#         - lvgl.chart.set_next_value:
#             id: chart_i
#             series_id: ser_i
#             value: !lambda 'return (int)(x * 1000);'
#
#     power_out:
#       id: opendps_pout
#       on_value:
#         - lvgl.label.update:
#             id: lbl_pout
#             text: {format: "%.2f", args: [x]}
#         - lvgl.label.update:
#             id: lbl_pout_g
#             text: {format: "Pout  %.2fW", args: [x]}
#         - lvgl.chart.set_next_value:
#             id: chart_p
#             series_id: ser_p
#             value: !lambda 'return (int)(x * 100);'
#
#     voltage_in:
#       id: opendps_vin
#       on_value:
#         - lvgl.label.update:
#             id: lbl_vin
#             text: {format: "%.1fV", args: [x]}
#
#     temperature_1:
#       id: opendps_temp1
#       on_value:
#         - lvgl.bar.update:
#             id: bar_t1
#             value: !lambda 'return (int)x;'
#         - lvgl.label.update:
#             id: lbl_t1
#             text: {format: "%.0f°C", args: [x]}
#
#     temperature_2:
#       id: opendps_temp2
#       on_value:
#         - lvgl.bar.update:
#             id: bar_t2
#             value: !lambda 'return (int)x;'
#         - lvgl.label.update:
#             id: lbl_t2
#             text: {format: "%.0f°C", args: [x]}
#
# ============================================================================
# NUMBER on_value HOOKS (merge into your number: block)
# ============================================================================
# number:
#   - platform: template
#     id: opendps_set_voltage
#     on_value:
#       - globals.set:
#           id: g_vset
#           value: !lambda 'return x;'
#       - lvgl.slider.update:
#           id: sl_v
#           value: !lambda 'return (int)(x * 10);'
#       - lvgl.label.update:
#           id: lbl_setv
#           text: {format: "%.2f", args: [x]}
#
#   - platform: template
#     id: opendps_set_current
#     on_value:
#       - globals.set:
#           id: g_iset
#           value: !lambda 'return x;'
#       - lvgl.slider.update:
#           id: sl_i
#           value: !lambda 'return (int)(x * 100);'
#       - lvgl.label.update:
#           id: lbl_seti
#           text: {format: "%.3f", args: [x]}
#
# ============================================================================
# BINARY SENSOR on_state HOOKS (merge into your binary_sensor: block)
# ============================================================================
# binary_sensor:
#   - platform: opendps
#     output_enabled:
#       id: opendps_output_state
#       on_press:
#         - lvgl.widget.update:
#             id: pwr_ring
#             border_color: 0x39FF14
#             shadow_color: 0x39FF14
#             shadow_width: 16
#         - lvgl.label.update:
#             id: lbl_pwr
#             text: "OUTPUT\nON"
#             text_color: 0x39FF14
#       on_release:
#         - lvgl.widget.update:
#             id: pwr_ring
#             border_color: 0x555555
#             shadow_color: 0x000000
#             shadow_width: 0
#         - lvgl.label.update:
#             id: lbl_pwr
#             text: "OUTPUT\nOFF"
#             text_color: 0x555555
#
# ============================================================================
# SELECT on_value HOOKS (merge into your select: block)
# ============================================================================
# select:
#   - platform: template
#     id: opendps_mode
#     on_value:
#       - lvgl.widget.update:
#           id: led_cv
#           bg_color: !lambda 'return (x == "cv") ? 0x39FF14 : 0x1A1A1A;'
#           shadow_color: !lambda 'return (x == "cv") ? 0x39FF14 : 0x000000;'
#           shadow_width: !lambda 'return (x == "cv") ? 10 : 0;'
#       - lvgl.widget.update:
#           id: led_cc
#           bg_color: !lambda 'return (x == "cc") ? 0xFFBF00 : 0x1A1A1A;'
#           shadow_color: !lambda 'return (x == "cc") ? 0xFFBF00 : 0x000000;'
#           shadow_width: !lambda 'return (x == "cc") ? 10 : 0;'
#       - lvgl.widget.update:
#           id: led_cp
#           bg_color: !lambda 'return (x == "cp") ? 0xFF3333 : 0x1A1A1A;'
#           shadow_color: !lambda 'return (x == "cp") ? 0xFF3333 : 0x000000;'
#           shadow_width: !lambda 'return (x == "cp") ? 10 : 0;'

# ============================================================================
# LVGL
# ============================================================================
lvgl:
  displays:
    - display_id: my_display
      default_font: montserrat_16

      pages:
        # ====================================================================
        # PAGE 1 — MAIN   (PSU front panel)
        # ====================================================================
        - id: page_main
          bg_color: 0x1E1E1E   # brushed-metal dark chassis

          widgets:
            # ── Outer chassis frame ─────────────────────────────────────────
            - obj:
                x: 0
                y: 0
                width: 1280
                height: 800
                bg_color: 0x1E1E1E
                border_width: 0
                radius: 0
                pad_all: 0

                widgets:
                  # ── Top panel: model name + input voltage ─────────────────
                  - obj:
                      x: 0
                      y: 0
                      width: 1280
                      height: 48
                      bg_color: 0x141414
                      border_width: 0
                      radius: 0
                      pad_left: 28
                      pad_right: 28
                      pad_top: 0
                      pad_bottom: 0
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text: "DPS5005"
                            text_color: 0xAAAAAA
                            text_font: montserrat_18
                        - obj:
                            bg_opa: TRANSP
                            border_width: 0
                            height: size_content
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_cross: CENTER
                              pad_column: 6
                            widgets:
                              - label:
                                  text: "INPUT"
                                  text_color: 0x555555
                                  text_font: montserrat_14
                              - label:
                                  id: lbl_vin
                                  text: "--.-V"
                                  text_color: 0x888888
                                  text_font: montserrat_16

                  # ── LCD panel ─────────────────────────────────────────────
                  # Main row: big VOLTAGE and CURRENT displays
                  # Secondary row: POWER, SET V, SET A (smaller)
                  - obj:
                      id: lcd_panel
                      x: 40
                      y: 56
                      width: 1200
                      height: 280
                      bg_color: 0x0C1A0C     # dark green LCD background
                      border_color: 0x004408
                      border_width: 2
                      radius: 8
                      shadow_color: 0x39FF14
                      shadow_width: 10
                      shadow_opa: 25%
                      pad_all: 20
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_main: SPACE_EVENLY
                        flex_align_cross: STRETCH
                        pad_row: 8

                      widgets:
                        # ── Main row: VOLTAGE + CURRENT ─────────────────────
                        - obj:
                            bg_opa: TRANSP
                            border_width: 0
                            height: 130
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_main: SPACE_EVENLY
                              flex_align_cross: CENTER

                            widgets:
                              # VOLTAGE group
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  width: 540
                                  height: 120
                                  layout:
                                    type: FLEX
                                    flex_flow: COLUMN
                                    flex_align_cross: CENTER
                                    pad_row: 0

                                  widgets:
                                    - label:
                                        text: "VOLTAGE"
                                        text_color: 0x39FF14
                                        text_font: montserrat_14
                                    - obj:
                                        bg_opa: TRANSP
                                        border_width: 0
                                        height: size_content
                                        layout:
                                          type: FLEX
                                          flex_flow: ROW
                                          flex_align_cross: END
                                          flex_align_main: CENTER
                                          pad_column: 4
                                        widgets:
                                          - label:
                                              id: lbl_vout
                                              text: "--.-"
                                              text_color: 0x39FF14
                                              text_font: montserrat_72
                                          - label:
                                              text: "V"
                                              text_color: 0x1A8020
                                              text_font: montserrat_28
                                              y: -10     # baseline alignment

                              # CURRENT group
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  width: 540
                                  height: 120
                                  layout:
                                    type: FLEX
                                    flex_flow: COLUMN
                                    flex_align_cross: CENTER
                                    pad_row: 0

                                  widgets:
                                    - label:
                                        text: "CURRENT"
                                        text_color: 0x39FF14
                                        text_font: montserrat_14
                                    - obj:
                                        bg_opa: TRANSP
                                        border_width: 0
                                        height: size_content
                                        layout:
                                          type: FLEX
                                          flex_flow: ROW
                                          flex_align_cross: END
                                          flex_align_main: CENTER
                                          pad_column: 4
                                        widgets:
                                          - label:
                                              id: lbl_iout
                                              text: "-.---"
                                              text_color: 0x39FF14
                                              text_font: montserrat_72
                                          - label:
                                              text: "A"
                                              text_color: 0x1A8020
                                              text_font: montserrat_28
                                              y: -10

                        # ── Secondary row: POWER | SET V | SET A ────────────
                        - obj:
                            bg_color: 0x060E06
                            border_color: 0x002208
                            border_width: 1
                            radius: 4
                            height: 72
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_main: SPACE_EVENLY
                              flex_align_cross: CENTER

                            widgets:
                              # POWER
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  width: 360
                                  height: 60
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: CENTER
                                    flex_align_cross: END
                                    pad_column: 6
                                  widgets:
                                    - label:
                                        text: "POWER"
                                        text_color: 0x1A6020
                                        text_font: montserrat_14
                                        y: -4
                                    - label:
                                        id: lbl_pout
                                        text: "--.-"
                                        text_color: 0x39FF14
                                        text_font: montserrat_36
                                    - label:
                                        text: "W"
                                        text_color: 0x1A6020
                                        text_font: montserrat_20
                                        y: -4

                              # divider
                              - obj:
                                  width: 1
                                  height: 40
                                  bg_color: 0x003308
                                  border_width: 0
                                  radius: 0

                              # SET V
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  width: 360
                                  height: 60
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: CENTER
                                    flex_align_cross: END
                                    pad_column: 6
                                  widgets:
                                    - label:
                                        text: "SET V"
                                        text_color: 0x1A6020
                                        text_font: montserrat_14
                                        y: -4
                                    - label:
                                        id: lbl_setv
                                        text: "--.-"
                                        text_color: 0x22CC55
                                        text_font: montserrat_36
                                    - label:
                                        text: "V"
                                        text_color: 0x1A6020
                                        text_font: montserrat_20
                                        y: -4

                              # divider
                              - obj:
                                  width: 1
                                  height: 40
                                  bg_color: 0x003308
                                  border_width: 0
                                  radius: 0

                              # SET A
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  width: 360
                                  height: 60
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: CENTER
                                    flex_align_cross: END
                                    pad_column: 6
                                  widgets:
                                    - label:
                                        text: "SET A"
                                        text_color: 0x1A6020
                                        text_font: montserrat_14
                                        y: -4
                                    - label:
                                        id: lbl_seti
                                        text: "-.--"
                                        text_color: 0x22CC55
                                        text_font: montserrat_36
                                    - label:
                                        text: "A"
                                        text_color: 0x1A6020
                                        text_font: montserrat_20
                                        y: -4

                  # ── Mode LEDs row: CV  CC  CP  OUT ──────────────────────
                  - obj:
                      x: 40
                      y: 348
                      width: 1200
                      height: 48
                      bg_color: 0x141414
                      border_width: 0
                      radius: 4
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: CENTER
                        flex_align_cross: CENTER
                        pad_column: 60

                      widgets:
                        # CV — full button tap area, LED dot is visual-only indicator
                        - button:
                            id: btn_cv
                            height: 40
                            width: 100
                            bg_opa: TRANSP
                            border_width: 0
                            radius: 4
                            pad_all: 4
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_cross: CENTER
                              flex_align_main: CENTER
                              pad_column: 8
                            on_click:
                              - select.set:
                                  id: opendps_mode
                                  option: "cv"
                            widgets:
                              - obj:
                                  id: led_cv
                                  width: 16
                                  height: 16
                                  radius: 8
                                  bg_color: 0x1A1A1A
                                  border_color: 0x39FF14
                                  border_width: 1
                                  shadow_width: 0
                                  clickable: false
                              - label:
                                  text: "CV"
                                  text_color: 0x39FF14
                                  text_font: montserrat_16

                        # CC — full button tap area
                        - button:
                            id: btn_cc
                            height: 40
                            width: 100
                            bg_opa: TRANSP
                            border_width: 0
                            radius: 4
                            pad_all: 4
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_cross: CENTER
                              flex_align_main: CENTER
                              pad_column: 8
                            on_click:
                              - select.set:
                                  id: opendps_mode
                                  option: "cc"
                            widgets:
                              - obj:
                                  id: led_cc
                                  width: 16
                                  height: 16
                                  radius: 8
                                  bg_color: 0x1A1A1A
                                  border_color: 0xFFBF00
                                  border_width: 1
                                  shadow_width: 0
                                  clickable: false
                              - label:
                                  text: "CC"
                                  text_color: 0xFFBF00
                                  text_font: montserrat_16

                        # CP — full button tap area
                        - button:
                            id: btn_cp
                            height: 40
                            width: 100
                            bg_opa: TRANSP
                            border_width: 0
                            radius: 4
                            pad_all: 4
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_cross: CENTER
                              flex_align_main: CENTER
                              pad_column: 8
                            on_click:
                              - select.set:
                                  id: opendps_mode
                                  option: "cp"
                            widgets:
                              - obj:
                                  id: led_cp
                                  width: 16
                                  height: 16
                                  radius: 8
                                  bg_color: 0x1A1A1A
                                  border_color: 0xFF3333
                                  border_width: 1
                                  shadow_width: 0
                                  clickable: false
                              - label:
                                  text: "CP"
                                  text_color: 0xFF3333
                                  text_font: montserrat_16

                        # OUT — read-only, reflects output_enabled state
                        - obj:
                            height: 40
                            width: 100
                            bg_opa: TRANSP
                            border_width: 0
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_cross: CENTER
                              flex_align_main: CENTER
                              pad_column: 8
                            widgets:
                              - obj:
                                  id: led_out
                                  width: 16
                                  height: 16
                                  radius: 8
                                  bg_color: 0x1A1A1A
                                  border_color: 0x555555
                                  border_width: 1
                                  shadow_width: 0
                              - label:
                                  text: "OUT"
                                  text_color: 0x888888
                                  text_font: montserrat_16

                  # ── Controls row: Voltage slider | Power button | Current slider ──
                  - obj:
                      x: 40
                      y: 404
                      width: 1200
                      height: 200
                      bg_color: 0x171717
                      border_color: 0x2A2A2A
                      border_width: 1
                      radius: 6
                      pad_left: 32
                      pad_right: 32
                      pad_top: 16
                      pad_bottom: 16
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER

                      widgets:
                        # ── Voltage slider block ─────────────────────────────
                        - obj:
                            width: 440
                            height: 168
                            bg_opa: TRANSP
                            border_width: 0
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_cross: STRETCH
                              flex_align_main: SPACE_EVENLY
                              pad_row: 8

                            widgets:
                              # label row: "VOLTAGE" .... "SET V"
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  height: size_content
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        text: "VOLTAGE"
                                        text_color: 0x888888
                                        text_font: montserrat_14
                                    - label:
                                        text: "0          15          30V"
                                        text_color: 0x444444
                                        text_font: montserrat_12

                              # The slider
                              - slider:
                                  id: sl_v
                                  height: 32
                                  min_value: 0
                                  max_value: 300        # 0.0–30.0V ×10
                                  value: 0
                                  main:
                                    bg_color: 0x222222
                                    bg_opa: COVER
                                    radius: 6
                                    border_color: 0x333333
                                    border_width: 1
                                  indicator:
                                    bg_color: 0x39FF14
                                    bg_opa: COVER
                                    radius: 6
                                  knob:
                                    bg_color: 0xDDDDDD
                                    border_color: 0x888888
                                    border_width: 2
                                    radius: 4
                                    width: 22
                                    height: 36
                                    pad_top: -4
                                    pad_bottom: -4
                                  on_value:
                                    - lambda: |-
                                        float v = x / 10.0f;
                                        id(opendps_set_voltage).make_call().set_value(v).perform();
                                    - lvgl.label.update:
                                        id: lbl_setv
                                        text:
                                          format: "%.2f"
                                          args: ['x / 10.0f']

                              # scale tick labels under slider
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  height: size_content
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        text: "0.0"
                                        text_color: 0x444444
                                        text_font: montserrat_12
                                    - label:
                                        text: "7.5"
                                        text_color: 0x444444
                                        text_font: montserrat_12
                                    - label:
                                        text: "15.0"
                                        text_color: 0x444444
                                        text_font: montserrat_12
                                    - label:
                                        text: "22.5"
                                        text_color: 0x444444
                                        text_font: montserrat_12
                                    - label:
                                        text: "30V"
                                        text_color: 0x444444
                                        text_font: montserrat_12

                        # ── Power button (centre) ─────────────────────────────
                        - obj:
                            width: 140
                            height: 168
                            bg_opa: TRANSP
                            border_width: 0
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_main: CENTER
                              flex_align_cross: CENTER
                              pad_row: 8

                            widgets:
                              # Ring (updates colour/glow when output on/off)
                              - obj:
                                  id: pwr_ring
                                  width: 100
                                  height: 100
                                  radius: 50
                                  bg_color: 0x222222
                                  border_color: 0x555555
                                  border_width: 4
                                  shadow_color: 0x000000
                                  shadow_width: 0
                                  on_click:
                                    - switch.toggle: opendps_output_switch
                                  widgets:
                                    # Power icon — vertical bar + arc approximated with label
                                    # LVGL has no native SVG path, so we use Unicode power symbol
                                    - label:
                                        align: CENTER
                                        text: "\u23FB"   # ⏻  Unicode POWER SYMBOL
                                        text_color: 0x555555
                                        text_font: montserrat_48
                                        id: lbl_pwr_icon

                              - label:
                                  id: lbl_pwr
                                  text: "OUTPUT\nOFF"
                                  text_color: 0x555555
                                  text_font: montserrat_14
                                  text_align: CENTER

                        # ── Current slider block ──────────────────────────────
                        - obj:
                            width: 440
                            height: 168
                            bg_opa: TRANSP
                            border_width: 0
                            layout:
                              type: FLEX
                              flex_flow: COLUMN
                              flex_align_cross: STRETCH
                              flex_align_main: SPACE_EVENLY
                              pad_row: 8

                            widgets:
                              - obj:
                                  bg_opa: TRANSP
                                  border_width: 0
                                  height: size_content
                                  layout:
                                    type: FLEX
                                    flex_flow: ROW
                                    flex_align_main: SPACE_BETWEEN
                                    flex_align_cross: CENTER
                                  widgets:
                                    - label:
                                        text: "CURRENT"
                                        text_color: 0x888888
                                        text_font: montserrat_14
                                    - label:
                                        text: "0         2.5          5A"
                                        text_color: 0x444444
                                        text_font: montserrat_12

                              - slider:
                                  id: sl_i
                                  height: 32
                                  min_value: 0
