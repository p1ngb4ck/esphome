globals:
  - id: g_vset
    type: float
    initial_value: "0.0"
  - id: g_iset
    type: float
    initial_value: "0.0"

sensor:
  - platform: opendps
    opendps_id: opendps_id
    voltage_out:
      id: opendps_output_voltage
      on_value:
        - lvgl.label.update:
            id: lbl_vout
            text: {format: "%.2f", args: [x]}
        - lvgl.label.update:
            id: lbl_vout_g
            text: {format: "Vout  %.2fV", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_v
            series_id: ser_v
            value: !lambda 'return (int)(x * 100);'
    current_out:
      id: opendps_ouput_current
      on_value:
        - lvgl.label.update:
            id: lbl_iout
            text: {format: "%.3f", args: [x]}
        - lvgl.label.update:
            id: lbl_iout_g
            text: {format: "Iout  %.3fA", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_i
            series_id: ser_i
            value: !lambda 'return (int)(x * 1000);'
    power_out:
      id: opendps_output_power
      on_value:
        - lvgl.label.update:
            id: lbl_pout
            text: {format: "%.2f", args: [x]}
        - lvgl.label.update:
            id: lbl_pout_g
            text: {format: "Pout  %.2fW", args: [x]}
        - lvgl.chart.set_next_value:
            id: chart_p
            series_id: ser_p
            value: !lambda 'return (int)(x * 100);'
    voltage_in:
      id: opendps_input_voltage
      on_value:
        - lvgl.label.update:
            id: lbl_vin
            text: {format: "%.1fV", args: [x]}
    temperature_1:
      id: opendps_temp1
      on_value:
        - lvgl.bar.update:
            id: bar_t1
            value: !lambda 'return (int)x;'
        - lvgl.label.update:
            id: lbl_t1
            text: {format: "%.0f°C", args: [x]}
    temperature_2:
      id: opendps_temp2
      on_value:
        - lvgl.bar.update:
            id: bar_t2
            value: !lambda 'return (int)x;'
        - lvgl.label.update:
            id: lbl_t2
            text: {format: "%.0f°C", args: [x]}

number:
  - platform: template
    id: voltage_number
    name: "Set Voltage"
    icon: mdi:flash-triangle
    min_value: 0
    max_value: 50
    step: 0.1
    unit_of_measurement: "V"
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          id(opendps_id).set_voltage(x);
    on_value:
      - globals.set:
          id: g_vset
          value: !lambda 'return x;'
      - lvgl.slider.update:
          id: sl_v
          value: !lambda 'return (int)(x * 10);'
      - lvgl.label.update:
          id: lbl_setv
          text: {format: "%.2f", args: [x]}
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 50
  - platform: template
    id: current_number
    name: "Set Current Limit"
    icon: mdi:current-dc
    min_value: 0
    max_value: 5
    step: 0.01
    unit_of_measurement: "A"
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          id(opendps_id).set_current(x);
    on_value:
      - globals.set:
          id: g_iset
          value: !lambda 'return x;'
      - lvgl.slider.update:
          id: sl_i
          value: !lambda 'return (int)(x * 100);'
      - lvgl.label.update:
          id: lbl_seti
          text: {format: "%.3f", args: [x]}
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 60

binary_sensor:
  - platform: opendps
    opendps_id: opendps_id
    output_enabled:
      id: dps_output_sensor_id
      name: "OpenDPS Output Enabled"
      icon: mdi:meter-electric-outline
      on_press:
        - lvgl.widget.update:
            id: pwr_ring
            border_color: 0x39FF14
            shadow_color: 0x39FF14
            shadow_width: 16
        - lvgl.label.update:
            id: lbl_pwr
            text: "OUTPUT\nON"
            text_color: 0x39FF14
      on_release:
        - lvgl.widget.update:
            id: pwr_ring
            border_color: 0x555555
            shadow_color: 0x000000
            shadow_width: 0
        - lvgl.label.update:
            id: lbl_pwr
            text: "OUTPUT\nOFF"
            text_color: 0x555555
      web_server:
        sorting_group_id: opendps_sensors
        sorting_weight: 10

select:
  - platform: template
    id: opendps_select_mode
    name: "Select output mode"
    icon: mdi:cog-outline
    options:
      - "cv"
      - "cc"
      - "cp"
    set_action:
      - lambda: |-
          id(opendps_id).set_function(x.c_str());
    on_value:
      - lvgl.widget.update:
          id: led_cv
          bg_color: !lambda 'return (x == "cv") ? lv_color_hex(0x39FF14) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cv") ? lv_color_hex(0x39FF14) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cv") ? 10 : 0;'
      - lvgl.widget.update:
          id: led_cc
          bg_color: !lambda 'return (x == "cc") ? lv_color_hex(0xFFBF00) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cc") ? lv_color_hex(0xFFBF00) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cc") ? 10 : 0;'
      - lvgl.widget.update:
          id: led_cp
          bg_color: !lambda 'return (x == "cp") ? lv_color_hex(0xFF3333) : lv_color_hex(0x1A1A1A);'
          shadow_color: !lambda 'return (x == "cp") ? lv_color_hex(0xFF3333) : lv_color_hex(0x000000);'
          shadow_width: !lambda 'return (x == "cp") ? 10 : 0;'
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 40

switch:
  - platform: template
    name: "OpenDPS Output"
    id: dps_output_switch
    icon: "mdi:power"
    lambda: |-
      return id(dps_output_sensor_id).state;
    turn_on_action:
      - opendps.enable_output:
          id: opendps_id
          enable: true
    turn_off_action:
      - opendps.enable_output:
          id: opendps_id
          enable: false
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 30
  - platform: template
    name: "Lock OpenDPS"
    id: dps_lock_switch
    icon: "mdi:lock"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - opendps.lock:
          id: opendps_id
          locked: true
    turn_off_action:
      - opendps.lock:
          id: opendps_id
          locked: false
    web_server:
      sorting_group_id: opendps_control
      sorting_weight: 20

lvgl:
