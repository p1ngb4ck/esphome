# OpenDPS Calibration Example Configuration
# This example demonstrates the complete calibration workflow using ESPHome UI
# with text input fields for each calibration parameter.
#
# Features:
# - Text input fields for each calibration coefficient (V_ADC_K, V_ADC_C, etc.)
# - On-boot loading of current calibration values from the device
# - Single "Set All Calibration" button to apply all values at once
# - Calibration Assistant for guided calibration (requires two input voltages)
# - Calibration backup/restore to SD storage

esphome:
  name: opendps-calibration
  platform: ESP32
  board: esp32dev
  on_boot:
    priority: -100  # Run after everything is initialized
    then:
      - delay: 2s  # Wait for OpenDPS connection
      - opendps.request_calibration_report:
          id: opendps_id
      - delay: 500ms  # Wait for report
      - lambda: |-
          // Load current calibration values into text inputs
          auto &cal = id(opendps_id).get_calibration_data();

          char buf[32];
          snprintf(buf, sizeof(buf), "%.6f", cal.v_adc_k);
          id(input_v_adc_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.v_adc_c);
          id(input_v_adc_c).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.v_dac_k);
          id(input_v_dac_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.v_dac_c);
          id(input_v_dac_c).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.a_adc_k);
          id(input_a_adc_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.a_adc_c);
          id(input_a_adc_c).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.a_dac_k);
          id(input_a_dac_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.a_dac_c);
          id(input_a_dac_c).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.vin_adc_k);
          id(input_vin_adc_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.vin_adc_c);
          id(input_vin_adc_c).publish_state(buf);

          ESP_LOGI("cal", "Loaded calibration values from device");

external_components:
  - source: github://p1ngb4ck/esphome@dev
    components: [opendps, storage, sd_storage]
    refresh: 0s

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_password

# Storage for calibration backup
storage:
  - id: storage_id

sd_storage:
  spi_id: spi_bus
  id: sd_storage_id
  type: sd_spi
  cs_pin: GPIO5
  path: "/sd"

spi:
  id: spi_bus
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18

uart:
  id: opendps_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

# ==============================================================================
# OpenDPS Component
# ==============================================================================
opendps:
  id: opendps_id
  uart_id: opendps_uart
  update_interval: 100ms

  # TCP bridge for dpsctl.py access
  tcp_bridge:
    port: 5005
    disconnect_delay: 1s
    frame_timeout: 500ms

  # Calibration backup configuration
  calibration_backup:
    path: "/sd/opendps_calibration.cfg"
    auto_restore: true

  bootloader_baud_rate: 9600

# ==============================================================================
# Globals for Calibration Assistant parameters
# ==============================================================================
globals:
  # Two input voltages for two-point VIN calibration (like dpsctl.py)
  - id: cal_vin_low_mv
    type: float
    initial_value: "12000"  # e.g., 12V
  - id: cal_vin_high_mv
    type: float
    initial_value: "48000"  # e.g., 48V
  - id: cal_load_resistance
    type: float
    initial_value: "10.0"
  - id: cal_load_max_wattage
    type: float
    initial_value: "50.0"
  - id: cal_max_dps_current
    type: float
    initial_value: "5.0"

# ==============================================================================
# Sensors
# ==============================================================================
sensor:
  - platform: opendps
    opendps_id: opendps_id
    voltage_in:
      name: "Input Voltage"
      id: vin
    voltage_out:
      name: "Output Voltage"
      id: vout
    current_out:
      name: "Output Current"
      id: iout
    power_out:
      name: "Output Power"
      id: pout

# ==============================================================================
# Text Inputs for Calibration Coefficients
# ==============================================================================
text:
  # --- Voltage Calibration ---
  - platform: template
    name: "Cal: V_ADC_K"
    id: input_v_adc_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: V_ADC_C"
    id: input_v_adc_c
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: V_DAC_K"
    id: input_v_dac_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: V_DAC_C"
    id: input_v_dac_c
    mode: text
    optimistic: true

  # --- Current Calibration ---
  - platform: template
    name: "Cal: A_ADC_K"
    id: input_a_adc_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: A_ADC_C"
    id: input_a_adc_c
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: A_DAC_K"
    id: input_a_dac_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: A_DAC_C"
    id: input_a_dac_c
    mode: text
    optimistic: true

  # --- Input Voltage Calibration ---
  - platform: template
    name: "Cal: VIN_ADC_K"
    id: input_vin_adc_k
    mode: text
    optimistic: true

  - platform: template
    name: "Cal: VIN_ADC_C"
    id: input_vin_adc_c
    mode: text
    optimistic: true

  # --- Calibration Assistant Parameters ---
  - platform: template
    name: "Cal Assist: Vin Low (mV)"
    id: input_vin_low
    mode: text
    optimistic: true
    initial_value: "12000"
    on_value:
      - lambda: |-
          id(cal_vin_low_mv) = atof(x.c_str());
          ESP_LOGI("cal", "Vin LOW set to: %.0f mV", id(cal_vin_low_mv));

  - platform: template
    name: "Cal Assist: Vin High (mV)"
    id: input_vin_high
    mode: text
    optimistic: true
    initial_value: "48000"
    on_value:
      - lambda: |-
          id(cal_vin_high_mv) = atof(x.c_str());
          ESP_LOGI("cal", "Vin HIGH set to: %.0f mV", id(cal_vin_high_mv));

  - platform: template
    name: "Cal Assist: Load Resistance (Ohm)"
    id: input_load_resistance
    mode: text
    optimistic: true
    initial_value: "10.0"
    on_value:
      - lambda: |-
          id(cal_load_resistance) = atof(x.c_str());
          ESP_LOGI("cal", "Load resistance set to: %.2f Ohm", id(cal_load_resistance));

  - platform: template
    name: "Cal Assist: Load Max Wattage (W)"
    id: input_load_wattage
    mode: text
    optimistic: true
    initial_value: "50.0"
    on_value:
      - lambda: |-
          id(cal_load_max_wattage) = atof(x.c_str());
          ESP_LOGI("cal", "Load max wattage set to: %.1f W", id(cal_load_max_wattage));

  - platform: template
    name: "Cal Assist: Max DPS Current (A)"
    id: input_max_current
    mode: text
    optimistic: true
    initial_value: "5.0"
    on_value:
      - lambda: |-
          id(cal_max_dps_current) = atof(x.c_str());
          ESP_LOGI("cal", "Max DPS current set to: %.1f A", id(cal_max_dps_current));

# ==============================================================================
# Text Sensors for Calibration Status
# ==============================================================================
text_sensor:
  - platform: template
    name: "Calibration Status"
    id: cal_status
    update_interval: 1s
    lambda: |-
      auto state = id(opendps_id).get_calibration_assistant_state();
      const char* prompt = id(opendps_id).get_calibration_assistant_prompt();
      if (state == opendps::CAL_IDLE) {
        return std::string("Idle - Ready to calibrate");
      }
      return std::string(prompt);

# ==============================================================================
# Buttons for Calibration Control
# ==============================================================================
button:
  # --- Request/Refresh Calibration Values ---
  - platform: template
    name: "Request Calibration Report"
    on_press:
      - opendps.request_calibration_report:
          id: opendps_id
      - delay: 500ms
      - lambda: |-
          // Update text inputs with current values
          auto &cal = id(opendps_id).get_calibration_data();
          char buf[32];
          snprintf(buf, sizeof(buf), "%.6f", cal.v_adc_k);
          id(input_v_adc_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.v_adc_c);
          id(input_v_adc_c).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.v_dac_k);
          id(input_v_dac_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.v_dac_c);
          id(input_v_dac_c).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.a_adc_k);
          id(input_a_adc_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.a_adc_c);
          id(input_a_adc_c).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.a_dac_k);
          id(input_a_dac_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.a_dac_c);
          id(input_a_dac_c).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.vin_adc_k);
          id(input_vin_adc_k).publish_state(buf);
          snprintf(buf, sizeof(buf), "%.6f", cal.vin_adc_c);
          id(input_vin_adc_c).publish_state(buf);
          ESP_LOGI("cal", "Updated text inputs with current calibration values");

  # --- Set All Calibration Parameters ---
  - platform: template
    name: "Set All Calibration"
    on_press:
      - lambda: |-
          ESP_LOGI("cal", "Setting all calibration parameters from text inputs");
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "V_ADC_K"
          calibration_value: !lambda "return atof(id(input_v_adc_k).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "V_ADC_C"
          calibration_value: !lambda "return atof(id(input_v_adc_c).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "V_DAC_K"
          calibration_value: !lambda "return atof(id(input_v_dac_k).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "V_DAC_C"
          calibration_value: !lambda "return atof(id(input_v_dac_c).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "A_ADC_K"
          calibration_value: !lambda "return atof(id(input_a_adc_k).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "A_ADC_C"
          calibration_value: !lambda "return atof(id(input_a_adc_c).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "A_DAC_K"
          calibration_value: !lambda "return atof(id(input_a_dac_k).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "A_DAC_C"
          calibration_value: !lambda "return atof(id(input_a_dac_c).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "VIN_ADC_K"
          calibration_value: !lambda "return atof(id(input_vin_adc_k).state.c_str());"
      - opendps.set_calibration:
          id: opendps_id
          calibration_name: "VIN_ADC_C"
          calibration_value: !lambda "return atof(id(input_vin_adc_c).state.c_str());"
      - logger.log: "All calibration parameters set"

  # --- Clear All Calibration ---
  - platform: template
    name: "Clear All Calibration"
    on_press:
      - opendps.clear_calibration:
          id: opendps_id
      - logger.log: "Cleared all calibration (reset to defaults)"

  # --- Calibration Backup/Restore ---
  - platform: template
    name: "Save Calibration to Storage"
    on_press:
      - opendps.request_calibration_report:
          id: opendps_id
      - delay: 500ms
      - opendps.save_calibration:
          id: opendps_id
      - logger.log: "Calibration saved to storage"

  - platform: template
    name: "Restore Calibration from Storage"
    on_press:
      - opendps.restore_calibration:
          id: opendps_id
      - logger.log: "Calibration restored from storage"

  # --- Calibration Assistant (Two-Point VIN like dpsctl.py) ---
  - platform: template
    name: "Start Calibration Assistant"
    on_press:
      - lambda: |-
          ESP_LOGI("cal", "Starting calibration assistant with:");
          ESP_LOGI("cal", "  Vin LOW: %.0f mV", id(cal_vin_low_mv));
          ESP_LOGI("cal", "  Vin HIGH: %.0f mV", id(cal_vin_high_mv));
          ESP_LOGI("cal", "  Load resistance: %.2f Ohm", id(cal_load_resistance));
          ESP_LOGI("cal", "  Load max wattage: %.1f W", id(cal_load_max_wattage));
          ESP_LOGI("cal", "  Max DPS current: %.1f A", id(cal_max_dps_current));
      - opendps.start_calibration_assistant:
          id: opendps_id
          vin_low_measured_mv: !lambda "return id(cal_vin_low_mv);"
          vin_high_measured_mv: !lambda "return id(cal_vin_high_mv);"
          load_resistance: !lambda "return id(cal_load_resistance);"
          load_max_wattage: !lambda "return id(cal_load_max_wattage);"
          max_dps_current: !lambda "return id(cal_max_dps_current);"

  - platform: template
    name: "Calibration Step (confirm/continue)"
    on_press:
      - opendps.calibration_assistant_step:
          id: opendps_id
          measured_value: 0

  - platform: template
    name: "Cancel Calibration"
    on_press:
      - opendps.cancel_calibration_assistant:
          id: opendps_id
      - logger.log: "Calibration cancelled"

web_server:
  version: 3
