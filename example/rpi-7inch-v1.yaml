# Raspberry Pi 7" Touch Display v1 on an ESP32-P4: minimal config, ESPHome defaults, the display parts from the
# branch rpi7-v1-upstream. Shows the display's test card. Tested with the Guition JC-ESP32P4-M3-Dev; should work on
# any ESP32-P4 board with a DSI connector (set the board-specific options, see README).

esphome:
  name: esp32-p4-rpi7-generic
  friendly_name: ESP32-P4-RPi7-Generic
  on_boot:
    # ATTINY88 (0x45): powers the panel and releases the bridge reset before the display (600) sets up.
    # Blocking on purpose: with delay actions the display would set up first.
    - priority: 850
      then:
        - lambda: |-
            auto write = [](uint8_t reg, uint8_t value, uint32_t ms) {
              id(attiny).write_byte(reg, value);
              delay(ms);
            };
            write(0x85, 0x00, 30);   // POWERON off
            write(0x86, 0x00, 8);    // PWM off
            write(0x83, 0x00, 8);    // PORTC: bridge, LCD and touch in reset
            write(0x81, 0x08, 8);    // PORTA: LCD_UD (panel rotated 180 degrees; 0x04 LCD_LR: Linux default)
            write(0x82, 0x80, 8);    // PORTB: LCD_MAIN
            write(0x83, 0x01, 88);   // PORTC: LED_EN
            write(0x83, 0x0D, 8);    // PORTC: RST_LCD_N, RST_BRIDGE_N released
            write(0x8D, 0x04, 8);    // bridge register 0x047C = 0
            write(0x8C, 0x7C, 8);
            write(0x90, 0x00, 8);
            write(0x91, 0x00, 108);
            write(0x83, 0x0F, 8);    // PORTC: RST_TP_N released

esp32:
  variant: ESP32P4
  flash_size: 16MB
  framework:
    type: esp-idf

external_components:
  - source: github://p1ngb4ck/esphome@rpi7-v1-upstream
    components:
      - mipi_dsi  # changed upstream component: link options, generic commands, model RPI-7INCH-V1
      - ft5x06    # changed upstream component: other FT5x06-family vendor IDs, 0xFF touch count
    refresh: always

psram:
  mode: hex
  speed: 200MHz

# MIPI DSI PHY supply
esp_ldo:
  - channel: 3
    voltage: 2.5V

# Wi-Fi through the ESP32-C6: add your board's pins (see README)
esp32_hosted:
  variant: ESP32C6

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret esphome_encryption_key

ota:
  - platform: esphome

logger:

i2c:  # your board's I2C pins on the display connector
  sda: GPIO7
  scl: GPIO8

i2c_device:
  - id: attiny
    address: 0x45

display:
  - platform: mipi_dsi
    model: RPI-7INCH-V1
    show_test_card: true

touchscreen:
  - platform: ft5x06
    address: 0x38

output:
  - platform: template
    id: backlight_output
    type: float
    write_action:
      - lambda: id(attiny).write_byte(0x86, static_cast<uint8_t>(state * 255.0f));  # PWM

light:
  - platform: monochromatic
    name: Backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
