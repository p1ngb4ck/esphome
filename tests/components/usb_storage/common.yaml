usb_host:

usb_storage:
  id: usb_storage_0
  devices:
    - id: usb_drive_0
      mount_path: /usb
      card_check_interval: never
      luns:
        - id: usb_drive_0_sd2
          lun: 1
          mount_path: /usb_sd2
    - id: usb_drive_1
      mount_path: /usb2
      vid: 0x0781
      pid: 0x5583
      on_mounted:
        - logger.log:
            format: "USB drive mounted at %s"
            args: [mount_path]
