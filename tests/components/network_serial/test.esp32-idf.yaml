uart:
  - id: test_uart
    tx_pin: 17
    rx_pin: 16
    baud_rate: 115200

network_serial:
  - id: my_serial
    host: 192.168.1.100
    port: 2217
    baudrate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
    flow_control: NONE
    dtr: false
    rts: false
    device_node: /dev/ttyNET0
  - id: my_serial_server
    mode: server
    uart_id: test_uart
    port: 2218
