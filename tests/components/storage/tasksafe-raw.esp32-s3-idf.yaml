esphome:
  name: tasksaferaw
esp32:
  board: esp32s3box
  variant: ESP32S3
  framework:
    type: esp-idf
  partitions: ../../test_build_components/partitions_testing.csv
logger:
  level: VERY_VERBOSE
wifi:
  ssid: "test"
  password: "testpassword"

# A hardware SPI bus dedicated to the flash (nothing else on it)
spi:
  - id: flash_bus
    clk_pin: GPIO12
    mosi_pin: GPIO11
    miso_pin: GPIO13

# SD card (task-safe) as the file side for raw transfers
sd_storage:
  id: sd_card
  type: sd_mmc
  clk_pin: GPIO39
  cmd_pin: GPIO40
  data0_pin: GPIO41
  path: /sdcard
  mode_1bit: true

# Raw flash, alone on its bus, opted in as task-safe
binary_storage:
  type: spi_flash
  id: my_flash
  spi_id: flash_bus
  cs_pin: GPIO10
  capacity: 4MB
  assume_exclusive_bus: true

storage:
  worker_update_interval: 5ms
