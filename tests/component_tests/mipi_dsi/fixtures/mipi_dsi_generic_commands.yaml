esphome:
  name: p4-test

esp32:
  board: esp32-p4-evboard
  framework:
    type: esp-idf

psram:
  speed: 200MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    model: custom
    id: generic_display
    command_mode: generic
    dimensions:
      width: 800
      height: 480
    hsync_back_porch: 44
    hsync_pulse_width: 2
    hsync_front_porch: 131
    vsync_back_porch: 21
    vsync_pulse_width: 2
    vsync_front_porch: 7
    pclk_frequency: 30MHz
    lane_bit_rate: 720Mbps
    init_sequence:
      - [0x64, 0x04, 0x0F, 0x04, 0x00, 0x00]
      - delay 10ms
      - [0x11]
  - platform: mipi_dsi
    model: custom
    id: dcs_display
    dimensions:
      width: 800
      height: 480
    hsync_back_porch: 44
    hsync_pulse_width: 2
    hsync_front_porch: 131
    vsync_back_porch: 21
    vsync_pulse_width: 2
    vsync_front_porch: 7
    pclk_frequency: 30MHz
    lane_bit_rate: 720Mbps
    init_sequence:
      - [0x64, 0x04, 0x0F, 0x04, 0x00, 0x00]
